datasets:
  nhtsa_complaints:
    type: file
    path: data/nhtsa_vehicle_safety/complaints.csv
  nhtsa_recalls:
    type: file
    path: data/nhtsa_vehicle_safety/recalls.jsonl
  nhtsa_investigation_reports:
    type: file
    path: data/nhtsa_vehicle_safety/investigation_reports/*.txt

default_model: Qwen3.5-397B-A17B
default_lm_api_base: https://llm-endpoint.example/v1

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: https://llm-endpoint.example/v1
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: extract_cited_recall_cores
    type: map
    optimize: true
    prompt: |
      Extract every NHTSA vehicle recall campaign number cited in this
      investigation report.

      Normalize each citation to its canonical core in the form YYVNNN: two-digit
      campaign year, the letter V, and the three-digit campaign sequence. For
      example, a full campaign number ending in manufacturer-extension digits
      must be reduced to its YYVNNN core. Include only actual recall-number
      citations, preserve no extra text, and deduplicate the returned list. Return
      an empty list when the report cites no recall number.

      Investigation report:
      {{ input.body }}
    output:
      mode: structured_output
      schema:
        cited_recall_cores: "list[string]"
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: normalize_extracted_recall_cores
    type: code_map
    code: |
      def transform(doc):
          import re

          cores = set()
          for value in doc.get("cited_recall_cores") or []:
              compact = re.sub(r"[^0-9A-Za-z]", "", str(value)).upper()
              match = re.search(r"(\d{2})V(\d{3})", compact)
              if match:
                  cores.add(
                      f"{match.group(1)}V{match.group(2)}"
                  )
          return {"cited_recall_cores": sorted(cores)}

  - name: collect_investigation_cited_cores
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          cores = {
              str(core)
              for item in items
              for core in (item.get("cited_recall_cores") or [])
              if str(core)
          }
          return {"investigation_cited_cores": sorted(cores)}

  - name: filter_selected_make_recalls
    type: code_filter
    code: |
      def transform(doc):
          vehicle = doc.get("vehicle") or {}
          return vehicle.get("make") in {
              "FORD",
              "JEEP",
              "HONDA",
              "TESLA",
          }

  - name: flatten_selected_make_recall_fields
    type: code_map
    code: |
      def transform(doc):
          campaign = doc.get("campaign") or {}
          vehicle = doc.get("vehicle") or {}
          component = doc.get("component") or {}
          risk = doc.get("risk") or {}
          return {
              "campaign_number": campaign.get("number"),
              "make": vehicle.get("make"),
              "component_id": component.get("component_id"),
              "defect_summary": risk.get("defect_summary") or "",
          }

  - name: aggregate_recall_statistics_by_make
    type: code_reduce
    reduce_key: make
    code: |
      def transform(items):
          import re

          campaign_numbers = {
              str(item.get("campaign_number"))
              for item in items
              if item.get("campaign_number")
          }
          recall_cores = set()
          for campaign_number in campaign_numbers:
              match = re.search(
                  r"(\d{2})V(\d{3})",
                  campaign_number.upper(),
              )
              if match:
                  recall_cores.add(
                      f"{match.group(1)}V{match.group(2)}"
                  )
          return {
              "recall_campaign_count": len(campaign_numbers),
              "all_recall_cores": sorted(recall_cores),
          }

  - name: filter_selected_make_complaints
    type: code_filter
    code: |
      def transform(doc):
          return doc.get("make") in {
              "FORD",
              "JEEP",
              "HONDA",
              "TESLA",
          }

  - name: match_selected_make_complaints_to_recalls
    type: equijoin
    comparison_prompt: |
      Determine whether this complaint describes the same underlying defect as
      this recall.

      The pair has already been restricted to the same make and component
      category. Match only when the complaint narrative and recall summary
      identify the same concrete failure mechanism or directly equivalent
      defect. A shared make, component, symptom, consequence, or broad safety
      concern alone is not sufficient.

      COMPLAINT:
      {{ left.summary_text }}

      RECALL DEFECT:
      {{ right.defect_summary }}
    blocking_conditions:
      - left["make"] == right["make"] and left["component_id"] == right["component_id"]
    comparison_model: Qwen3.5-397B-A17B
    timeout: 120
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: collect_corroborated_complaint_counts
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          complaint_ids_by_make = {}
          for item in items:
              make = item.get("make_left") or item.get("make")
              complaint_id = item.get("complaint_id")
              if make and complaint_id:
                  complaint_ids_by_make.setdefault(make, set()).add(
                      complaint_id
                  )
          return {
              "corroborated_counts_by_make": {
                  make: len(complaint_ids)
                  for make, complaint_ids in complaint_ids_by_make.items()
              }
          }

  - name: cross_join_recall_stats_with_complaint_counts
    type: equijoin
    deterministic: true
    blocking_conditions:
      - "True"

  - name: coalesce_corroborated_complaint_count
    type: code_map
    code: |
      def transform(doc):
          make = doc.get("make")
          counts = doc.get("corroborated_counts_by_make") or {}
          return {
              "make": make,
              "recall_campaign_count": doc.get(
                  "recall_campaign_count"
              ),
              "all_recall_cores": doc.get("all_recall_cores") or [],
              "corroborated_complaint_count": int(
                  counts.get(make, 0)
              ),
          }

  - name: cross_join_make_stats_with_investigation_cores
    type: equijoin
    deterministic: true
    blocking_conditions:
      - "True"

  - name: assign_make_alignment_label
    type: code_map
    code: |
      def transform(doc):
          recall_cores = set(doc.get("all_recall_cores") or [])
          cited_cores = set(
              doc.get("investigation_cited_cores") or []
          )
          return {
              "make": doc.get("make"),
              "corroborated_complaint_count": doc.get(
                  "corroborated_complaint_count"
              ),
              "recall_campaign_count": doc.get(
                  "recall_campaign_count"
              ),
              "alignment_label": (
                  "cited"
                  if recall_cores.intersection(cited_cores)
                  else "not_cited"
              ),
          }

  - name: format_make_alignment_dictionary
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          return {
              str(item.get("make")): {
                  "corroborated_complaint_count": item.get(
                      "corroborated_complaint_count"
                  ),
                  "recall_campaign_count": item.get(
                      "recall_campaign_count"
                  ),
                  "alignment_label": item.get("alignment_label"),
              }
              for item in sorted(
                  items,
                  key=lambda row: str(row.get("make") or ""),
              )
              if item.get("make")
          }

pipeline:
  steps:
    - name: investigation_citation_set
      input: nhtsa_investigation_reports
      operations:
        - extract_cited_recall_cores
        - normalize_extracted_recall_cores
        - collect_investigation_cited_cores
    - name: selected_make_recalls
      input: nhtsa_recalls
      operations:
        - filter_selected_make_recalls
        - flatten_selected_make_recall_fields
    - name: recall_statistics_by_make
      input: selected_make_recalls
      operations:
        - aggregate_recall_statistics_by_make
    - name: selected_make_complaints
      input: nhtsa_complaints
      operations:
        - filter_selected_make_complaints
    - name: matched_selected_make_complaints
      operations:
        - match_selected_make_complaints_to_recalls:
            left: selected_make_complaints
            right: selected_make_recalls
    - name: corroborated_complaint_counts
      input: matched_selected_make_complaints
      operations:
        - collect_corroborated_complaint_counts
    - name: make_stats_with_complaint_counts
      operations:
        - cross_join_recall_stats_with_complaint_counts:
            left: recall_statistics_by_make
            right: corroborated_complaint_counts
    - name: make_stats_with_citation_set
      input: make_stats_with_complaint_counts
      operations:
        - coalesce_corroborated_complaint_count
    - name: complete_make_alignment_rows
      operations:
        - cross_join_make_stats_with_investigation_cores:
            left: make_stats_with_citation_set
            right: investigation_citation_set
    - name: make_alignment_dictionary
      input: complete_make_alignment_rows
      operations:
        - assign_make_alignment_label
        - format_make_alignment_dictionary
  output:
    type: file
    path: plan-optimization-moar/standalone/outputs/output_vehicle_safety-043.json
    intermediate_dir: plan-optimization-moar/standalone/intermediates/vehicle_safety-043
