datasets:
  contract_exhibits:
    type: file
    path: contract_exhibit_full.json

default_model: Qwen3.5-397B-A17B
default_lm_api_base: https://llm-endpoint.example/v1
default_embedding_api_base: https://llm-endpoint.example/v1

operations:
  - name: filter_ex31_sox_certifications
    type: filter
    prompt: |
      Determine whether this document is an EX-31 SOX officer certification.

      Document:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        is_ex31_sox_certification: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: extract_ex31_company_and_officer
    type: map
    prompt: |
      Extract the certified company entity and the certifying officer's name and
      title from this EX-31 SOX certification. Include both the name and title in
      certifying_officer.

      Document:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        sox_company: string
        certifying_officer: string
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 192
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: group_ex31_officers_by_company
    type: code_reduce
    reduce_key: sox_company
    code: |
      def transform(items):
          officers = sorted({
              str(item.get("certifying_officer") or "").strip()
              for item in items
              if str(item.get("certifying_officer") or "").strip()
          })
          return {"certifying_officers": officers}

  - name: filter_ex97_clawback_policies
    type: filter
    prompt: |
      Determine whether this document is an EX-97 clawback or
      compensation-recovery policy.

      Document:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        is_ex97_clawback_policy: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: filter_restatement_and_misconduct_recovery
    type: filter
    prompt: |
      Determine whether this clawback policy provides recovery for a financial
      restatement and also permits recovery for misconduct.

      Document:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        permits_both_recovery_bases: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: extract_ex97_company_and_covered_category
    type: map
    prompt: |
      Extract the company entity and a concise normalized covered-person category
      from this EX-97 clawback policy.

      Document:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        clawback_company: string
        covered_person_category: string
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 192
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: deduplicate_ex97_company_categories
    type: code_reduce
    reduce_key:
      - clawback_company
      - covered_person_category
    code: |
      def transform(items):
          return {}

  - name: join_ex31_and_ex97_companies
    type: equijoin
    comparison_prompt: |
      Determine whether these names refer to the same company entity despite
      naming, punctuation, abbreviation, or corporate-suffix variation.

      EX-31 COMPANY:
      {{ left.sox_company }}

      EX-97 COMPANY:
      {{ right.clawback_company }}
    blocking_keys:
      left: [sox_company]
      right: [clawback_company]
    blocking_target_recall: 0.95
    embedding_model: openai/Qwen3-Embedding-8B
    comparison_model: Qwen3.5-397B-A17B
    timeout: 120
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: format_ex31_ex97_matches
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          rows = [
              {
                  "company": item.get("sox_company"),
                  "certifying_officers": item.get("certifying_officers") or [],
                  "covered_person_category": item.get("covered_person_category"),
              }
              for item in items
          ]
          return {"rows": rows}

  - name: unnest_ex31_ex97_matches
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - company
      - certifying_officers
      - covered_person_category

pipeline:
  steps:
    - name: ex31_company_groups
      input: contract_exhibits
      operations:
        - filter_ex31_sox_certifications
        - extract_ex31_company_and_officer
        - group_ex31_officers_by_company
    - name: ex97_company_categories
      input: contract_exhibits
      operations:
        - filter_ex97_clawback_policies
        - filter_restatement_and_misconduct_recovery
        - extract_ex97_company_and_covered_category
        - deduplicate_ex97_company_categories
    - name: ex31_ex97_company_matches
      operations:
        - join_ex31_and_ex97_companies:
            left: ex31_company_groups
            right: ex97_company_categories
    - name: answer
      input: ex31_ex97_company_matches
      operations:
        - format_ex31_ex97_matches
        - unnest_ex31_ex97_matches
  output:
    type: file
    path: plan-optimization-moar/standalone/outputs/output_legal_contracts-088.json
    intermediate_dir: plan-optimization-moar/standalone/intermediates/legal_contracts-088
