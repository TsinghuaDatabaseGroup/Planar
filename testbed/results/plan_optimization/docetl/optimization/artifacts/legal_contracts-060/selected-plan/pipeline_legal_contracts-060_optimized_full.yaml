datasets:
  contract_exhibits:
    type: file
    path: contract_exhibit_full.json
default_model: Qwen3.5-397B-A17B
default_lm_api_base: https://llm-endpoint.example/v1
operations:
- name: filter_nda_or_confidentiality_agreement
  type: filter
  prompt: 'Determine whether this document is a non-disclosure or confidentiality

    agreement.


    Document:

    {{ input.contents }}

    '
  output:
    mode: structured_output
    schema:
      is_confidentiality_agreement: boolean
  litellm_completion_kwargs:
    temperature: 0
    max_tokens: 64
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
- name: filter_residual_information_and_governing_law
  type: filter
  prompt: 'Keep this agreement only if it contains a residual-information clause that

    permits use of information retained in unaided memory and expressly states a

    governing law.


    Agreement:

    {{ input.contents }}

    '
  output:
    mode: structured_output
    schema:
      meets_residual_information_condition: boolean
  litellm_completion_kwargs:
    temperature: 0
    max_tokens: 64
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
- name: extract_direction_and_governing_law
  type: map
  prompt: 'Extract the nondisclosure direction and the governing-law jurisdiction from

    this agreement. Normalize the jurisdiction to its full English name. Describe

    the nondisclosure direction concisely according to which party or parties owe

    confidentiality obligations, without inferring terms not stated in the

    agreement.


    Agreement:

    {{ input.contents }}

    '
  output:
    mode: structured_output
    schema:
      non_disclosure_direction: string
      governing_law: string
  litellm_completion_kwargs:
    temperature: 0
    max_tokens: 192
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
- name: project_answer_fields
  type: code_map
  code: "def transform(doc):\n    return {\n        \"document_id\": str(doc.get(\"doc_id\") or \"\"),\n\
    \        \"non_disclosure_direction\": str(\n            doc.get(\"non_disclosure_direction\") or\
    \ \"\"\n        ).strip(),\n        \"governing_law\": str(doc.get(\"governing_law\") or \"\").strip(),\n\
    \    }\n"
pipeline:
  steps:
  - name: answer_rows
    input: contract_exhibits
    operations:
    - filter_nda_or_confidentiality_agreement
    - filter_residual_information_and_governing_law
    - extract_direction_and_governing_law
    - project_answer_fields
  output:
    type: file
    path: /home/macly/benchmark_v3/baseline/docetl/plan-optimization-moar/runs/moar-all-001/legal_contracts-060/outputs/output_legal_contracts-060.json
    intermediate_dir: /home/macly/benchmark_v3/baseline/docetl/plan-optimization-moar/runs/moar-all-001/legal_contracts-060/intermediates
bypass_cache: true
