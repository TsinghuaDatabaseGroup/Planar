datasets:
  safety_barrier_candidates:
    type: file
    path: data/operator_implement/inputs/NASA_ASRS-030_safety_barrier_candidates.jsonl
operations:
- name: unnest_answer_rows
  type: unnest
  unnest_key: rows
  recursive: true
  depth: 2
  expand_fields:
  - barrier_status
  - incident_count
  model: Qwen3.5-397B-A17B
- name: aggregate_barrier_statuses
  type: code_reduce
  reduce_key: _all
  code: "def transform(items):\n    label_order = [\"successful_barrier\", \"not_fully_supported\"]\n\
    \    incident_ids = {label: set() for label in label_order}\n    for item in items:\n        label\
    \ = item.get(\"barrier_status\")\n        incident_id = str(item.get(\"incident_id\") or \"\")\n \
    \       if label in incident_ids and incident_id:\n            incident_ids[label].add(incident_id)\n\
    \    return {\n        \"rows\": [\n            {\n                \"barrier_status\": label,\n  \
    \              \"incident_count\": len(incident_ids[label]),\n            }\n            for label\
    \ in label_order\n            if incident_ids[label]\n        ]\n    }\n"
  model: Qwen3.5-397B-A17B
- name: assign_safety_barrier_status
  type: map
  prompt: 'Assign exactly one barrier_status. Use successful_barrier only when the

    narrative clearly establishes hazard detection, a concrete intervention, and

    avoidance of a worse consequence or stabilization of the situation.

    Otherwise use not_fully_supported.


    Report:

    {{ input.text }}

    '
  output:
    mode: structured_output
    schema:
      barrier_status: enum[successful_barrier, not_fully_supported]
  litellm_completion_kwargs:
    temperature: 0
    max_tokens: 128
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  model: Qwen3.5-397B-A17B
pipeline:
  steps:
  - name: process
    operations:
    - assign_safety_barrier_status
    - aggregate_barrier_statuses
    - unnest_answer_rows
    input: safety_barrier_candidates
  output:
    type: file
    path: raw_outputs/aviation_safety/output_aviation_safety-021.json
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
default_embedding_api_base: ${EMBEDDING_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  num_plans_to_evaluate_in_parallel: 1
