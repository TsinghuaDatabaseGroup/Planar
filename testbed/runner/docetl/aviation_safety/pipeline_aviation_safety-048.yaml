datasets:
  asrs_events:
    type: file
    path: data/asrs/events.csv
  asrs_components:
    type: file
    path: data/asrs/components.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
default_embedding_api_base: ${EMBEDDING_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_recorded_disruption_results
    type: code_filter
    code: |
      def transform(doc):
          return (
              doc.get("event_type") == "result"
              and doc.get("label")
              in {
                  "General Flight Cancelled / Delayed",
                  "Flight Crew Returned To Departure Airport",
                  "General Maintenance Action",
              }
          )

  - name: collect_recorded_results
    type: code_reduce
    reduce_key: incident_id
    code: |
      def transform(items):
          allowed = {
              "General Flight Cancelled / Delayed",
              "Flight Crew Returned To Departure Airport",
              "General Maintenance Action",
          }
          return {
              "recorded_results": [
                  item.get("label")
                  for item in items
                  if item.get("label") in allowed
              ]
          }

  - name: attach_incident_text_file
    type: code_map
    code: |
      import csv
      import os
      import threading

      _incident_text_index = None
      _incident_text_lock = threading.Lock()

      def load_incident_text_index():
          global _incident_text_index
          if _incident_text_index is None:
              with _incident_text_lock:
                  if _incident_text_index is None:
                      index = {}
                      path = os.path.abspath(
                          os.path.join("data", "asrs", "incidents.csv")
                      )
                      with open(
                          path, "r", encoding="utf-8", errors="replace", newline=""
                      ) as handle:
                          for row in csv.DictReader(handle):
                              incident_id = str(row.get("incident_id", ""))
                              text_file = str(row.get("text_file", ""))
                              if incident_id and text_file:
                                  index.setdefault(incident_id, text_file)
                      _incident_text_index = index
          return _incident_text_index

      def transform(doc):
          return {
              "text_file": load_incident_text_index().get(
                  str(doc.get("incident_id", ""))
              )
          }

  - name: inner_join_incident_records
    type: code_filter
    code: |
      def transform(doc):
          return bool(doc.get("text_file"))

  - name: load_asrs_narrative
    type: code_map
    code: |
      def transform(doc):
          import os

          base_dir = os.path.abspath(os.path.join("data", "asrs"))
          text_path = os.path.abspath(
              os.path.join(base_dir, str(doc.get("text_file", "")))
          )
          if os.path.commonpath([base_dir, text_path]) != base_dir:
              raise ValueError("ASRS text path escapes data/asrs")
          with open(text_path, "r", encoding="utf-8", errors="replace") as handle:
              text = handle.read()
          return {"text": text}

  - name: filter_maintenance_primary_disruption
    type: filter
    optimize: true
    prompt: |
      Keep this NASA ASRS report only when maintenance was the primary driver of the
      recorded flight disruption. Maintenance may involve a component discrepancy,
      MEL or deferred item, troubleshooting or repair, documentation or release to
      service, or a required inspection.

      Exclude reports where weather, crew legality or scheduling, passenger issues,
      or another non-maintenance cause primarily drove the cancellation, delay,
      return, or maintenance action. A maintenance mention that is only a secondary
      consequence does not qualify.

      Narrative:
      {{ input.text }}
    output:
      mode: structured_output
      schema:
        is_match: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: filter_identifiable_affected_item
    type: filter
    optimize: true
    prompt: |
      This report has already been found to have a maintenance-driven disruption.
      Keep it only when the narrative identifies a specific affected aircraft
      component or required maintenance item.

      The item may be named with an abbreviation, colloquial term, subcomponent, or
      part-to-system wording, but it must be specific enough to match meaningfully to
      an aircraft-component vocabulary. Exclude generic references such as
      "maintenance," "the aircraft," "a problem," or an unidentified item.

      Narrative:
      {{ input.text }}
    output:
      mode: structured_output
      schema:
        is_match: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: extract_maintenance_candidate
    type: map
    optimize: true
    prompt: |
      Extract two concise, narrative-grounded fields from this qualifying NASA ASRS
      maintenance disruption:

      - narrative_affected_item: the specific aircraft component or required item
        as named in the report, preserving meaningful abbreviations or part wording;
      - maintenance_driver_phrase: the condition, task, decision, documentation
        issue, or inspection requirement that primarily drove the disruption.

      Do not replace the affected item with a canonical vocabulary label in this
      extraction step, and do not classify the driver yet.

      Incident ID: {{ input.incident_id }}
      RECORDED RESULTS: {{ input.recorded_results }}
      Narrative:
      {{ input.text }}
    output:
      mode: structured_output
      schema:
        narrative_affected_item: string
        maintenance_driver_phrase: string
    validate:
      - len(output["narrative_affected_item"].strip()) > 0
      - len(output["maintenance_driver_phrase"].strip()) > 0
    num_retries_on_validate_failure: 2
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 128
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: filter_canonical_component_values
    type: code_filter
    code: |
      def transform(doc):
          return (
              doc.get("attribute") == "aircraft_component"
              and bool(str(doc.get("value", "")).strip())
          )

  - name: deduplicate_canonical_components
    type: code_reduce
    reduce_key: value
    code: |
      def transform(items):
          return {"canonical_component": str(items[0].get("value", "")).strip()}

  - name: semantic_component_join
    type: equijoin
    optimize: true
    comparison_prompt: |
      Determine whether the narrative affected-item phrase and canonical aircraft-
      component label denote the same component or have a clear part-to-system
      relationship.

      Return true for synonyms, abbreviations, common aviation naming variants, and
      a specific part clearly belonging to the canonical system/component. Exact
      spelling is not required. Return false for generic topical similarity,
      components that merely interact, or a speculative relationship. Do not use
      incident ID or the recorded result labels as evidence of component identity.

      NARRATIVE AFFECTED ITEM: {{ left.narrative_affected_item }}
      MAINTENANCE DRIVER PHRASE: {{ left.maintenance_driver_phrase }}
      RECORDED RESULTS: {{ left.recorded_results }}
      CANONICAL COMPONENT: {{ right.canonical_component }}
    blocking_keys:
      left:
        - narrative_affected_item
        - maintenance_driver_phrase
      right:
        - canonical_component
    blocking_target_recall: 0.95
    embedding_model: Qwen3-Embedding-8B
    comparison_model: Qwen3.5-397B-A17B
    timeout: 120
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: attach_maintenance_status_records_left
    type: code_map
    code: |
      import csv
      import os
      import threading

      _maintenance_status_index = None
      _maintenance_status_lock = threading.Lock()
      _included_attributes = {
          "maintenance_status_maintenance_deferred",
          "maintenance_status_released_for_service",
          "maintenance_status_records_complete",
          "maintenance_status_required_correct_doc_on_board",
      }

      def load_maintenance_status_index():
          global _maintenance_status_index
          if _maintenance_status_index is None:
              with _maintenance_status_lock:
                  if _maintenance_status_index is None:
                      index = {}
                      path = os.path.abspath(
                          os.path.join("data", "asrs", "aircraft_attributes.csv")
                      )
                      with open(
                          path, "r", encoding="utf-8", errors="replace", newline=""
                      ) as handle:
                          for row in csv.DictReader(handle):
                              attribute = row.get("attribute")
                              if attribute not in _included_attributes:
                                  continue
                              incident_id = str(row.get("incident_id", ""))
                              if incident_id:
                                  index.setdefault(incident_id, []).append(
                                      {
                                          "attribute": attribute,
                                          "value": row.get("value"),
                                      }
                                  )
                      _maintenance_status_index = index
          return _maintenance_status_index

      def transform(doc):
          return {
              "maintenance_status_records": load_maintenance_status_index().get(
                  str(doc.get("incident_id", "")), []
              )
          }

  - name: classify_maintenance_driver
    type: map
    optimize: true
    prompt: |
      Assign exactly one primary maintenance_driver category for this NASA ASRS
      disruption:

      - component_discrepancy_or_failure: the component fault, discrepancy, or
        failure itself primarily drove the disruption;
      - mel_or_deferred_item: an MEL condition, deferral, accepted inoperative item,
        or associated restriction primarily drove it;
      - troubleshooting_or_repair: diagnosis, troubleshooting, corrective work, or
        repair time/action primarily drove it;
      - documentation_or_release_to_service: maintenance records, required
        documents, signoff, authorization, airworthiness release, or return-to-
        service status primarily drove it;
      - required_inspection: a mandatory inspection, check, verification, or
        inspection finding primarily drove it.

      These labels are not a precedence list. Select the category that best captures
      the primary maintenance driver described by the narrative, using recorded
      results and maintenance-status records as supporting context.

      MAINTENANCE DRIVER PHRASE: {{ input.maintenance_driver_phrase }}
      RECORDED RESULTS: {{ input.recorded_results }}
      MAINTENANCE STATUS RECORDS: {{ input.maintenance_status_records }}
      NARRATIVE:
      {{ input.text }}
    output:
      mode: structured_output
      schema:
        maintenance_driver: enum[component_discrepancy_or_failure, mel_or_deferred_item, troubleshooting_or_repair, documentation_or_release_to_service, required_inspection]
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: aggregate_ranked_maintenance_components
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          grouped = {}
          for item in items:
              key = (
                  item.get("maintenance_driver"),
                  item.get("canonical_component"),
              )
              incident_id = str(item.get("incident_id", ""))
              if not all(key) or not incident_id:
                  continue
              values = grouped.setdefault(
                  key,
                  {"incident_ids": set(), "recorded_result_labels": set()},
              )
              values["incident_ids"].add(incident_id)
              values["recorded_result_labels"].update(
                  label
                  for label in (item.get("recorded_results") or [])
                  if label
              )

          rows = [
              {
                  "maintenance_driver": driver,
                  "canonical_component": component,
                  "incident_count": len(values["incident_ids"]),
                  "recorded_result_labels": sorted(
                      values["recorded_result_labels"]
                  ),
              }
              for (driver, component), values in grouped.items()
          ]
          rows.sort(
              key=lambda row: (
                  -row["incident_count"],
                  row["maintenance_driver"],
                  row["canonical_component"],
              )
          )
          for rank, row in enumerate(rows[:15], start=1):
              row["rank"] = rank
          return {"rows": rows[:15]}

  - name: unnest_answer_rows
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - rank
      - maintenance_driver
      - canonical_component
      - incident_count
      - recorded_result_labels

pipeline:
  steps:
    - name: recorded_results
      input: asrs_events
      operations:
        - filter_recorded_disruption_results
        - collect_recorded_results
    - name: result_incidents
      input: recorded_results
      operations:
        - attach_incident_text_file
        - inner_join_incident_records
        - load_asrs_narrative
    - name: maintenance_candidates
      input: result_incidents
      operations:
        - filter_maintenance_primary_disruption
        - filter_identifiable_affected_item
        - extract_maintenance_candidate
    - name: component_vocabulary
      input: asrs_components
      operations:
        - filter_canonical_component_values
        - deduplicate_canonical_components
    - name: semantic_component_matches
      operations:
        - semantic_component_join:
            left: maintenance_candidates
            right: component_vocabulary
    - name: matches_with_maintenance_status
      input: semantic_component_matches
      operations:
        - attach_maintenance_status_records_left
    - name: classified_maintenance_matches
      input: matches_with_maintenance_status
      operations:
        - classify_maintenance_driver
    - name: ranked_maintenance_components
      input: classified_maintenance_matches
      operations:
        - aggregate_ranked_maintenance_components
        - unnest_answer_rows
  output:
    type: file
    path: raw_outputs/aviation_safety/output_aviation_safety-048.json
