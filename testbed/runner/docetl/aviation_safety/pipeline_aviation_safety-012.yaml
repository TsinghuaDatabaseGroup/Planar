datasets:
  asrs_incidents:
    type: file
    path: data/asrs/incidents.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
default_embedding_api_base: ${EMBEDDING_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_aircraft_equipment_problem
    type: code_filter
    code: |
      def transform(doc):
          return "Aircraft Equipment Problem" in str(
              doc.get("anomaly_summary", "")
          )

  - name: load_asrs_narrative
    type: code_map
    code: |
      def transform(doc):
          import os

          base_dir = os.path.abspath(os.path.join("data", "asrs"))
          text_path = os.path.abspath(
              os.path.join(base_dir, str(doc.get("text_file", "")))
          )
          if os.path.commonpath([base_dir, text_path]) != base_dir:
              raise ValueError("ASRS text path escapes data/asrs")
          with open(text_path, "r", encoding="utf-8", errors="replace") as handle:
              text = handle.read()
          return {"text": text}

  - name: classify_post_troubleshooting_status
    type: map
    optimize: true
    prompt: |
      Assign exactly one post_troubleshooting_status for this NASA ASRS report.
      First require active troubleshooting by the flight crew or maintenance, such
      as diagnosing, testing, cycling, resetting, isolating, inspecting, repairing,
      replacing, or otherwise attempting to correct an aircraft-equipment problem.
      A mere observation, write-up, or mention of an equipment issue is not active
      troubleshooting.

      If active troubleshooting and a resulting status are described, apply this
      precedence from highest to lowest:

      1. still_unsafe: the problem persisted after troubleshooting, remained
         unresolved, continued to affect operation, or left the aircraft unsafe;
      2. intermittent: the symptom disappeared or temporarily cleared, but its
         cause or resolution remained uncertain, or it later recurred;
      3. resolved: a corrective action clearly fixed, cleared, or verified removal
         of the problem.

      Use not_target when active troubleshooting is not described or its resulting
      status cannot be determined. A structured result saying that the equipment
      problem dissipated may support resolved only when the narrative is
      consistent with that conclusion. Do not let that structured phrase override
      narrative evidence of persistence, uncertainty, or recurrence.

      Structured result summary:
      {{ input.result_summary }}

      Narrative:
      {{ input.text }}
    output:
      mode: structured_output
      schema:
        post_troubleshooting_status: enum[still_unsafe, intermittent, resolved, not_target]
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: keep_target_troubleshooting_statuses
    type: code_filter
    code: |
      def transform(doc):
          return doc.get("post_troubleshooting_status") in {
              "still_unsafe",
              "intermittent",
              "resolved",
          }

  - name: aggregate_by_troubleshooting_status
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          status_order = ["still_unsafe", "intermittent", "resolved"]
          incident_ids = {status: set() for status in status_order}

          for item in items:
              incident_id = str(item.get("incident_id", ""))
              status = item.get("post_troubleshooting_status")
              if incident_id and status in incident_ids:
                  incident_ids[status].add(incident_id)

          rows = []
          for status in status_order:
              if not incident_ids[status]:
                  continue
              rows.append(
                  {
                      "post_troubleshooting_status": status,
                      "incident_count": len(incident_ids[status]),
                  }
              )
          return {"rows": rows}

  - name: unnest_answer_rows
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - post_troubleshooting_status
      - incident_count

pipeline:
  steps:
    - name: process
      input: asrs_incidents
      operations:
        - filter_aircraft_equipment_problem
        - load_asrs_narrative
        - classify_post_troubleshooting_status
        - keep_target_troubleshooting_statuses
        - aggregate_by_troubleshooting_status
        - unnest_answer_rows
  output:
    type: file
    path: raw_outputs/aviation_safety/output_aviation_safety-012.json
