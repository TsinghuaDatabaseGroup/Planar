datasets:
  asrs_assessments:
    type: file
    path: data/asrs/assessments.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
default_embedding_api_base: ${EMBEDDING_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_aircraft_human_factor_labels
    type: code_filter
    code: |
      def transform(doc):
          return (
              doc.get("assessment_type") == "contributing_factor"
              and doc.get("label") in {"Aircraft", "Human Factors"}
          )

  - name: collect_contributing_labels
    type: code_reduce
    reduce_key: incident_id
    code: |
      def transform(items):
          return {
              "contributing_labels": [
                  item.get("label")
                  for item in items
                  if item.get("label") in {"Aircraft", "Human Factors"}
              ]
          }

  - name: filter_dual_factor_incidents
    type: code_filter
    code: |
      def transform(doc):
          labels = doc.get("contributing_labels") or []
          return "Aircraft" in labels and "Human Factors" in labels

  - name: attach_incident_text_file
    type: code_map
    code: |
      import csv
      import os
      import threading

      _incident_text_index = None
      _incident_text_lock = threading.Lock()

      def load_incident_text_index():
          global _incident_text_index
          if _incident_text_index is None:
              with _incident_text_lock:
                  if _incident_text_index is None:
                      index = {}
                      path = os.path.abspath(
                          os.path.join("data", "asrs", "incidents.csv")
                      )
                      with open(
                          path, "r", encoding="utf-8", errors="replace", newline=""
                      ) as handle:
                          for row in csv.DictReader(handle):
                              incident_id = str(row.get("incident_id", ""))
                              text_file = str(row.get("text_file", ""))
                              if incident_id and text_file:
                                  index.setdefault(incident_id, text_file)
                      _incident_text_index = index
          return _incident_text_index

      def transform(doc):
          return {
              "text_file": load_incident_text_index().get(
                  str(doc.get("incident_id", ""))
              )
          }

  - name: inner_join_incident_records
    type: code_filter
    code: |
      def transform(doc):
          return bool(doc.get("text_file"))

  - name: load_asrs_narrative
    type: code_map
    code: |
      def transform(doc):
          import os

          base_dir = os.path.abspath(os.path.join("data", "asrs"))
          text_path = os.path.abspath(
              os.path.join(base_dir, str(doc.get("text_file", "")))
          )
          if os.path.commonpath([base_dir, text_path]) != base_dir:
              raise ValueError("ASRS text path escapes data/asrs")
          with open(text_path, "r", encoding="utf-8", errors="replace") as handle:
              text = handle.read()
          return {"text": text}

  - name: extract_equipment_human_causal_chain
    type: map
    optimize: true
    prompt: |
      Recover the causal chain linking aircraft equipment and human factors in this
      NASA ASRS narrative. The structured contributing labels establish only that
      both factor families were recorded; they do not establish causal weighting.

      Return:
      - causal_chain_recovered: true only when the narrative supports a clear causal
        sequence involving the equipment context and human action or condition;
      - initiating_event: the event or condition that began the chain;
      - human_factor_event: the causally relevant human action or condition;
      - intervention: the response or corrective intervention;
      - causal_order: a concise phrase stating the order between the relevant
        equipment event, human factor, and intervention.

      Keep each free-text value to a nonempty phrase of at most eight words when the
      chain is recoverable. If it is not recoverable, set causal_chain_recovered to
      false and use "unclear" for the four text fields. Do not assign the final
      attribution category in this extraction step.

      Incident ID: {{ input.incident_id }}
      CONTRIBUTING LABELS: {{ input.contributing_labels }}
      Narrative:
      {{ input.text }}
    output:
      mode: structured_output
      schema:
        causal_chain_recovered: boolean
        initiating_event: string
        human_factor_event: string
        intervention: string
        causal_order: string
    validate:
      - 1 <= len(output["initiating_event"].split()) <= 8
      - 1 <= len(output["human_factor_event"].split()) <= 8
      - 1 <= len(output["intervention"].split()) <= 8
      - 1 <= len(output["causal_order"].split()) <= 8
    num_retries_on_validate_failure: 2
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 256
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: omit_unrecoverable_causal_chains
    type: code_filter
    code: |
      def transform(doc):
          return doc.get("causal_chain_recovered") is True

  - name: classify_equipment_human_attribution
    type: map
    optimize: true
    prompt: |
      Determine the causal weighting in this recoverable NASA ASRS equipment-human
      factor chain. Return attribution_is_clear=true only when one of these three
      categories is supported without unresolved ambiguity:

      - mainly_equipment_driven: equipment initiated the chain and human actions or
        conditions were secondary responses, consequences, or amplifiers;
      - mainly_human_factor_driven: a decision, procedure, communication, awareness,
        or other human failure was primary despite equipment context;
      - mixed_equipment_human_factor: both the equipment condition and human factor
        were necessary causal contributors, with neither merely a downstream
        response to the other.

      Assign attribution_category to the supported label. If the narrative does not
      support a clear weighting, set attribution_is_clear=false; the required label
      choice will be ignored. Base the decision on causal order rather than the mere
      presence of both structured contributing labels.

      INITIATING EVENT: {{ input.initiating_event }}
      HUMAN FACTOR EVENT: {{ input.human_factor_event }}
      INTERVENTION: {{ input.intervention }}
      CAUSAL ORDER: {{ input.causal_order }}
      NARRATIVE:
      {{ input.text }}
    output:
      mode: structured_output
      schema:
        attribution_category: enum[mainly_equipment_driven, mainly_human_factor_driven, mixed_equipment_human_factor]
        attribution_is_clear: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: omit_unclear_attributions
    type: code_filter
    code: |
      def transform(doc):
          return doc.get("attribution_is_clear") is True

  - name: attach_component_records_left
    type: code_map
    code: |
      import csv
      import os
      import threading

      _component_index = None
      _component_lock = threading.Lock()

      def load_component_index():
          global _component_index
          if _component_index is None:
              with _component_lock:
                  if _component_index is None:
                      index = {}
                      path = os.path.abspath(
                          os.path.join("data", "asrs", "components.csv")
                      )
                      with open(
                          path, "r", encoding="utf-8", errors="replace", newline=""
                      ) as handle:
                          for row in csv.DictReader(handle):
                              attribute = row.get("attribute")
                              if attribute not in {"aircraft_component", "problem"}:
                                  continue
                              incident_id = str(row.get("incident_id", ""))
                              if incident_id:
                                  index.setdefault(incident_id, []).append(
                                      {
                                          "attribute": attribute,
                                          "value": row.get("value"),
                                      }
                                  )
                      _component_index = index
          return _component_index

      def transform(doc):
          return {
              "component_records": load_component_index().get(
                  str(doc.get("incident_id", "")), []
              )
          }

  - name: attach_human_factor_records_left
    type: code_map
    code: |
      import csv
      import os
      import threading

      _human_factor_index = None
      _human_factor_lock = threading.Lock()
      _included_factor_types = {
          "human_factors",
          "communication_breakdown",
          "experience",
      }

      def load_human_factor_index():
          global _human_factor_index
          if _human_factor_index is None:
              with _human_factor_lock:
                  if _human_factor_index is None:
                      index = {}
                      path = os.path.abspath(
                          os.path.join("data", "asrs", "person_factors.csv")
                      )
                      with open(
                          path, "r", encoding="utf-8", errors="replace", newline=""
                      ) as handle:
                          for row in csv.DictReader(handle):
                              factor_type = row.get("factor_type")
                              if factor_type not in _included_factor_types:
                                  continue
                              incident_id = str(row.get("incident_id", ""))
                              if incident_id:
                                  index.setdefault(incident_id, []).append(
                                      {
                                          "factor_type": factor_type,
                                          "value": row.get("value"),
                                      }
                                  )
                      _human_factor_index = index
          return _human_factor_index

      def transform(doc):
          return {
              "human_factor_records": load_human_factor_index().get(
                  str(doc.get("incident_id", "")), []
              )
          }

  - name: collect_attribution_records
    type: code_reduce
    reduce_key: attribution_category
    code: |
      def transform(items):
          incident_ids = set()
          records = []
          for item in items:
              incident_id = str(item.get("incident_id", ""))
              if not incident_id or incident_id in incident_ids:
                  continue
              incident_ids.add(incident_id)
              records.append(
                  {
                      "incident_id": incident_id,
                      "initiating_event": item.get("initiating_event"),
                      "human_factor_event": item.get("human_factor_event"),
                      "intervention": item.get("intervention"),
                      "component_records": item.get("component_records") or [],
                      "human_factor_records": item.get("human_factor_records") or [],
                  }
              )
          return {
              "incident_count": len(incident_ids),
              "causal_records": records,
          }

  - name: summarize_attribution_category
    type: reduce
    optimize: true
    recursively_optimize: false
    synthesize_resolve: false
    synthesize_merge: true
    reduce_key: attribution_category
    pass_through: true
    prompt: |
      Summarize the following qualifying NASA ASRS causal records for attribution
      category {{ inputs[0].attribution_category }}.

      Produce:
      - dominant_initiating_factor: the most common or representative initiating
        factor across the category;
      - dominant_intervention: the most common or representative intervention.

      Each output must be a nonempty phrase of at most six words. Use the extracted
      causal fields together with recorded component and person-factor information.
      Empty left-join lists mean that no qualifying structured record was available;
      do not infer one. Do not change the category or distinct-incident count.

      DISTINCT INCIDENT COUNT: {{ inputs[0].incident_count }}
      {% for record in inputs[0].causal_records %}
      INCIDENT: {{ record.incident_id }}
      INITIATING EVENT: {{ record.initiating_event }}
      HUMAN FACTOR EVENT: {{ record.human_factor_event }}
      INTERVENTION: {{ record.intervention }}
      COMPONENT RECORDS: {{ record.component_records }}
      HUMAN FACTOR RECORDS: {{ record.human_factor_records }}
      ---
      {% endfor %}
    output:
      mode: structured_output
      schema:
        dominant_initiating_factor: string
        dominant_intervention: string
    validate:
      - 1 <= len(output["dominant_initiating_factor"].split()) <= 6
      - 1 <= len(output["dominant_intervention"].split()) <= 6
    num_retries_on_validate_failure: 2
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 128
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: project_answer_fields
    type: map
    optimize: true
    drop_keys:
      - causal_records
      - _counts_prereduce_collect_attribution_records
      - _counts_prereduce_summarize_attribution_category

pipeline:
  steps:
    - name: dual_factor_incidents
      input: asrs_assessments
      operations:
        - filter_aircraft_human_factor_labels
        - collect_contributing_labels
        - filter_dual_factor_incidents
    - name: dual_factor_reports
      input: dual_factor_incidents
      operations:
        - attach_incident_text_file
        - inner_join_incident_records
        - load_asrs_narrative
    - name: attributed_incidents
      input: dual_factor_reports
      operations:
        - extract_equipment_human_causal_chain
        - omit_unrecoverable_causal_chains
        - classify_equipment_human_attribution
        - omit_unclear_attributions
    - name: attributions_with_components
      input: attributed_incidents
      operations:
        - attach_component_records_left
    - name: joined_attributions
      input: attributions_with_components
      operations:
        - attach_human_factor_records_left
    - name: grouped_attributions
      input: joined_attributions
      operations:
        - collect_attribution_records
    - name: attribution_summary
      input: grouped_attributions
      operations:
        - summarize_attribution_category
        - project_answer_fields
  output:
    type: file
    path: raw_outputs/aviation_safety/output_aviation_safety-047.json
