datasets:
  asrs_incidents:
    type: file
    path: data/asrs/incidents.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
default_embedding_api_base: ${EMBEDDING_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_us_reference
    type: code_filter
    code: |
      def transform(doc):
          return doc.get("state_reference") == "US"

  - name: load_asrs_narrative
    type: code_map
    code: |
      def transform(doc):
          import os

          base_dir = os.path.abspath(os.path.join("data", "asrs"))
          text_path = os.path.abspath(
              os.path.join(base_dir, str(doc.get("text_file", "")))
          )
          if os.path.commonpath([base_dir, text_path]) != base_dir:
              raise ValueError("ASRS text path escapes data/asrs")
          with open(text_path, "r", encoding="utf-8", errors="replace") as handle:
              text = handle.read()
          return {"text": text}

  - name: filter_continued_without_diversion_or_return
    type: filter
    optimize: true
    prompt: |
      Keep this NASA ASRS report only when the narrative explicitly establishes
      both of the following:

      1. the flight did not divert and did not return to its departure airport; and
      2. instead, it continued to the planned destination or completed a normal
         landing.

      Do not infer either condition merely because diversion, return, abnormal
      landing, or an alternate destination is absent from the narrative. Exclude
      reports that actually diverted or returned, reports that landed somewhere
      other than the planned destination, and reports whose continuation or normal
      landing is not explicit.

      Narrative:
      {{ input.text }}
    output:
      mode: structured_output
      schema:
        is_match: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: filter_declared_emergency_result
    type: code_filter
    code: |
      def transform(doc):
          return "General Declared Emergency" in str(
              doc.get("result_summary", "")
          )

  - name: count_distinct_incidents
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          incident_ids = {
              str(item.get("incident_id", ""))
              for item in items
              if str(item.get("incident_id", ""))
          }
          return {"count_incidents": len(incident_ids)}

pipeline:
  steps:
    - name: process
      input: asrs_incidents
      operations:
        - filter_us_reference
        - load_asrs_narrative
        - filter_continued_without_diversion_or_return
        - filter_declared_emergency_result
        - count_distinct_incidents
  output:
    type: file
    path: raw_outputs/aviation_safety/output_aviation_safety-014.json
