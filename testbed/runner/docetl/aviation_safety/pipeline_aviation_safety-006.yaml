datasets:
  asrs_incidents:
    type: file
    path: data/asrs/incidents.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
default_embedding_api_base: ${EMBEDDING_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_air_carrier_airport
    type: code_filter
    code: |
      def transform(doc):
          return (
              doc.get("aircraft_operator") == "Air Carrier"
              and doc.get("locale_reference_type") == "Airport"
          )

  - name: load_asrs_narrative
    type: code_map
    code: |
      def transform(doc):
          import os

          base_dir = os.path.abspath(os.path.join("data", "asrs"))
          text_path = os.path.abspath(
              os.path.join(base_dir, str(doc.get("text_file", "")))
          )
          if os.path.commonpath([base_dir, text_path]) != base_dir:
              raise ValueError("ASRS text path escapes data/asrs")
          with open(text_path, "r", encoding="utf-8", errors="replace") as handle:
              text = handle.read()
          return {"text": text}

  - name: filter_pre_runway_entry_clearance_conflicts
    type: filter
    optimize: true
    prompt: |
      Determine whether this NASA ASRS narrative describes a qualifying runway
      conflict prevention event.

      Keep the report only when all conditions are explicit:
      1. A taxi, runway-crossing, runway-exit, or hold-short clearance/instruction
         was conflicting, mistaken, omitted when required, issued too late, or
         ambiguous in a way that created a concrete runway-entry threat.
      2. A specific threatened aircraft was at risk of entering a runway that was
         conflicting with another aircraft, vehicle, or active operation.
      3. Someone detected, corrected, cancelled, or stopped the situation before
         the threatened aircraft entered the conflicting runway surface.

      Exclude normal clearances followed only by an independent navigation error,
      takeoff/landing-clearance disputes with no taxi/crossing/hold-short conflict,
      vague potential hazards, cases with no explicit prevention, and cases first
      resolved after runway entry.

      Narrative:
      {{ input.text }}
    output:
      mode: structured_output
      schema:
        is_match: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: count_distinct_incidents
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          incident_ids = {
              str(item.get("incident_id"))
              for item in items
              if item.get("incident_id")
          }
          return {"count": len(incident_ids)}

pipeline:
  steps:
    - name: process
      input: asrs_incidents
      operations:
        - filter_air_carrier_airport
        - load_asrs_narrative
        - filter_pre_runway_entry_clearance_conflicts
        - count_distinct_incidents
  output:
    type: file
    path: raw_outputs/aviation_safety/output_aviation_safety-006.json
