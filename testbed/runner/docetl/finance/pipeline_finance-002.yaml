datasets:
  sec_2024_filings:
    type: file
    path: data/SEC/CSV/2024.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
default_embedding_api_base: ${EMBEDDING_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: load_filing_document
    type: code_map
    code: |
      def transform(doc):
          import os

          base_dir = os.path.abspath(os.path.join("data", "SEC"))
          text_path = os.path.abspath(
              os.path.join(base_dir, str(doc.get("text", "")))
          )
          if os.path.commonpath([base_dir, text_path]) != base_dir:
              raise ValueError("SEC text path escapes data/SEC")
          with open(text_path, "r", encoding="utf-8", errors="replace") as handle:
              document = handle.read()
          return {"document": document}

  - name: extract_fiscal_year_end
    type: map
    optimize: true
    prompt: |
      Extract the reporting company's fiscal year-end date from this SEC 10-K
      filing and normalize it to exactly MM-DD format using two digits for both
      month and day.
      Use the fiscal year-end date for the annual reporting period covered by the
      filing, not the filing date or another document date. For a 52/53-week fiscal
      year, use the actual month and day stated for that reporting period.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        fiscal_year_end: string
    validate:
      - len(output["fiscal_year_end"]) == 5
      - output["fiscal_year_end"][2] == "-"
      - output["fiscal_year_end"][:2].isdigit()
      - output["fiscal_year_end"][3:].isdigit()
      - 1 <= int(output["fiscal_year_end"][:2]) <= 12
      - 1 <= int(output["fiscal_year_end"][3:]) <= 31
    num_retries_on_validate_failure: 2
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 256
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: filter_non_calendar_year_ends
    type: code_filter
    code: |
      def transform(doc):
          return doc.get("fiscal_year_end") != "12-31"

  - name: count_by_fiscal_year_end
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          from collections import Counter

          counts = Counter(
              str(item.get("fiscal_year_end", "")) for item in items
          )
          return {
              "rows": [
                  {"fiscal_year_end": date, "count": count}
                  for date, count in counts.items()
              ]
          }

  - name: unnest_fiscal_year_end_counts
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - fiscal_year_end
      - count

  - name: order_fiscal_year_end_counts
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          rows = sorted(
              items,
              key=lambda item: (
                  -int(item.get("count", 0)),
                  str(item.get("fiscal_year_end", "")),
              ),
          )
          return {"rows": rows}

  - name: unnest_ordered_counts
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - fiscal_year_end
      - count

pipeline:
  steps:
    - name: process
      input: sec_2024_filings
      operations:
        - load_filing_document
        - extract_fiscal_year_end
        - filter_non_calendar_year_ends
        - count_by_fiscal_year_end
        - unnest_fiscal_year_end_counts
        - order_fiscal_year_end_counts
        - unnest_ordered_counts
  output:
    type: file
    path: raw_outputs/finance/output_finance-002.json
