datasets:
  sec_2019_filings:
    type: file
    path: data/SEC/CSV/2019.csv
  sec_2023_filings:
    type: file
    path: data/SEC/CSV/2023.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
default_embedding_api_base: ${EMBEDDING_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: load_2019_filing_document
    type: code_map
    code: |
      def transform(doc):
          import os

          base_dir = os.path.abspath(os.path.join("data", "SEC"))
          text_path = os.path.abspath(
              os.path.join(base_dir, str(doc.get("text", "")))
          )
          if os.path.commonpath([base_dir, text_path]) != base_dir:
              raise ValueError("SEC text path escapes data/SEC")
          with open(text_path, "r", encoding="utf-8", errors="replace") as handle:
              document_2019 = handle.read()
          return {"document_2019": document_2019}

  - name: filter_2019_early_stage_or_emerging_competitors
    type: filter
    optimize: true
    prompt: |
      Keep this 2019 SEC 10-K filing only if it describes the reporting company
      as an early-stage or emerging competitor in its industry or primary market
      in 2019.

      2019 filing:
      {{ input.document_2019 }}
    output:
      mode: structured_output
      schema:
        is_match: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: extract_2019_employee_count
    type: map
    optimize: true
    prompt: |
      Extract the total employee count explicitly reported for the company in
      this 2019 SEC 10-K filing.

      Use a company-wide total for the latest reporting date covered by the
      filing, rather than a partial workforce figure.

      Set employee_count_2019_available=true only when an explicit total employee
      count is disclosed. If it is not disclosed, set the flag to false and
      return 0 as the required placeholder; the following deterministic operation
      converts it to null.

      2019 filing:
      {{ input.document_2019 }}
    output:
      mode: structured_output
      schema:
        employee_count_2019_available: boolean
        employee_count_2019_value: integer
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 256
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: normalize_nullable_2019_employee_count
    type: code_map
    code: |
      def transform(doc):
          if doc.get("employee_count_2019_available") is not True:
              return {"employee_count_2019": None}
          try:
              return {
                  "employee_count_2019": int(
                      doc.get("employee_count_2019_value")
                  )
              }
          except (TypeError, ValueError):
              return {"employee_count_2019": None}

  - name: load_2023_filing_document
    type: code_map
    code: |
      def transform(doc):
          import os

          base_dir = os.path.abspath(os.path.join("data", "SEC"))
          text_path = os.path.abspath(
              os.path.join(base_dir, str(doc.get("text", "")))
          )
          if os.path.commonpath([base_dir, text_path]) != base_dir:
              raise ValueError("SEC text path escapes data/SEC")
          with open(text_path, "r", encoding="utf-8", errors="replace") as handle:
              document_2023 = handle.read()
          return {"document_2023": document_2023}

  - name: filter_2023_recognized_leaders
    type: filter
    optimize: true
    prompt: |
      Keep this 2023 SEC 10-K filing only if it describes the reporting company
      as a recognized industry or market leader in 2023.

      2023 filing:
      {{ input.document_2023 }}
    output:
      mode: structured_output
      schema:
        is_match: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: extract_2023_company_industry_and_employee_count
    type: map
    optimize: true
    prompt: |
      Extract the reporting company's legal name, industry sector, and
      reported total employee count from this 2023 SEC 10-K filing.

      Use the legal registrant name stated in the filing and return a concise,
      conventional industry-sector name. For employee_count_2023, use an
      explicitly reported company-wide total for the latest reporting date
      covered by the filing.

      2023 filing:
      {{ input.document_2023 }}
    output:
      mode: structured_output
      schema:
        company_name: string
        industry_sector: string
        employee_count_2023: integer
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 512
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: join_emerging_companies_to_leaders
    type: equijoin
    deterministic: true
    blocking_conditions:
      - left["cik"] == right["cik"]

  - name: project_answer_fields
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          return {
              "rows": [
                  {
                      "company_name": item.get("company_name"),
                      "industry_sector": item.get("industry_sector"),
                      "employee_count_2019": item.get("employee_count_2019"),
                      "employee_count_2023": item.get("employee_count_2023"),
                  }
                  for item in items
              ]
          }

  - name: unnest_answer_rows
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - company_name
      - industry_sector
      - employee_count_2019
      - employee_count_2023

pipeline:
  steps:
    - name: emerging_2019
      input: sec_2019_filings
      operations:
        - load_2019_filing_document
        - filter_2019_early_stage_or_emerging_competitors
        - extract_2019_employee_count
        - normalize_nullable_2019_employee_count
    - name: leaders_2023
      input: sec_2023_filings
      operations:
        - load_2023_filing_document
        - filter_2023_recognized_leaders
        - extract_2023_company_industry_and_employee_count
    - name: matched_companies
      operations:
        - join_emerging_companies_to_leaders:
            left: emerging_2019
            right: leaders_2023
    - name: process
      input: matched_companies
      operations:
        - project_answer_fields
        - unnest_answer_rows
  output:
    type: file
    path: raw_outputs/finance/output_finance-032.json
