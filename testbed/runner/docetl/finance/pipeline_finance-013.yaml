datasets:
  sec_csv_scan_seed:
    type: file
    path: data/SEC/CSV/2024.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
default_embedding_api_base: ${EMBEDDING_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: scan_all_sec_csv_tables
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          import csv
          import os

          base_dir = os.path.abspath(os.path.join("data", "SEC"))
          csv_dir = os.path.abspath(os.path.join(base_dir, "CSV"))
          if os.path.commonpath([base_dir, csv_dir]) != base_dir:
              raise ValueError("SEC CSV path escapes data/SEC")

          rows = []
          for year in range(2019, 2025):
              csv_path = os.path.join(csv_dir, f"{year}.csv")
              with open(
                  csv_path,
                  "r",
                  encoding="utf-8-sig",
                  newline="",
              ) as handle:
                  for row in csv.DictReader(handle):
                      rows.append(
                          {
                              "year": year,
                              "text": row.get("text"),
                              "word_count": row.get("word_count"),
                          }
                      )
          return {"rows": rows}

  - name: unnest_all_sec_filings
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - year
      - text
      - word_count

  - name: filter_target_years_and_word_count
    type: code_filter
    code: |
      def transform(doc):
          try:
              year = int(doc.get("year", 0))
              word_count = int(doc.get("word_count", 0))
          except (TypeError, ValueError):
              return False
          return year in {2019, 2020, 2021, 2022, 2023} and word_count > 95000

  - name: load_filing_document
    type: code_map
    code: |
      def transform(doc):
          import os

          base_dir = os.path.abspath(os.path.join("data", "SEC"))
          text_path = os.path.abspath(
              os.path.join(base_dir, str(doc.get("text", "")))
          )
          if os.path.commonpath([base_dir, text_path]) != base_dir:
              raise ValueError("SEC text path escapes data/SEC")
          with open(text_path, "r", encoding="utf-8", errors="replace") as handle:
              document = handle.read()
          return {"document": document}

  - name: filter_explicitly_zero_employees
    type: filter
    optimize: true
    prompt: |
      Keep this SEC 10-K filing only if it explicitly reports that the reporting
      company has exactly zero employees.
      The statement must establish a company-wide employee count of zero; a
      missing or undisclosed employee count is not zero.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        is_match: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: count_zero_employee_filings
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          return {"count": len(items)}

pipeline:
  steps:
    - name: process
      input: sec_csv_scan_seed
      operations:
        - scan_all_sec_csv_tables
        - unnest_all_sec_filings
        - filter_target_years_and_word_count
        - load_filing_document
        - filter_explicitly_zero_employees
        - count_zero_employee_filings
  output:
    type: file
    path: raw_outputs/finance/output_finance-013.json
