datasets:
  sec_2024_filings:
    type: file
    path: data/SEC/CSV/2024.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
default_embedding_api_base: ${EMBEDDING_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_filings_over_50000_words
    type: code_filter
    code: |
      def transform(doc):
          try:
              return int(doc.get("word_count", 0)) > 50000
          except (TypeError, ValueError):
              return False

  - name: load_filing_document
    type: code_map
    code: |
      def transform(doc):
          import os

          base_dir = os.path.abspath(os.path.join("data", "SEC"))
          text_path = os.path.abspath(
              os.path.join(base_dir, str(doc.get("text", "")))
          )
          if os.path.commonpath([base_dir, text_path]) != base_dir:
              raise ValueError("SEC text path escapes data/SEC")
          with open(text_path, "r", encoding="utf-8", errors="replace") as handle:
              document = handle.read()
          return {
              "document": document,
              "word_count": int(doc.get("word_count", 0)),
          }

  - name: filter_operational_ai_or_ml_use
    type: filter
    optimize: true
    prompt: |
      Keep this SEC 10-K filing only if it describes the reporting company
      operationally using artificial intelligence or machine learning in its
      business. A mention that does not describe the company's operational use
      is insufficient.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        is_match: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: filter_no_substantial_going_concern_doubt
    type: filter
    optimize: true
    prompt: |
      Keep this SEC 10-K filing only if it does not report substantial doubt
      about the reporting company's ability to continue as a going concern.
      Return false only when the filing affirmatively reports such substantial
      doubt for the reporting company.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        is_match: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: extract_company_name_and_industry
    type: map
    optimize: true
    prompt: |
      Extract the reporting company's legal name and its industry sector from
      this SEC 10-K filing. Use the legal registrant name stated in the filing.
      Return a concise industry sector name grounded in the filing; do not return
      a business description or explanation.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        company_name: string
        industry: string
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 256
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: order_by_word_count_and_company_name
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          def word_count(item):
              try:
                  return int(item.get("word_count", 0))
              except (TypeError, ValueError):
                  return 0

          rows = sorted(
              items,
              key=lambda item: (
                  -word_count(item),
                  str(item.get("company_name", "")).casefold(),
                  str(item.get("company_name", "")),
              ),
          )
          return {"rows": rows}

  - name: unnest_ordered_filings
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - company_name
      - industry
      - word_count

  - name: limit_to_10_filings
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          return {"rows": items[:10]}

  - name: unnest_limited_filings
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - company_name
      - industry
      - word_count

pipeline:
  steps:
    - name: process
      input: sec_2024_filings
      operations:
        - filter_filings_over_50000_words
        - load_filing_document
        - filter_operational_ai_or_ml_use
        - filter_no_substantial_going_concern_doubt
        - extract_company_name_and_industry
        - order_by_word_count_and_company_name
        - unnest_ordered_filings
        - limit_to_10_filings
        - unnest_limited_filings
  output:
    type: file
    path: raw_outputs/finance/output_finance-015.json
