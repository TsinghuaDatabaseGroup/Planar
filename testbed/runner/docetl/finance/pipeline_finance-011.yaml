datasets:
  sec_2023_filings:
    type: file
    path: data/SEC/CSV/2023.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
default_embedding_api_base: ${EMBEDDING_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: load_filing_document
    type: code_map
    code: |
      def transform(doc):
          import os

          base_dir = os.path.abspath(os.path.join("data", "SEC"))
          text_path = os.path.abspath(
              os.path.join(base_dir, str(doc.get("text", "")))
          )
          if os.path.commonpath([base_dir, text_path]) != base_dir:
              raise ValueError("SEC text path escapes data/SEC")
          with open(text_path, "r", encoding="utf-8", errors="replace") as handle:
              document = handle.read()
          return {"document": document}

  - name: extract_geographic_scope_and_indicators
    type: map
    optimize: true
    prompt: |
      Analyze this 2023 SEC 10-K filing and return:

      1. Exactly one geographic operating-scope category:
         - domestic_only: operations are confined to the United States;
         - limited_international: foreign operations exist but are limited in
           geographic scope or business significance;
         - globally_diversified: substantial operations span multiple countries
           or world regions;
         - unassigned: the filing does not provide enough evidence to distinguish
           the preceding categories.

      2. Three independent boolean indicators:
         - foreign_currency_risk: whether the filing discloses foreign-currency or
           exchange-rate risk;
         - has_international_ops: whether the filing describes company operations
           outside the United States;
         - has_litigation: the filing reports a pending, threatened, or ongoing
           litigation matter, legal proceeding, lawsuit, or regulatory
           investigation involving the company.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        geographic_level: enum[domestic_only, limited_international, globally_diversified, unassigned]
        foreign_currency_risk: boolean
        has_international_ops: boolean
        has_litigation: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 512
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: filter_assigned_geographic_groups
    type: code_filter
    code: |
      def transform(doc):
          return doc.get("geographic_level") in {
              "domestic_only",
              "limited_international",
              "globally_diversified",
          }

  - name: aggregate_geographic_group_rates
    type: code_reduce
    reduce_key: geographic_level
    code: |
      def transform(items):
          from decimal import Decimal, ROUND_HALF_UP

          filing_count = len(items)

          def percentage(field):
              true_count = sum(
                  1 for item in items if item.get(field) is True
              )
              return float(
                  (
                      Decimal(100 * true_count) / Decimal(filing_count)
                  ).quantize(Decimal("0.1"), rounding=ROUND_HALF_UP)
              )

          return {
              "filing_count": filing_count,
              "foreign_currency_risk_rate_percent": percentage(
                  "foreign_currency_risk"
              ),
              "international_operations_rate_percent": percentage(
                  "has_international_ops"
              ),
              "litigation_rate_percent": percentage("has_litigation"),
          }

  - name: pack_geographic_group_dictionary
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          return {
              str(item.get("geographic_level", "")): {
                  "filing_count": item.get("filing_count"),
                  "foreign_currency_risk_rate_percent": item.get(
                      "foreign_currency_risk_rate_percent"
                  ),
                  "international_operations_rate_percent": item.get(
                      "international_operations_rate_percent"
                  ),
                  "litigation_rate_percent": item.get(
                      "litigation_rate_percent"
                  ),
              }
              for item in items
              if str(item.get("geographic_level", ""))
          }

pipeline:
  steps:
    - name: process
      input: sec_2023_filings
      operations:
        - load_filing_document
        - extract_geographic_scope_and_indicators
        - filter_assigned_geographic_groups
        - aggregate_geographic_group_rates
        - pack_geographic_group_dictionary
  output:
    type: file
    path: raw_outputs/finance/output_finance-011.json
