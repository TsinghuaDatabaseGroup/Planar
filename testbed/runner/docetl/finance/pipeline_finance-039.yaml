datasets:
  sec_2020_filings:
    type: file
    path: data/SEC/CSV/2020.csv
  sec_2019_filings:
    type: file
    path: data/SEC/CSV/2019.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
default_embedding_api_base: ${EMBEDDING_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_2020_filings_over_50000_words
    type: code_filter
    code: |
      def transform(doc):
          try:
              return int(doc.get("word_count", 0)) > 50000
          except (TypeError, ValueError):
              return False

  - name: load_2020_filing_document
    type: code_map
    code: |
      def transform(doc):
          import os

          base_dir = os.path.abspath(os.path.join("data", "SEC"))
          text_path = os.path.abspath(
              os.path.join(base_dir, str(doc.get("text", "")))
          )
          if os.path.commonpath([base_dir, text_path]) != base_dir:
              raise ValueError("SEC text path escapes data/SEC")
          with open(text_path, "r", encoding="utf-8", errors="replace") as handle:
              document_2020 = handle.read()
          return {"document_2020": document_2020}

  - name: filter_software_or_technology_platform_companies
    type: filter
    optimize: true
    prompt: |
      Keep this 2020 SEC 10-K filing only if the reporting company's primary
      business is software or operating a technology platform.
      Base the decision on the company's primary business rather than its use of
      software or technology in another type of business.

      2020 filing:
      {{ input.document_2020 }}
    output:
      mode: structured_output
      schema:
        is_match: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: extract_acquirer_and_whole_company_acquisitions
    type: map
    optimize: true
    prompt: |
      Extract from this 2020 SEC 10-K filing:

      1. The reporting acquirer's legal registrant name.
      2. Its concise, broad industry sector.
      3. The legal or commonly stated names of every whole company that the
         reporting company acquired, or entered a definitive agreement to
         acquire, as disclosed in the filing.

      As required by the query, exclude asset purchases, minority-stake
      investments, spin-offs, and SPAC or blank-check combinations.
      Preserve each acquired company's identifying name and return each distinct
      company once.
      Return an empty list if no qualifying whole-company acquisition is
      disclosed. If the acquirer name or sector cannot be determined, use an
      empty string placeholder.

      2020 filing:
      {{ input.document_2020 }}
    output:
      mode: structured_output
      schema:
        acquirer: string
        acquirer_sector: string
        acquired_company_names: list[string]
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 1024
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: filter_filings_with_acquired_companies
    type: code_filter
    code: |
      def transform(doc):
          names = doc.get("acquired_company_names")
          return isinstance(names, list) and len(names) > 0

  - name: filter_2019_filings_over_50000_words
    type: code_filter
    code: |
      def transform(doc):
          try:
              return int(doc.get("word_count", 0)) > 50000
          except (TypeError, ValueError):
              return False

  - name: load_2019_filing_document
    type: code_map
    code: |
      def transform(doc):
          import os

          base_dir = os.path.abspath(os.path.join("data", "SEC"))
          text_path = os.path.abspath(
              os.path.join(base_dir, str(doc.get("text", "")))
          )
          if os.path.commonpath([base_dir, text_path]) != base_dir:
              raise ValueError("SEC text path escapes data/SEC")
          with open(text_path, "r", encoding="utf-8", errors="replace") as handle:
              document_2019 = handle.read()
          return {"document_2019": document_2019}

  - name: extract_2019_registrant_sector_and_risk_count
    type: map
    optimize: true
    prompt: |
      Extract from this 2019 SEC 10-K filing:

      1. The legal registrant name stated in the filing.
      2. A concise, broad industry sector grounded in the filing.
      3. The total number of distinct risk factors presented in the filing's
         risk-factor section.

      Count individually presented risk factors rather than pages, paragraphs,
      cross-references, or broad category headings.

      If the registrant name or industry sector cannot be determined, set its
      availability flag to false and use an empty string placeholder. If the total
      risk-factor count cannot be determined, set its flag to false and return 0
      as the placeholder. The following deterministic operation converts
      unavailable values to null.

      2019 filing:
      {{ input.document_2019 }}
    output:
      mode: structured_output
      schema:
        registry_company_name_available: boolean
        registry_company_name_value: string
        target_sector_available: boolean
        target_sector_value: string
        target_risk_factor_count_available: boolean
        target_risk_factor_count_value: integer
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 512
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: normalize_2019_registry_fields
    type: code_map
    code: |
      def transform(doc):
          registry_company_name = (
              str(doc.get("registry_company_name_value", "")).strip()
              if doc.get("registry_company_name_available") is True
              else None
          )
          target_sector = (
              str(doc.get("target_sector_value", "")).strip()
              if doc.get("target_sector_available") is True
              else None
          )
          if doc.get("target_risk_factor_count_available") is True:
              try:
                  target_risk_factor_count = int(
                      doc.get("target_risk_factor_count_value")
                  )
              except (TypeError, ValueError):
                  target_risk_factor_count = None
          else:
              target_risk_factor_count = None
          return {
              "registry_company_name": registry_company_name,
              "target_sector": target_sector,
              "target_risk_factor_count": target_risk_factor_count,
          }

  - name: match_acquired_companies_to_2019_registrants
    type: equijoin
    optimize: true
    comparison_prompt: |
      Determine whether at least one acquired-company name in the 2020
      acquisition filing refers to the same legal entity as the 2019 SEC
      registrant.

      Allow harmless abbreviations, former names, spelling variants, and legal-name
      differences, but require the names to identify the same legal entity. Use
      the filing contexts only to resolve that identity.

      ACQUIRER:
      {{ left.acquirer }}

      ACQUIRED-COMPANY REFERENCES:
      {{ left.acquired_company_names }}

      2020 ACQUISITION CONTEXT:
      {{ left.document_2020 }}

      2019 REGISTRANT:
      {{ right.registry_company_name }}

      2019 REGISTRANT CONTEXT:
      {{ right.document_2019 }}
    blocking_keys:
      left:
        - acquired_company_names
      right:
        - registry_company_name
    blocking_target_recall: 0.95
    embedding_model: Qwen3-Embedding-8B
    comparison_model: Qwen3.5-397B-A17B
    timeout: 120
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: filter_cross_company_cross_sector_matches
    type: code_filter
    code: |
      def transform(doc):
          acquirer_cik = str(doc.get("cik_left", "")).strip()
          target_cik = str(doc.get("cik_right", "")).strip()
          acquirer_sector = str(
              doc.get("acquirer_sector", "")
          ).strip().casefold()
          target_sector_value = doc.get("target_sector")
          target_sector = (
              str(target_sector_value).strip().casefold()
              if target_sector_value is not None
              else ""
          )
          return (
              acquirer_cik != target_cik
              and bool(acquirer_sector)
              and bool(target_sector)
              and acquirer_sector != target_sector
              and doc.get("target_risk_factor_count") is not None
          )

  - name: project_acquirer_target_pairs
    type: code_map
    code: |
      def transform(doc):
          return {
              "acquirer": str(doc.get("acquirer", "")).strip(),
              "target": str(
                  doc.get("registry_company_name", "")
              ).strip(),
              "target_sector": str(doc.get("target_sector", "")).strip(),
              "target_risk_factor_count": int(
                  doc.get("target_risk_factor_count")
              ),
          }

  - name: deduplicate_acquirer_target_pairs
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          seen = set()
          rows = []
          for item in items:
              acquirer = str(item.get("acquirer", "")).strip()
              target = str(item.get("target", "")).strip()
              key = (acquirer.casefold(), target.casefold())
              if not acquirer or not target or key in seen:
                  continue
              seen.add(key)
              rows.append(
                  {
                      "acquirer": acquirer,
                      "target": target,
                      "target_sector": item.get("target_sector", ""),
                      "target_risk_factor_count": int(
                          item.get("target_risk_factor_count", 0)
                      ),
                  }
              )
          return {"rows": rows}

  - name: unnest_unique_acquirer_target_pairs
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - acquirer
      - target
      - target_sector
      - target_risk_factor_count

pipeline:
  steps:
    - name: acquisition_events
      input: sec_2020_filings
      operations:
        - filter_2020_filings_over_50000_words
        - load_2020_filing_document
        - filter_software_or_technology_platform_companies
        - extract_acquirer_and_whole_company_acquisitions
        - filter_filings_with_acquired_companies
    - name: registry_2019
      input: sec_2019_filings
      operations:
        - filter_2019_filings_over_50000_words
        - load_2019_filing_document
        - extract_2019_registrant_sector_and_risk_count
        - normalize_2019_registry_fields
    - name: matched_acquisitions
      operations:
        - match_acquired_companies_to_2019_registrants:
            left: acquisition_events
            right: registry_2019
    - name: process
      input: matched_acquisitions
      operations:
        - filter_cross_company_cross_sector_matches
        - project_acquirer_target_pairs
        - deduplicate_acquirer_target_pairs
        - unnest_unique_acquirer_target_pairs
  output:
    type: file
    path: raw_outputs/finance/output_finance-039.json
