datasets:
  sec_2019_filings:
    type: file
    path: data/SEC/CSV/2019.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
default_embedding_api_base: ${EMBEDDING_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_filings_over_45000_words
    type: code_filter
    code: |
      def transform(doc):
          try:
              return int(doc.get("word_count", 0)) > 45000
          except (TypeError, ValueError):
              return False

  - name: load_filing_document
    type: code_map
    code: |
      def transform(doc):
          import os

          base_dir = os.path.abspath(os.path.join("data", "SEC"))
          text_path = os.path.abspath(
              os.path.join(base_dir, str(doc.get("text", "")))
          )
          if os.path.commonpath([base_dir, text_path]) != base_dir:
              raise ValueError("SEC text path escapes data/SEC")
          with open(text_path, "r", encoding="utf-8", errors="replace") as handle:
              document = handle.read()
          return {"document": document}

  - name: filter_major_customer_dependence
    type: filter
    optimize: true
    prompt: |
      Keep this SEC 10-K filing only if it discloses dependence on a major
      customer or a material customer concentration for the reporting company.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        is_match: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: filter_no_foreign_currency_risk_disclosure
    type: filter
    optimize: true
    prompt: |
      Keep this SEC 10-K filing only if it does not disclose foreign-currency or
      exchange-rate risk for the reporting company.
      Return false only when such risk is disclosed.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        is_match: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: filter_international_operations
    type: filter
    optimize: true
    prompt: |
      Keep this SEC 10-K filing only if it describes actual operations outside
      the United States by the reporting company.
      An international reference that does not describe the company's operations
      outside the United States is insufficient.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        is_match: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: extract_company_industry_and_employee_count
    type: map
    optimize: true
    prompt: |
      Extract the reporting company's legal name, industry sector, and reported
      employee count from this SEC 10-K filing.
      Use the legal registrant name stated in the filing and return a concise
      industry sector rather than a business description. For employee_count, use
      an explicitly reported company-wide total for the latest reporting date
      covered by the filing.

      Set employee_count_reported=true only when a company-wide employee count is
      explicitly reported. Otherwise set it to false and return 0 as the required
      placeholder; the following deterministic operation converts it to null.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        company_name: string
        industry_sector: string
        employee_count_reported: boolean
        employee_count_value: integer
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 512
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: normalize_nullable_employee_count
    type: code_map
    code: |
      def transform(doc):
          if doc.get("employee_count_reported") is not True:
              return {"employee_count": None}
          try:
              return {"employee_count": int(doc.get("employee_count_value"))}
          except (TypeError, ValueError):
              return {"employee_count": None}

  - name: filter_reported_employee_counts
    type: code_filter
    code: |
      def transform(doc):
          value = doc.get("employee_count")
          return isinstance(value, int) and not isinstance(value, bool)

  - name: deduplicate_company_names
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          def integer_value(item, key):
              try:
                  return int(item.get(key, 0))
              except (TypeError, ValueError):
                  return 0

          best_by_company = {}
          for item in items:
              company_name = str(item.get("company_name", "")).strip()
              candidate_key = (
                  integer_value(item, "employee_count"),
                  integer_value(item, "word_count"),
                  integer_value(item, "cik"),
              )
              current = best_by_company.get(company_name)
              if current is None or candidate_key > current[0]:
                  best_by_company[company_name] = (candidate_key, item)

          return {
              "rows": [
                  candidate[1] for candidate in best_by_company.values()
              ]
          }

  - name: unnest_deduplicated_companies
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - company_name
      - industry_sector
      - employee_count
      - word_count
      - cik

  - name: order_by_employee_count_and_company_name
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          rows = sorted(
              items,
              key=lambda item: (
                  -int(item.get("employee_count", 0)),
                  str(item.get("company_name", "")).lower(),
              ),
          )
          return {"rows": rows}

  - name: unnest_ordered_companies
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - company_name
      - industry_sector
      - employee_count
      - word_count
      - cik

  - name: limit_to_10_companies
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          return {"rows": items[:10]}

  - name: unnest_limited_companies
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - company_name
      - industry_sector
      - employee_count
      - word_count
      - cik

  - name: project_answer_fields
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          return {
              "rows": [
                  {
                      "company_name": item.get("company_name"),
                      "industry_sector": item.get("industry_sector"),
                      "employee_count": item.get("employee_count"),
                  }
                  for item in items
              ]
          }

  - name: unnest_answer_rows
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - company_name
      - industry_sector
      - employee_count

pipeline:
  steps:
    - name: process
      input: sec_2019_filings
      operations:
        - filter_filings_over_45000_words
        - load_filing_document
        - filter_major_customer_dependence
        - filter_no_foreign_currency_risk_disclosure
        - filter_international_operations
        - extract_company_industry_and_employee_count
        - normalize_nullable_employee_count
        - filter_reported_employee_counts
        - deduplicate_company_names
        - unnest_deduplicated_companies
        - order_by_employee_count_and_company_name
        - unnest_ordered_companies
        - limit_to_10_companies
        - unnest_limited_companies
        - project_answer_fields
        - unnest_answer_rows
  output:
    type: file
    path: raw_outputs/finance/output_finance-025.json
