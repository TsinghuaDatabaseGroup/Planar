datasets:
  sec_2023_filings:
    type: file
    path: data/SEC/CSV/2023.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
default_embedding_api_base: ${EMBEDDING_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: load_filing_document
    type: code_map
    code: |
      def transform(doc):
          import os

          base_dir = os.path.abspath(os.path.join("data", "SEC"))
          text_path = os.path.abspath(
              os.path.join(base_dir, str(doc.get("text", "")))
          )
          if os.path.commonpath([base_dir, text_path]) != base_dir:
              raise ValueError("SEC text path escapes data/SEC")
          with open(text_path, "r", encoding="utf-8", errors="replace") as handle:
              document = handle.read()
          return {"document": document}

  - name: extract_advantages_and_market_leader_status
    type: map
    optimize: true
    prompt: |
      Perform a standardized review of this 2023 SEC 10-K filing and return:

      - competitive_advantage_themes: from zero to eight distinct concise themes
      that the filing supports as sources of the reporting company's
      competitive advantage;
      - competitive_position: market_leader when the filing describes the company
      as a market leader in its primary industry or market; otherwise other.

      Each competitive-advantage theme must be supported by the filing as a source
      of favorable competitive position. Consolidate duplicate wording into one
      concise theme, return each distinct theme once, and stop after eight themes.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        competitive_advantage_themes: list[string]
        competitive_position: enum[market_leader, other]
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 1024
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: project_advantage_group_and_leader_flag
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          import re
          import unicodedata

          def normalize_theme(value):
              text = unicodedata.normalize("NFKD", str(value or ""))
              text = text.encode("ascii", "ignore").decode("ascii").casefold()
              text = text.replace("&", " and ")
              return re.sub(r"[^a-z0-9]+", " ", text).strip()

          rows = []
          for item in items:
              themes = []
              seen = set()
              for value in item.get("competitive_advantage_themes") or []:
                  normalized = normalize_theme(value)
                  if normalized and normalized not in seen:
                      seen.add(normalized)
                      themes.append(normalized)
                  if len(themes) == 8:
                      break
              count = len(themes)
              rows.append(
                  {
                      "advantage_group": (
                          "high_advantage_group"
                          if count == 8
                          else "low_advantage_group"
                      ),
                      "is_market_leader": (
                          item.get("competitive_position")
                          == "market_leader"
                      ),
                  }
              )
          return {"rows": rows}

  - name: unnest_advantage_groups
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - advantage_group
      - is_market_leader

  - name: aggregate_advantage_groups
    type: code_reduce
    reduce_key: advantage_group
    code: |
      def transform(items):
          from decimal import Decimal, ROUND_HALF_UP

          filing_count = len(items)
          leader_count = sum(
              1 for item in items if item.get("is_market_leader") is True
          )
          rate = float(
              (
                  Decimal(100 * leader_count) / Decimal(filing_count)
              ).quantize(Decimal("0.1"), rounding=ROUND_HALF_UP)
          )
          return {
              "filing_count": filing_count,
              "market_leader_rate_percent": rate,
          }

  - name: pack_advantage_group_dictionary
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          return {
              str(item.get("advantage_group", "")): {
                  "filing_count": item.get("filing_count"),
                  "market_leader_rate_percent": item.get(
                      "market_leader_rate_percent"
                  ),
              }
              for item in items
              if str(item.get("advantage_group", ""))
          }

pipeline:
  steps:
    - name: process
      input: sec_2023_filings
      operations:
        - load_filing_document
        - extract_advantages_and_market_leader_status
        - project_advantage_group_and_leader_flag
        - unnest_advantage_groups
        - aggregate_advantage_groups
        - pack_advantage_group_dictionary
  output:
    type: file
    path: raw_outputs/finance/output_finance-009.json
