datasets:
  sec_2020_filings:
    type: file
    path: data/SEC/CSV/2020.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
default_embedding_api_base: ${EMBEDDING_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_filings_over_55000_words
    type: code_filter
    code: |
      def transform(doc):
          try:
              return int(doc.get("word_count", 0)) > 55000
          except (TypeError, ValueError):
              return False

  - name: load_filing_document
    type: code_map
    code: |
      def transform(doc):
          import os

          base_dir = os.path.abspath(os.path.join("data", "SEC"))
          text_path = os.path.abspath(
              os.path.join(base_dir, str(doc.get("text", "")))
          )
          if os.path.commonpath([base_dir, text_path]) != base_dir:
              raise ValueError("SEC text path escapes data/SEC")
          with open(text_path, "r", encoding="utf-8", errors="replace") as handle:
              document = handle.read()
          return {"document": document}

  - name: filter_climate_change_risk
    type: filter
    optimize: true
    prompt: |
      Keep this SEC 10-K filing only if it identifies climate-change risk for the
      reporting company.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        is_match: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: classify_entity_type
    type: map
    optimize: true
    prompt: |
      Assign the reporting entity in this SEC 10-K filing to exactly one category:

      - operating_company: an entity conducting an operating business;
      - holding_company: an entity primarily holding interests in other businesses;
      - investment_fund: an investment fund;
      - blank_check_SPAC: a blank-check or special-purpose acquisition company;
      - shell_company: a shell company that is not a blank-check/SPAC;
      - limited_partnership: an entity organized as a limited partnership;
      - business_development_company: a business development company;
      - undetermined: the filing does not support a reliable assignment.

      Base the category on the reporting entity described by the filing.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        entity_type: enum[operating_company, holding_company, investment_fund, blank_check_SPAC, shell_company, limited_partnership, business_development_company, undetermined]
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 256
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: classify_growth_strategy
    type: map
    optimize: true
    prompt: |
      Assign this SEC 10-K filing to exactly one stated growth-strategy category:

      - organic: growth through the company's internal business activities;
      - acquisition_driven: growth primarily through acquisitions;
      - hybrid: both organic growth and acquisitions;
      - not_applicable: the filing states that a growth strategy is not applicable;
      - undetermined: the stated strategy cannot be determined from the filing.

      Base the category on the reporting company's stated growth strategy.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        growth_strategy: enum[organic, acquisition_driven, hybrid, not_applicable, undetermined]
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 256
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: extract_company_industry_and_risk_factor_count
    type: map
    optimize: true
    prompt: |
      Extract the reporting company's legal name, industry sector, and the
      total number of distinct risk factors from this SEC 10-K filing.

      Use the legal registrant name stated in the filing and return a concise,
      conventional industry-sector name. Count individually presented risk
      factors in the filing's risk-factor section rather than pages, paragraphs,
      cross-references, or broad category headings.

      Set risk_factor_count_available=true only when the total can be determined
      from the filing. Otherwise set it to false and return 0 as the required
      placeholder; the following deterministic operation converts it to null.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        company_name: string
        industry_sector: string
        risk_factor_count_available: boolean
        risk_factor_count_value: integer
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 512
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: normalize_nullable_risk_factor_count
    type: code_map
    code: |
      def transform(doc):
          if doc.get("risk_factor_count_available") is not True:
              return {"risk_factor_count": None}
          try:
              return {
                  "risk_factor_count": int(
                      doc.get("risk_factor_count_value")
                  )
              }
          except (TypeError, ValueError):
              return {"risk_factor_count": None}

  - name: filter_complete_classified_records
    type: code_filter
    code: |
      def transform(doc):
          return (
              doc.get("entity_type") != "undetermined"
              and doc.get("growth_strategy") != "undetermined"
              and doc.get("risk_factor_count") is not None
          )

  - name: deduplicate_company_names
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          def integer_value(item, key):
              try:
                  return int(item.get(key, 0))
              except (TypeError, ValueError):
                  return 0

          best_by_company = {}
          for item in items:
              company_name = str(item.get("company_name", "")).strip()
              candidate_key = (
                  integer_value(item, "risk_factor_count"),
                  integer_value(item, "word_count"),
                  integer_value(item, "cik"),
              )
              current = best_by_company.get(company_name)
              if current is None or candidate_key > current[0]:
                  best_by_company[company_name] = (candidate_key, item)
          return {
              "rows": [
                  candidate[1] for candidate in best_by_company.values()
              ]
          }

  - name: unnest_deduplicated_companies
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - company_name
      - industry_sector
      - entity_type
      - growth_strategy
      - risk_factor_count
      - word_count
      - cik

  - name: order_by_risk_factor_count
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          rows = sorted(
              items,
              key=lambda item: (
                  -int(item.get("risk_factor_count", 0)),
                  str(item.get("company_name", "")).lower(),
              ),
          )
          return {"rows": rows}

  - name: unnest_ordered_companies
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - company_name
      - industry_sector
      - entity_type
      - growth_strategy
      - risk_factor_count
      - word_count
      - cik

  - name: limit_to_10_companies
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          return {"rows": items[:10]}

  - name: unnest_limited_companies
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - company_name
      - industry_sector
      - entity_type
      - growth_strategy
      - risk_factor_count
      - word_count
      - cik

  - name: project_answer_fields
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          return {
              "rows": [
                  {
                      "company_name": item.get("company_name"),
                      "industry_sector": item.get("industry_sector"),
                      "entity_type": item.get("entity_type"),
                      "growth_strategy": item.get("growth_strategy"),
                      "risk_factor_count": item.get("risk_factor_count"),
                  }
                  for item in items
              ]
          }

  - name: unnest_answer_rows
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - company_name
      - industry_sector
      - entity_type
      - growth_strategy
      - risk_factor_count

pipeline:
  steps:
    - name: process
      input: sec_2020_filings
      operations:
        - filter_filings_over_55000_words
        - load_filing_document
        - filter_climate_change_risk
        - classify_entity_type
        - classify_growth_strategy
        - extract_company_industry_and_risk_factor_count
        - normalize_nullable_risk_factor_count
        - filter_complete_classified_records
        - deduplicate_company_names
        - unnest_deduplicated_companies
        - order_by_risk_factor_count
        - unnest_ordered_companies
        - limit_to_10_companies
        - unnest_limited_companies
        - project_answer_fields
        - unnest_answer_rows
  output:
    type: file
    path: raw_outputs/finance/output_finance-036.json
