datasets:
  sec_2019_filings:
    type: file
    path: data/SEC/CSV/2019.csv
  sec_2020_filings:
    type: file
    path: data/SEC/CSV/2020.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
default_embedding_api_base: ${EMBEDDING_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: load_2019_filing_document
    type: code_map
    code: |
      def transform(doc):
          import os

          base_dir = os.path.abspath(os.path.join("data", "SEC"))
          text_path = os.path.abspath(
              os.path.join(base_dir, str(doc.get("text", "")))
          )
          if os.path.commonpath([base_dir, text_path]) != base_dir:
              raise ValueError("SEC text path escapes data/SEC")
          with open(text_path, "r", encoding="utf-8", errors="replace") as handle:
              document_2019 = handle.read()
          return {"document_2019": document_2019}

  - name: load_2020_filing_document
    type: code_map
    code: |
      def transform(doc):
          import os

          base_dir = os.path.abspath(os.path.join("data", "SEC"))
          text_path = os.path.abspath(
              os.path.join(base_dir, str(doc.get("text", "")))
          )
          if os.path.commonpath([base_dir, text_path]) != base_dir:
              raise ValueError("SEC text path escapes data/SEC")
          with open(text_path, "r", encoding="utf-8", errors="replace") as handle:
              document_2020 = handle.read()
          return {"document_2020": document_2020}

  - name: join_2019_and_2020_filings
    type: equijoin
    deterministic: true
    blocking_conditions:
      - left["cik"] == right["cik"]

  - name: filter_2020_pandemic_or_public_health_risk
    type: filter
    optimize: true
    prompt: |
      Keep this paired filing record only if the 2020 SEC 10-K includes a
      pandemic or public-health risk factor for the reporting company.
      The relevant disclosure must be presented as a risk factor in the filing.

      2020 filing:
      {{ input.document_2020 }}
    output:
      mode: structured_output
      schema:
        is_match: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: filter_2019_without_pandemic_or_public_health_risk
    type: filter
    optimize: true
    prompt: |
      Keep this paired filing record only if the 2019 SEC 10-K does not include a
      pandemic or public-health risk factor for the reporting company.
      Evaluate whether such a risk is presented as a risk factor in the filing.

      2019 filing:
      {{ input.document_2019 }}
    output:
      mode: structured_output
      schema:
        is_match: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: extract_annual_risk_counts_and_2020_industry
    type: map
    optimize: true
    prompt: |
      Analyze these paired SEC 10-K filings and return:

      - the total number of distinct risk factors in the 2019 filing;
      - the total number of distinct risk factors in the 2020 filing;
      - the reporting company's industry sector in 2020.

      Count individually presented risk factors in each filing's risk-factor
      section rather than pages, paragraphs, cross-references, or broad category
      headings. Return a concise, conventional industry-sector name grounded in
      the 2020 filing.

      For each year, set the available flag to true only when that filing's total
      can be determined. If unavailable, set the flag to false and return 0 as
      the required placeholder; the following deterministic operation converts
      it to null.

      2019 filing:
      {{ input.document_2019 }}

      2020 filing:
      {{ input.document_2020 }}
    output:
      mode: structured_output
      schema:
        risk_factor_count_2019_available: boolean
        risk_factor_count_2019_value: integer
        risk_factor_count_2020_available: boolean
        risk_factor_count_2020_value: integer
        industry_sector_2020: string
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 512
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: normalize_nullable_annual_risk_counts
    type: code_map
    code: |
      def transform(doc):
          def nullable_integer(flag_key, value_key):
              if doc.get(flag_key) is not True:
                  return None
              try:
                  return int(doc.get(value_key))
              except (TypeError, ValueError):
                  return None

          return {
              "risk_factor_count_2019": nullable_integer(
                  "risk_factor_count_2019_available",
                  "risk_factor_count_2019_value",
              ),
              "risk_factor_count_2020": nullable_integer(
                  "risk_factor_count_2020_available",
                  "risk_factor_count_2020_value",
              ),
          }

  - name: count_distinct_adopters_by_sector
    type: code_reduce
    reduce_key: industry_sector_2020
    code: |
      def transform(items):
          adopter_ciks = {
              str(item.get("cik_left", ""))
              for item in items
              if str(item.get("cik_left", ""))
          }
          return {"adopter_count": len(adopter_ciks)}

  - name: order_sectors_by_adopter_count
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          rows = sorted(
              items,
              key=lambda item: (
                  -int(item.get("adopter_count", 0)),
                  str(item.get("industry_sector_2020", "")),
              ),
          )
          return {"rows": rows}

  - name: unnest_ordered_sectors
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - industry_sector_2020
      - adopter_count

  - name: limit_to_10_sectors
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          return {"rows": items[:10]}

  - name: unnest_limited_sectors
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - industry_sector_2020
      - adopter_count

  - name: pack_top_sectors
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          return {
              "join_key": "all",
              "top_sectors": [
                  {
                      "industry_sector_2020": item.get("industry_sector_2020"),
                      "adopter_count": item.get("adopter_count"),
                  }
                  for item in items
              ],
          }

  - name: summarize_mean_risk_factor_count_change
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          from decimal import Decimal, ROUND_HALF_UP

          changes = [
              int(item["risk_factor_count_2020"])
              - int(item["risk_factor_count_2019"])
              for item in items
              if item.get("risk_factor_count_2019") is not None
              and item.get("risk_factor_count_2020") is not None
          ]
          mean_change = (
              float(
                  (
                      Decimal(sum(changes)) / Decimal(len(changes))
                  ).quantize(Decimal("0.1"), rounding=ROUND_HALF_UP)
              )
              if changes
              else None
          )
          return {
              "join_key": "all",
              "mean_risk_factor_count_change": mean_change,
          }

  - name: join_top_sectors_and_change_summary
    type: equijoin
    deterministic: true
    blocking_conditions:
      - left["join_key"] == right["join_key"]

  - name: project_summary_dictionary
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          if not items:
              return {
                  "top_sectors": [],
                  "mean_risk_factor_count_change": None,
              }
          item = items[0]
          return {
              "top_sectors": item.get("top_sectors") or [],
              "mean_risk_factor_count_change": item.get(
                  "mean_risk_factor_count_change"
              ),
          }

pipeline:
  steps:
    - name: filings_2019
      input: sec_2019_filings
      operations:
        - load_2019_filing_document
    - name: filings_2020
      input: sec_2020_filings
      operations:
        - load_2020_filing_document
    - name: paired_filings
      operations:
        - join_2019_and_2020_filings:
            left: filings_2019
            right: filings_2020
    - name: adopters
      input: paired_filings
      operations:
        - filter_2020_pandemic_or_public_health_risk
        - filter_2019_without_pandemic_or_public_health_risk
        - extract_annual_risk_counts_and_2020_industry
        - normalize_nullable_annual_risk_counts
    - name: top_sectors
      input: adopters
      operations:
        - count_distinct_adopters_by_sector
        - order_sectors_by_adopter_count
        - unnest_ordered_sectors
        - limit_to_10_sectors
        - unnest_limited_sectors
        - pack_top_sectors
    - name: change_summary
      input: adopters
      operations:
        - summarize_mean_risk_factor_count_change
    - name: combined_summary
      operations:
        - join_top_sectors_and_change_summary:
            left: top_sectors
            right: change_summary
    - name: process
      input: combined_summary
      operations:
        - project_summary_dictionary
  output:
    type: file
    path: raw_outputs/finance/output_finance-031.json
