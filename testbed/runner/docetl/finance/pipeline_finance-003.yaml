datasets:
  sec_2023_filings:
    type: file
    path: data/SEC/CSV/2023.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
default_embedding_api_base: ${EMBEDDING_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: load_filing_document
    type: code_map
    code: |
      def transform(doc):
          import os

          base_dir = os.path.abspath(os.path.join("data", "SEC"))
          text_path = os.path.abspath(
              os.path.join(base_dir, str(doc.get("text", "")))
          )
          if os.path.commonpath([base_dir, text_path]) != base_dir:
              raise ValueError("SEC text path escapes data/SEC")
          with open(text_path, "r", encoding="utf-8", errors="replace") as handle:
              document = handle.read()
          return {"document": document}

  - name: extract_industry_and_risk_factor_count
    type: map
    optimize: true
    prompt: |
      Extract the reporting company's broad industry sector and count the distinct
      risk factors listed in Item 1A of this SEC 10-K filing.

      Return a concise, conventional industry-sector name grounded in the filing.
      Count individually presented risk factors in Item 1A rather than pages,
      paragraphs, cross-references, or broad category headings, and do not count
      risk factors outside Item 1A.

      Set risk_factor_count_available=true only when the distinct Item 1A count
      can be determined from the filing. Otherwise set it to false and return 0
      as the required placeholder; the following deterministic operation converts
      it to null.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        industry: string
        risk_factor_count_available: boolean
        risk_factor_count_value: integer
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 512
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: normalize_nullable_risk_factor_count
    type: code_map
    code: |
      def transform(doc):
          if doc.get("risk_factor_count_available") is not True:
              return {"risk_factor_count": None}
          try:
              return {"risk_factor_count": int(doc.get("risk_factor_count_value"))}
          except (TypeError, ValueError):
              return {"risk_factor_count": None}

  - name: aggregate_by_industry
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          from collections import defaultdict
          from decimal import Decimal, ROUND_HALF_UP

          counts_by_industry = defaultdict(list)
          for item in items:
              risk_factor_count = item.get("risk_factor_count")
              if risk_factor_count is not None:
                  counts_by_industry[str(item.get("industry", ""))].append(
                      int(risk_factor_count)
                  )

          rows = []
          for industry, counts in counts_by_industry.items():
              rows.append(
                  {
                      "industry": industry,
                      "avg_risk_factor_count": float(
                          (
                              Decimal(sum(counts)) / Decimal(len(counts))
                          ).quantize(Decimal("0.1"), rounding=ROUND_HALF_UP)
                      ),
                      "filing_count": len(counts),
                  }
              )
          return {"rows": rows}

  - name: unnest_industry_aggregates
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - industry
      - avg_risk_factor_count
      - filing_count

  - name: filter_industries_with_at_least_10_filings
    type: code_filter
    code: |
      def transform(doc):
          return int(doc.get("filing_count", 0)) >= 10

  - name: order_industries_by_average
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          rows = sorted(
              items,
              key=lambda item: (
                  -float(item.get("avg_risk_factor_count", 0.0)),
                  str(item.get("industry", "")),
              ),
          )
          return {"rows": rows}

  - name: unnest_ordered_industries
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - industry
      - avg_risk_factor_count
      - filing_count

  - name: limit_to_5_industries
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          return {"rows": items[:5]}

  - name: unnest_limited_industries
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - industry
      - avg_risk_factor_count
      - filing_count

pipeline:
  steps:
    - name: process
      input: sec_2023_filings
      operations:
        - load_filing_document
        - extract_industry_and_risk_factor_count
        - normalize_nullable_risk_factor_count
        - aggregate_by_industry
        - unnest_industry_aggregates
        - filter_industries_with_at_least_10_filings
        - order_industries_by_average
        - unnest_ordered_industries
        - limit_to_5_industries
        - unnest_limited_industries
  output:
    type: file
    path: raw_outputs/finance/output_finance-003.json
