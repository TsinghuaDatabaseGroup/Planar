datasets:
  sec_2023_filings:
    type: file
    path: data/SEC/CSV/2023.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
default_embedding_api_base: ${EMBEDDING_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_filings_over_60000_words
    type: code_filter
    code: |
      def transform(doc):
          try:
              return int(doc.get("word_count", 0)) > 60000
          except (TypeError, ValueError):
              return False

  - name: load_filing_document
    type: code_map
    code: |
      def transform(doc):
          import os

          base_dir = os.path.abspath(os.path.join("data", "SEC"))
          text_path = os.path.abspath(
              os.path.join(base_dir, str(doc.get("text", "")))
          )
          if os.path.commonpath([base_dir, text_path]) != base_dir:
              raise ValueError("SEC text path escapes data/SEC")
          with open(text_path, "r", encoding="utf-8", errors="replace") as handle:
              document = handle.read()
          return {"document": document}

  - name: filter_exclusively_domestic_operations
    type: filter
    optimize: true
    prompt: |
      Keep this SEC 10-K filing only if it describes the reporting company's
      operating footprint as exclusively domestic, with no business operations
      outside the United States.
      Return false when the filing describes any actual company operations outside
      the United States or does not establish an exclusively domestic footprint.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        is_match: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: filter_foreign_currency_risk
    type: filter
    optimize: true
    prompt: |
      Keep this SEC 10-K filing only if it discloses foreign-currency or
      exchange-rate risk for the reporting company.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        is_match: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: extract_company_industry_and_risk_factor_count
    type: map
    optimize: true
    prompt: |
      Extract the reporting company's legal name, industry sector, and the
      total number of distinct risk factors from this SEC 10-K filing.

      Use the legal registrant name stated in the filing and return a concise,
      conventional industry-sector name. Count individually presented risk
      factors in the filing's risk-factor section rather than pages, paragraphs,
      cross-references, or broad category headings.

      Set each available flag to true only when its corresponding value is
      supported by the filing. If company name or industry sector is unavailable,
      set its flag to false and return an empty string as the required placeholder.
      If the risk-factor total cannot be determined, set its flag to
      false and return 0 as the placeholder. The next deterministic operation
      converts unavailable values to null.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        company_name_available: boolean
        company_name_value: string
        industry_sector_available: boolean
        industry_sector_value: string
        risk_factor_count_available: boolean
        risk_factor_count_value: integer
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 512
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: normalize_nullable_extracted_fields
    type: code_map
    code: |
      def transform(doc):
          company_name = (
              str(doc.get("company_name_value", "")).strip()
              if doc.get("company_name_available") is True
              else None
          )
          industry_sector = (
              str(doc.get("industry_sector_value", "")).strip()
              if doc.get("industry_sector_available") is True
              else None
          )
          if doc.get("risk_factor_count_available") is True:
              try:
                  risk_factor_count = int(doc.get("risk_factor_count_value"))
              except (TypeError, ValueError):
                  risk_factor_count = None
          else:
              risk_factor_count = None
          return {
              "company_name": company_name or None,
              "industry_sector": industry_sector or None,
              "risk_factor_count": risk_factor_count,
          }

  - name: filter_complete_extractions
    type: code_filter
    code: |
      def transform(doc):
          return (
              doc.get("company_name") is not None
              and doc.get("industry_sector") is not None
              and doc.get("risk_factor_count") is not None
          )

  - name: deduplicate_company_names
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          def integer_value(item, key):
              try:
                  return int(item.get(key, 0))
              except (TypeError, ValueError):
                  return 0

          best_by_company = {}
          for item in items:
              company_name = str(item.get("company_name", "")).strip()
              candidate_key = (
                  integer_value(item, "risk_factor_count"),
                  integer_value(item, "word_count"),
                  integer_value(item, "cik"),
              )
              current = best_by_company.get(company_name)
              if current is None or candidate_key > current[0]:
                  best_by_company[company_name] = (candidate_key, item)
          return {
              "rows": [
                  candidate[1] for candidate in best_by_company.values()
              ]
          }

  - name: unnest_deduplicated_companies
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - company_name
      - industry_sector
      - risk_factor_count
      - word_count
      - cik

  - name: order_by_risk_factor_count
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          rows = sorted(
              items,
              key=lambda item: (
                  -int(item.get("risk_factor_count", 0)),
                  str(item.get("company_name", "")).lower(),
              ),
          )
          return {"rows": rows}

  - name: unnest_ordered_companies
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - company_name
      - industry_sector
      - risk_factor_count
      - word_count
      - cik

  - name: limit_to_10_companies
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          return {"rows": items[:10]}

  - name: unnest_limited_companies
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - company_name
      - industry_sector
      - risk_factor_count
      - word_count
      - cik

  - name: project_answer_fields
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          return {
              "rows": [
                  {
                      "company_name": item.get("company_name"),
                      "industry_sector": item.get("industry_sector"),
                      "risk_factor_count": item.get("risk_factor_count"),
                  }
                  for item in items
              ]
          }

  - name: unnest_answer_rows
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - company_name
      - industry_sector
      - risk_factor_count

pipeline:
  steps:
    - name: process
      input: sec_2023_filings
      operations:
        - filter_filings_over_60000_words
        - load_filing_document
        - filter_exclusively_domestic_operations
        - filter_foreign_currency_risk
        - extract_company_industry_and_risk_factor_count
        - normalize_nullable_extracted_fields
        - filter_complete_extractions
        - deduplicate_company_names
        - unnest_deduplicated_companies
        - order_by_risk_factor_count
        - unnest_ordered_companies
        - limit_to_10_companies
        - unnest_limited_companies
        - project_answer_fields
        - unnest_answer_rows
  output:
    type: file
    path: raw_outputs/finance/output_finance-034.json
