datasets:
  sec_2023_filings:
    type: file
    path: data/SEC/CSV/2023.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
default_embedding_api_base: ${EMBEDDING_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: load_filing_document
    type: code_map
    code: |
      def transform(doc):
          import os

          base_dir = os.path.abspath(os.path.join("data", "SEC"))
          text_path = os.path.abspath(
              os.path.join(base_dir, str(doc.get("text", "")))
          )
          if os.path.commonpath([base_dir, text_path]) != base_dir:
              raise ValueError("SEC text path escapes data/SEC")
          with open(text_path, "r", encoding="utf-8", errors="replace") as handle:
              document = handle.read()
          return {"document": document}

  - name: classify_primary_revenue_model
    type: map
    optimize: true
    prompt: |
      Assign this 2023 SEC 10-K filing to exactly one primary revenue-model
      category:

      - advertising: revenue primarily from advertising;
      - commission: revenue primarily from commissions;
      - interest_income: revenue primarily from interest income;
      - investment_returns: revenue primarily from investment returns;
      - licensing_royalties: revenue primarily from licensing or royalties;
      - mixed: multiple listed models are material with no single primary model;
      - product_sales: revenue primarily from product sales;
      - rental_income: revenue primarily from rentals or leases;
      - service_fees: revenue primarily from non-subscription service fees;
      - subscription: revenue primarily from subscriptions or memberships.

      Base the category on how the reporting company earns revenue.
      Set revenue_model_determined=true only when one category is supported. If
      no primary model can be determined, set it to false and return mixed only as
      the required placeholder; the following deterministic operation converts it to
      null.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        revenue_model_determined: boolean
        revenue_model_value: enum[advertising, commission, interest_income, investment_returns, licensing_royalties, mixed, product_sales, rental_income, service_fees, subscription]
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 256
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: normalize_nullable_revenue_model
    type: code_map
    code: |
      def transform(doc):
          if doc.get("revenue_model_determined") is not True:
              return {"revenue_model": None}
          return {"revenue_model": doc.get("revenue_model_value")}

  - name: filter_determined_revenue_models
    type: code_filter
    code: |
      def transform(doc):
          return doc.get("revenue_model") is not None

  - name: extract_reported_employee_count
    type: map
    optimize: true
    prompt: |
      Extract the total employee count explicitly reported for the company in
      this 2023 SEC 10-K filing.

      Use a company-wide total for the latest reporting date covered by the
      filing, rather than a partial workforce figure.

      Set employee_count_available=true only when an explicit total employee count
      is disclosed. If it is not disclosed, set the flag to false and return 0
      as the required placeholder; the following deterministic operation converts
      it to null.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        employee_count_available: boolean
        employee_count_value: integer
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 256
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: normalize_nullable_employee_count
    type: code_map
    code: |
      def transform(doc):
          if doc.get("employee_count_available") is not True:
              return {"employee_count": None}
          try:
              return {"employee_count": int(doc.get("employee_count_value"))}
          except (TypeError, ValueError):
              return {"employee_count": None}

  - name: aggregate_by_revenue_model
    type: code_reduce
    reduce_key: revenue_model
    code: |
      def transform(items):
          from decimal import Decimal, ROUND_HALF_UP

          employee_counts = [
              int(item["employee_count"])
              for item in items
              if item.get("employee_count") is not None
          ]
          average_employee_count = (
              int(
                  (
                      Decimal(sum(employee_counts))
                      / Decimal(len(employee_counts))
                  ).quantize(Decimal("1"), rounding=ROUND_HALF_UP)
              )
              if employee_counts
              else None
          )
          return {
              "filing_count": len(items),
              "average_employee_count": average_employee_count,
          }

  - name: pack_revenue_model_dictionary
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          return {
              str(item.get("revenue_model", "")): {
                  "filing_count": item.get("filing_count"),
                  "average_employee_count": item.get(
                      "average_employee_count"
                  ),
              }
              for item in items
              if str(item.get("revenue_model", ""))
          }

pipeline:
  steps:
    - name: process
      input: sec_2023_filings
      operations:
        - load_filing_document
        - classify_primary_revenue_model
        - normalize_nullable_revenue_model
        - filter_determined_revenue_models
        - extract_reported_employee_count
        - normalize_nullable_employee_count
        - aggregate_by_revenue_model
        - pack_revenue_model_dictionary
  output:
    type: file
    path: raw_outputs/finance/output_finance-018.json
