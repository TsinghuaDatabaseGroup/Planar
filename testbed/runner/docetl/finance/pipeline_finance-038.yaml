datasets:
  sec_2022_filings:
    type: file
    path: data/SEC/CSV/2022.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
default_embedding_api_base: ${EMBEDDING_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_filings_over_65000_words
    type: code_filter
    code: |
      def transform(doc):
          try:
              return int(doc.get("word_count", 0)) > 65000
          except (TypeError, ValueError):
              return False

  - name: load_filing_document
    type: code_map
    code: |
      def transform(doc):
          import os

          base_dir = os.path.abspath(os.path.join("data", "SEC"))
          text_path = os.path.abspath(
              os.path.join(base_dir, str(doc.get("text", "")))
          )
          if os.path.commonpath([base_dir, text_path]) != base_dir:
              raise ValueError("SEC text path escapes data/SEC")
          with open(text_path, "r", encoding="utf-8", errors="replace") as handle:
              document = handle.read()
          return {"document": document}

  - name: filter_substantial_going_concern_doubt
    type: filter
    optimize: true
    prompt: |
      Keep this 2022 SEC 10-K filing only if it states that substantial doubt
      exists about the reporting company's ability to continue as a going
      concern.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        is_match: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: filter_operations_outside_united_states
    type: filter
    optimize: true
    prompt: |
      Keep this 2022 SEC 10-K filing only if it describes actual operations by
      the reporting company outside the United States.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        is_match: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 64
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: classify_competitive_position
    type: map
    optimize: true
    prompt: |
      Assign the reporting company's determinable competitive position in this
      2022 SEC 10-K filing to exactly one category:

      - emerging: an early-stage or emerging competitor;
      - niche_player: a competitor focused on a specialized market niche;
      - challenger: a challenger to larger or leading competitors;
      - major_player: a major established competitor that is not the market leader;
      - market_leader: a recognized leader in its primary market;
      - undetermined: the filing does not support a reliable assignment.

      Base the category on the filing's description of the reporting company's
      current competitive position.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        competitive_position: enum[emerging, niche_player, challenger, major_player, market_leader, undetermined]
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 256
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: filter_determinable_competitive_position
    type: code_filter
    code: |
      def transform(doc):
          return doc.get("competitive_position") != "undetermined"

  - name: extract_reported_employee_count
    type: map
    optimize: true
    prompt: |
      Extract the total employee count reported for the reporting company in this
      2022 SEC 10-K filing.

      Use an explicitly reported company-wide total for the latest reporting date
      covered by the filing, rather than a partial workforce figure.

      Set employee_count_available to false and return 0 as the required
      placeholder if no company-wide employee count is reported. The following
      deterministic operation converts that placeholder to null.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        employee_count_available: boolean
        employee_count_value: integer
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 256
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: normalize_nullable_employee_count
    type: code_map
    code: |
      def transform(doc):
          if doc.get("employee_count_available") is not True:
              return {"employee_count": None}
          try:
              employee_count = int(doc.get("employee_count_value"))
          except (TypeError, ValueError):
              employee_count = None
          if employee_count is not None and employee_count < 0:
              employee_count = None
          return {"employee_count": employee_count}

  - name: aggregate_position_statistics
    type: code_reduce
    reduce_key: competitive_position
    code: |
      def transform(items):
          import statistics

          employee_counts = [
              int(item.get("employee_count"))
              for item in items
              if item.get("employee_count") is not None
          ]
          median_employee_count = (
              round(float(statistics.median(employee_counts)), 1)
              if employee_counts
              else None
          )
          return {
              "competitive_position": items[0].get(
                  "competitive_position",
                  "",
              ),
              "filing_count": len(items),
              "median_employee_count": median_employee_count,
          }

  - name: summarize_top_risk_theme_by_position
    type: reduce
    optimize: true
    recursively_optimize: false
    synthesize_resolve: false
    synthesize_merge: true
    reduce_key: competitive_position
    fold_batch_size: 1
    prompt: |
      Determine which of these risk themes are present in the filing:
      debt_financing, regulatory_compliance, litigation_legal, key_personnel,
      customer_concentration, intellectual_property, and cybersecurity.

      Initialize each corresponding count to 1 when its theme is present and 0
      otherwise. Set top_risk_theme to the theme with the highest initialized
      count, breaking ties alphabetically by the exact snake_case label.

      {% for filing in inputs %}
      FILING:
      {{ filing.document }}
      {% endfor %}
    fold_prompt: |
      Update the accumulated theme frequencies for competitive-position group
      {{ reduce_key.competitive_position }} using the one new filing below.

      Determine which of the same seven risk themes are present in the new filing.
      Increment each corresponding prior frequency by 1 when present and preserve
      it otherwise. Set top_risk_theme to the theme with the largest updated
      frequency, breaking ties alphabetically by the exact snake_case label.

      PRIOR ACCUMULATED OUTPUT:
      {{ output }}

      {% for filing in inputs %}
      NEW FILING:
      {{ filing.document }}
      {% endfor %}
    output:
      mode: structured_output
      schema:
        debt_financing_count: integer
        regulatory_compliance_count: integer
        litigation_legal_count: integer
        key_personnel_count: integer
        customer_concentration_count: integer
        intellectual_property_count: integer
        cybersecurity_count: integer
        top_risk_theme: enum[debt_financing, regulatory_compliance, litigation_legal, key_personnel, customer_concentration, intellectual_property, cybersecurity]
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 512
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: join_position_statistics_and_theme_summary
    type: equijoin
    deterministic: true
    blocking_conditions:
      - left["competitive_position"] == right["competitive_position"]

  - name: filter_positions_with_at_least_10_filings
    type: code_filter
    code: |
      def transform(doc):
          try:
              return int(doc.get("filing_count", 0)) >= 10
          except (TypeError, ValueError):
              return False

  - name: order_and_project_position_summaries
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          rows = [
              {
                  "competitive_position": item.get(
                      "competitive_position_left",
                      item.get("competitive_position", ""),
                  ),
                  "filing_count": int(item.get("filing_count", 0)),
                  "median_employee_count": item.get(
                      "median_employee_count"
                  ),
                  "top_risk_theme": item.get("top_risk_theme", ""),
              }
              for item in items
          ]
          rows.sort(
              key=lambda item: (
                  -item["filing_count"],
                  item["competitive_position"],
              )
          )
          return {"rows": rows}

  - name: unnest_ordered_position_summaries
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - competitive_position
      - filing_count
      - median_employee_count
      - top_risk_theme

pipeline:
  steps:
    - name: qualified_filings
      input: sec_2022_filings
      operations:
        - filter_filings_over_65000_words
        - load_filing_document
        - filter_substantial_going_concern_doubt
        - filter_operations_outside_united_states
        - classify_competitive_position
        - filter_determinable_competitive_position
        - extract_reported_employee_count
        - normalize_nullable_employee_count
    - name: position_stats
      input: qualified_filings
      operations:
        - aggregate_position_statistics
    - name: theme_summary
      input: qualified_filings
      operations:
        - summarize_top_risk_theme_by_position
    - name: joined_summaries
      operations:
        - join_position_statistics_and_theme_summary:
            left: position_stats
            right: theme_summary
    - name: process
      input: joined_summaries
      operations:
        - filter_positions_with_at_least_10_filings
        - order_and_project_position_summaries
        - unnest_ordered_position_summaries
  output:
    type: file
    path: raw_outputs/finance/output_finance-038.json
