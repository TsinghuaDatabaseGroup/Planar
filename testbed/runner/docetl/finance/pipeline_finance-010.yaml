datasets:
  sec_2023_filings:
    type: file
    path: data/SEC/CSV/2023.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
default_embedding_api_base: ${EMBEDDING_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: load_filing_document
    type: code_map
    code: |
      def transform(doc):
          import os

          base_dir = os.path.abspath(os.path.join("data", "SEC"))
          text_path = os.path.abspath(
              os.path.join(base_dir, str(doc.get("text", "")))
          )
          if os.path.commonpath([base_dir, text_path]) != base_dir:
              raise ValueError("SEC text path escapes data/SEC")
          with open(text_path, "r", encoding="utf-8", errors="replace") as handle:
              document = handle.read()
          return {"document": document}

  - name: extract_esg_and_ai_ml_mentions
    type: map
    optimize: true
    prompt: |
      Analyze this 2023 SEC 10-K filing and return two boolean indicators:

      - esg_mentioned: whether the filing mentions ESG, sustainability, or an
        environmental, social, or governance topic;
      - ai_ml_mentioned: true when the filing contains a qualifying reference to
        artificial intelligence or machine-learning technology.

      Filing:
      {{ input.document }}
    output:
      mode: structured_output
      schema:
        esg_mentioned: boolean
        ai_ml_mentioned: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 256
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: count_four_mention_categories
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          both = 0
          esg_only = 0
          ai_ml_only = 0
          neither = 0

          for item in items:
              esg = item.get("esg_mentioned") is True
              ai_ml = item.get("ai_ml_mentioned") is True
              if esg and ai_ml:
                  both += 1
              elif esg:
                  esg_only += 1
              elif ai_ml:
                  ai_ml_only += 1
              else:
                  neither += 1

          return {
              "both_esg_and_ai_ml": both,
              "esg_only": esg_only,
              "ai_ml_only": ai_ml_only,
              "neither": neither,
          }

pipeline:
  steps:
    - name: process
      input: sec_2023_filings
      operations:
        - load_filing_document
        - extract_esg_and_ai_ml_mentions
        - count_four_mention_categories
  output:
    type: file
    path: raw_outputs/finance/output_finance-010.json
