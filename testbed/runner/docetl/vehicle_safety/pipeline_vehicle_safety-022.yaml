datasets:
  nhtsa_complaints:
    type: file
    path: data/nhtsa_vehicle_safety/complaints.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_medical_attention_complaints
    type: code_filter
    code: |
      def transform(doc):
          return doc.get("medical_attention_flag") == "true"

  - name: classify_concrete_safety_event_narrative
    type: filter
    optimize: true
    prompt: |
      Determine whether this complaint narrative describes a concrete vehicle
      malfunction, crash sequence, or safety incident.

      Qualifying narratives identify an actual malfunction, loss of vehicle
      function or control, collision sequence, fire, deployment, or another
      concrete safety event. A narrative that only concerns billing, paperwork,
      recordkeeping, warranty administration, customer-service logistics, or
      service scheduling does not qualify.

      Complaint narrative:
      {{ input.summary_text }}
    output:
      mode: structured_output
      schema:
        describes_concrete_safety_event: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: classify_primary_safety_event_topic
    type: map
    optimize: true
    prompt: |
      Classify the primary safety-event topic in this complaint using exactly one
      label:

      - steering: steering control, steering linkage, steering assist, or loss of
        directional control caused primarily by steering;
      - braking: service brakes, parking brakes, brake control, or stopping ability;
      - airbag: airbags, inflators, airbag deployment, or occupant-restraint airbag
        systems;
      - electrical: wiring, circuits, electrical power, batteries as electrical
        equipment, or electrical faults;
      - powertrain: engine, transmission, drivetrain, propulsion, acceleration, or
        motive power;
      - other: none of the preceding topics is the complaint's primary safety event.

      Choose the principal malfunction or event, not a secondary consequence,
      incidental component mention, repair detail, or background condition.

      Complaint narrative:
      {{ input.summary_text }}
    output:
      mode: structured_output
      schema:
        topic: enum[steering, braking, airbag, electrical, powertrain, other]
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: count_complaints_by_topic
    type: code_reduce
    reduce_key: topic
    code: |
      def transform(items):
          return {"complaint_count": len(items)}

  - name: order_and_limit_top_three_topics
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          ordered = sorted(
              items,
              key=lambda item: (
                  -int(item.get("complaint_count") or 0),
                  str(item.get("topic") or ""),
              ),
          )
          rows = [
              {
                  "topic": item.get("topic"),
                  "complaint_count": item.get("complaint_count"),
              }
              for item in ordered[:3]
          ]
          return {"rows": rows}

  - name: unnest_top_three_topics
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - topic
      - complaint_count

pipeline:
  steps:
    - name: top_medical_attention_safety_topics
      input: nhtsa_complaints
      operations:
        - filter_medical_attention_complaints
        - classify_concrete_safety_event_narrative
        - classify_primary_safety_event_topic
        - count_complaints_by_topic
        - order_and_limit_top_three_topics
        - unnest_top_three_topics
  output:
    type: file
    path: raw_outputs/vehicle_safety/output_vehicle_safety-022.json
