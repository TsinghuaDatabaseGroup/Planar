datasets:
  nhtsa_complaints:
    type: file
    path: data/nhtsa_vehicle_safety/complaints.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_injury_rav4_complaints_without_fire
    type: code_filter
    code: |
      def transform(doc):
          try:
              model_year = int(doc.get("model_year", 0))
          except (TypeError, ValueError):
              model_year = 0
          try:
              injury_count = int(doc.get("injury_count", 0))
          except (TypeError, ValueError):
              injury_count = 0
          return (
              doc.get("make") == "TOYOTA"
              and doc.get("model") == "RAV4"
              and model_year in {2021, 2022, 2023, 2024}
              and injury_count >= 1
              and str(doc.get("fire_flag", "")).lower() == "false"
          )

  - name: assess_at_least_ten_brake_failures
    type: reduce
    optimize: true
    recursively_optimize: false
    synthesize_resolve: false
    synthesize_merge: true
    reduce_key: _all
    prompt: |
      Review every NHTSA complaint summary below and determine how many describe an
      actual loss of braking ability or an unexpected brake failure in the subject
      vehicle.

      Qualifying reports include brakes that failed to stop or slow the vehicle,
      materially lost braking effectiveness, became unexpectedly inoperative, or
      otherwise failed when braking was needed. Do not count ordinary brake wear,
      warning lights without described braking loss, routine maintenance, expected
      braking, hypothetical concerns, or failures explicitly ruled out.

      Return answer=Yes if at least ten summaries qualify. Return answer=No if fewer
      than ten qualify. Evaluate the complete collection and count each input
      complaint at most once.

      {% for item in inputs %}
      Complaint summary:
      {{ item.summary_text }}
      ---
      {% endfor %}
    output:
      mode: structured_output
      schema:
        answer: enum[Yes, No]
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

pipeline:
  steps:
    - name: brake_failure_threshold
      input: nhtsa_complaints
      operations:
        - filter_injury_rav4_complaints_without_fire
        - assess_at_least_ten_brake_failures
  output:
    type: file
    path: raw_outputs/vehicle_safety/output_vehicle_safety-010.json
