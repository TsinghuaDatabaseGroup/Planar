datasets:
  nhtsa_complaints:
    type: file
    path: data/nhtsa_vehicle_safety/complaints.csv
  nhtsa_recalls:
    type: file
    path: data/nhtsa_vehicle_safety/recalls.jsonl
  nhtsa_investigation_reports:
    type: file
    path: data/nhtsa_vehicle_safety/investigation_reports/*.txt

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
default_embedding_api_base: ${EMBEDDING_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_chevrolet_brakes_complaints
    type: code_filter
    code: |
      def transform(doc):
          return (
              doc.get("make") == "CHEVROLET"
              and doc.get("component_id") == "BRAKES"
          )

  - name: filter_chevrolet_brakes_recalls
    type: code_filter
    code: |
      def transform(doc):
          vehicle = doc.get("vehicle") or {}
          component = doc.get("component") or {}
          return (
              vehicle.get("make") == "CHEVROLET"
              and component.get("component_id") == "BRAKES"
          )

  - name: flatten_chevrolet_brakes_recall_fields
    type: code_map
    code: |
      def transform(doc):
          campaign = doc.get("campaign") or {}
          vehicle = doc.get("vehicle") or {}
          component = doc.get("component") or {}
          risk = doc.get("risk") or {}
          return {
              "campaign_number": campaign.get("number"),
              "make": vehicle.get("make"),
              "component_id": component.get("component_id"),
              "defect_summary": risk.get("defect_summary") or "",
              "consequence_summary": risk.get("consequence_summary") or "",
          }

  - name: match_chevrolet_brakes_complaints_to_recalls
    type: equijoin
    comparison_prompt: |
      Determine whether this Chevrolet brake complaint and Chevrolet brake recall
      describe the same concrete braking defect or risk mechanism.

      Match only when the complaint narrative and recall defect identify the same
      failure mechanism, control defect, or directly equivalent brake problem. A
      shared BRAKES category, braking symptom, crash risk, or broad consequence
      alone is not sufficient.

      COMPLAINT:
      {{ left.summary_text }}

      RECALL DEFECT:
      {{ right.defect_summary }}
    blocking_conditions:
      - left["component_id"] == right["component_id"]
    comparison_model: Qwen3.5-397B-A17B
    timeout: 120
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: extract_chevrolet_braking_defect_theme
    type: map
    optimize: true
    prompt: |
      Extract the braking defect theme shared by this matched complaint and
      recall in no more than 8 words.

      Return only the common failure mechanism or defect. Do not return the
      vehicle identity, campaign number, downstream consequence, remedy, or an
      explanatory sentence. Retain only details supported by both texts.

      Complaint:
      {{ input.summary_text }}

      Recall defect:
      {{ input.defect_summary }}
    output:
      mode: structured_output
      schema:
        defect_theme: string
    validate:
      - len(output["defect_theme"].strip()) > 0
      - len(output["defect_theme"].strip().split()) <= 8
    num_retries_on_validate_failure: 2
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: classify_chevrolet_braking_safety_risk
    type: filter
    optimize: true
    prompt: |
      Determine whether this matched evidence describes a braking safety risk
      with potential crash, loss-of-control, or extended-stopping consequence.

      Use the complaint narrative and recall consequence. Qualify only when the
      evidence establishes a concrete braking-performance or brake-control risk
      that can impair safe stopping or vehicle control. Do not qualify warning
      lights, noises, maintenance issues, or cosmetic concerns alone.

      Complaint:
      {{ input.summary_text }}

      Recall consequence:
      {{ input.consequence_summary }}
    output:
      mode: structured_output
      schema:
        is_braking_safety_risk: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: filter_candidate_chevrolet_brake_reports
    type: code_filter
    code: |
      def transform(doc):
          body = str(doc.get("body") or "").lower()
          return (
              "chevrolet" in body
              or "gm" in body
              or "brake" in body
          )

  - name: match_chevrolet_brake_themes_to_reports
    type: equijoin
    optimize: true
    comparison_prompt: |
      Determine whether this NHTSA investigation report discusses the same
      Chevrolet or GM braking issue or ODI risk finding as the matched
      complaint-recall defect theme.

      Match only when the report addresses the same concrete braking mechanism,
      control failure, or directly equivalent safety risk and contains an ODI
      investigation, assessment, or finding about that issue. Chevrolet, GM,
      brake, crash, or stopping vocabulary alone is not sufficient.

      DEFECT THEME:
      {{ left.defect_theme }}

      COMPLAINT:
      {{ left.summary_text }}

      RECALL DEFECT:
      {{ left.defect_summary }}

      INVESTIGATION REPORT:
      {{ right.body }}
    blocking_keys:
      left:
        - defect_theme
        - summary_text
        - defect_summary
      right:
        - body
    blocking_target_recall: 0.95
    embedding_model: Qwen3-Embedding-8B
    comparison_model: Qwen3.5-397B-A17B
    timeout: 120
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: aggregate_chevrolet_brake_themes
    type: code_reduce
    reduce_key: defect_theme
    code: |
      def transform(items):
          complaint_ids = {
              item.get("complaint_id")
              for item in items
              if item.get("complaint_id")
          }
          campaign_numbers = {
              item.get("campaign_number")
              for item in items
              if item.get("campaign_number")
          }
          related_report_ids = sorted(
              {
                  item.get("file_id")
                  for item in items
                  if item.get("file_id")
              }
          )
          report_bodies = sorted(
              {
                  item.get("body")
                  for item in items
                  if item.get("body")
              }
          )
          return {
              "matched_complaint_count": len(complaint_ids),
              "distinct_campaign_count": len(campaign_numbers),
              "related_report_ids": related_report_ids,
              "report_bodies": report_bodies,
          }

  - name: summarize_chevrolet_odi_braking_risk
    type: map
    optimize: true
    prompt: |
      Summarize the ODI braking-risk finding across these related investigation
      report bodies in one short phrase.

      Capture the report-supported ODI finding or risk signal for this defect
      theme. Do not list report IDs, repeat the theme label, or add conclusions
      not supported by the supplied reports.

      Related investigation reports:
      {{ input.report_bodies }}
    output:
      mode: structured_output
      schema:
        odi_risk_summary: string
    validate:
      - len(output["odi_risk_summary"].strip()) > 0
    num_retries_on_validate_failure: 2
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: order_limit_and_rank_chevrolet_brake_themes
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          ordered = sorted(
              items,
              key=lambda item: (
                  -int(item.get("matched_complaint_count") or 0),
                  str(item.get("defect_theme") or ""),
              ),
          )
          rows = [
              {
                  "rank": index,
                  "defect_theme": item.get("defect_theme"),
                  "matched_complaint_count": item.get(
                      "matched_complaint_count"
                  ),
                  "distinct_campaign_count": item.get(
                      "distinct_campaign_count"
                  ),
                  "related_report_ids": item.get(
                      "related_report_ids"
                  ) or [],
                  "odi_risk_summary": item.get("odi_risk_summary"),
              }
              for index, item in enumerate(ordered[:2], start=1)
          ]
          return {"rows": rows}

  - name: unnest_ranked_chevrolet_brake_themes
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - rank
      - defect_theme
      - matched_complaint_count
      - distinct_campaign_count
      - related_report_ids
      - odi_risk_summary

pipeline:
  steps:
    - name: chevrolet_brakes_complaints
      input: nhtsa_complaints
      operations:
        - filter_chevrolet_brakes_complaints
    - name: chevrolet_brakes_recalls
      input: nhtsa_recalls
      operations:
        - filter_chevrolet_brakes_recalls
        - flatten_chevrolet_brakes_recall_fields
    - name: matched_chevrolet_brakes_pairs
      operations:
        - match_chevrolet_brakes_complaints_to_recalls:
            left: chevrolet_brakes_complaints
            right: chevrolet_brakes_recalls
    - name: qualified_chevrolet_brakes_pairs
      input: matched_chevrolet_brakes_pairs
      operations:
        - extract_chevrolet_braking_defect_theme
        - classify_chevrolet_braking_safety_risk
    - name: candidate_chevrolet_brake_reports
      input: nhtsa_investigation_reports
      operations:
        - filter_candidate_chevrolet_brake_reports
    - name: matched_chevrolet_brake_reports
      operations:
        - match_chevrolet_brake_themes_to_reports:
            left: qualified_chevrolet_brakes_pairs
            right: candidate_chevrolet_brake_reports
    - name: ranked_chevrolet_brake_themes
      input: matched_chevrolet_brake_reports
      operations:
        - aggregate_chevrolet_brake_themes
        - summarize_chevrolet_odi_braking_risk
        - order_limit_and_rank_chevrolet_brake_themes
        - unnest_ranked_chevrolet_brake_themes
  output:
    type: file
    path: raw_outputs/vehicle_safety/output_vehicle_safety-045.json
