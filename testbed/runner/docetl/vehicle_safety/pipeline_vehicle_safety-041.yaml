datasets:
  nhtsa_complaints:
    type: file
    path: data/nhtsa_vehicle_safety/complaints.csv
  nhtsa_recalls:
    type: file
    path: data/nhtsa_vehicle_safety/recalls.jsonl
  nhtsa_investigation_reports:
    type: file
    path: data/nhtsa_vehicle_safety/investigation_reports/*.txt

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
default_embedding_api_base: ${EMBEDDING_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_tesla_electrical_complaints
    type: code_filter
    code: |
      def transform(doc):
          return (
              doc.get("make") == "TESLA"
              and doc.get("component_id") == "ELECTRICAL"
          )

  - name: filter_tesla_electrical_recalls
    type: code_filter
    code: |
      def transform(doc):
          vehicle = doc.get("vehicle") or {}
          component = doc.get("component") or {}
          return (
              vehicle.get("make") == "TESLA"
              and component.get("component_id") == "ELECTRICAL"
          )

  - name: flatten_tesla_electrical_recall_fields
    type: code_map
    code: |
      def transform(doc):
          campaign = doc.get("campaign") or {}
          vehicle = doc.get("vehicle") or {}
          component = doc.get("component") or {}
          risk = doc.get("risk") or {}
          return {
              "campaign_number": campaign.get("number"),
              "make": vehicle.get("make"),
              "component_id": component.get("component_id"),
              "defect_summary": risk.get("defect_summary") or "",
              "consequence_summary": risk.get("consequence_summary") or "",
          }

  - name: match_tesla_electrical_complaints_to_recalls
    type: equijoin
    comparison_prompt: |
      Determine whether this Tesla electrical complaint and Tesla electrical
      recall describe the same electrical, warning, software-control, or
      power-loss defect.

      Match only when the narrative and recall identify the same concrete failure
      mechanism or directly equivalent control defect. A shared ELECTRICAL
      category, Tesla make, warning symptom, or broad power-loss consequence alone
      is not sufficient.

      COMPLAINT:
      {{ left.summary_text }}

      RECALL DEFECT:
      {{ right.defect_summary }}
    blocking_conditions:
      - left["component_id"] == right["component_id"]
    comparison_model: Qwen3.5-397B-A17B
    timeout: 120
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: extract_tesla_electrical_defect_mechanism
    type: map
    optimize: true
    prompt: |
      Extract the dominant Tesla electrical defect mechanism shared by this
      matched complaint and recall in no more than 8 words.

      Return only the common electrical, software-control, warning-control, or
      power-loss mechanism. Do not return the vehicle identity, campaign number,
      consequence, repair, or explanatory sentence.

      Complaint:
      {{ input.summary_text }}

      Recall defect:
      {{ input.defect_summary }}
    output:
      mode: structured_output
      schema:
        defect_mechanism: string
    validate:
      - len(output["defect_mechanism"].strip()) > 0
      - len(output["defect_mechanism"].strip().split()) <= 8
    num_retries_on_validate_failure: 2
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: classify_tesla_warning_control_safety_risk
    type: filter
    optimize: true
    prompt: |
      Determine whether this matched evidence describes a driving-safety or
      warning-control risk, rather than only an infotainment or convenience issue.

      Use the complaint narrative and recall consequence. Qualify concrete risks
      involving vehicle control, driver warnings, visibility of safety
      information, loss of motive power, crash avoidance, fire, or another
      safety-critical electrical function. Do not qualify entertainment,
      connectivity, comfort, or convenience effects alone.

      Complaint:
      {{ input.summary_text }}

      Recall consequence:
      {{ input.consequence_summary }}
    output:
      mode: structured_output
      schema:
        is_warning_control_safety_risk: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: filter_candidate_tesla_investigation_reports
    type: code_filter
    code: |
      def transform(doc):
          body = str(doc.get("body") or "").lower()
          return (
              "tesla" in body
              or "autopilot" in body
              or "electrical" in body
          )

  - name: match_tesla_defects_to_investigation_reports
    type: equijoin
    optimize: true
    comparison_prompt: |
      Determine whether this NHTSA investigation report discusses the same Tesla
      control, warning, or electrical-failure risk as the matched
      complaint-recall defect and provides an ODI assessment of that risk.

      Match only when the report addresses the same concrete mechanism or a
      directly equivalent safety-control failure. Tesla, Autopilot, electrical,
      or warning-system vocabulary alone is not sufficient, and the report must
      discuss an ODI investigation, assessment, finding, or safety-risk signal.

      DEFECT MECHANISM:
      {{ left.defect_mechanism }}

      COMPLAINT:
      {{ left.summary_text }}

      RECALL DEFECT:
      {{ left.defect_summary }}

      INVESTIGATION REPORT:
      {{ right.body }}
    blocking_keys:
      left:
        - defect_mechanism
        - summary_text
        - defect_summary
      right:
        - body
    blocking_target_recall: 0.95
    embedding_model: Qwen3-Embedding-8B
    comparison_model: Qwen3.5-397B-A17B
    timeout: 120
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: aggregate_tesla_campaign_evidence
    type: code_reduce
    reduce_key: campaign_number
    code: |
      def transform(items):
          complaint_ids = {
              item.get("complaint_id")
              for item in items
              if item.get("complaint_id")
          }
          reports_by_id = {}
          for item in items:
              file_id = item.get("file_id")
              body = item.get("body")
              if file_id and body and file_id not in reports_by_id:
                  reports_by_id[file_id] = body

          related_report_ids = sorted(reports_by_id)
          return {
              "matched_complaint_count": len(complaint_ids),
              "related_report_ids": related_report_ids,
              "defect_mechanisms": [
                  item.get("defect_mechanism")
                  for item in items
                  if item.get("defect_mechanism")
              ],
              "report_bodies": [
                  reports_by_id[file_id]
                  for file_id in related_report_ids
              ],
          }

  - name: summarize_tesla_campaign_odi_risk
    type: map
    optimize: true
    prompt: |
      Analyze the mechanisms and related investigation reports for this Tesla
      recall campaign, then return both requested fields.

      dominant_defect_mechanism: the mechanism best supported across the supplied
      mechanism instances. Return one concise mechanism in no more than 8 words,
      without adding a new mechanism.

      odi_risk_summary: one short phrase capturing the report-supported ODI risk
      signal for the campaign. Do not list report IDs or add unsupported findings.

      Extracted mechanisms:
      {{ input.defect_mechanisms }}

      Related investigation reports:
      {{ input.report_bodies }}
    output:
      mode: structured_output
      schema:
        odi_risk_summary: string
        dominant_defect_mechanism: string
    validate:
      - len(output["odi_risk_summary"].strip()) > 0
      - len(output["dominant_defect_mechanism"].strip()) > 0
      - len(output["dominant_defect_mechanism"].strip().split()) <= 8
    num_retries_on_validate_failure: 2
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: project_tesla_campaign_odi_summary
    type: code_map
    code: |
      def transform(doc):
          return {
              "campaign_number": doc.get("campaign_number"),
              "matched_complaint_count": doc.get(
                  "matched_complaint_count"
              ),
              "related_report_ids": doc.get("related_report_ids") or [],
              "dominant_defect_mechanism": doc.get(
                  "dominant_defect_mechanism"
              ),
              "odi_risk_summary": doc.get("odi_risk_summary"),
          }

pipeline:
  steps:
    - name: tesla_electrical_complaints
      input: nhtsa_complaints
      operations:
        - filter_tesla_electrical_complaints
    - name: tesla_electrical_recalls
      input: nhtsa_recalls
      operations:
        - filter_tesla_electrical_recalls
        - flatten_tesla_electrical_recall_fields
    - name: matched_tesla_electrical_pairs
      operations:
        - match_tesla_electrical_complaints_to_recalls:
            left: tesla_electrical_complaints
            right: tesla_electrical_recalls
    - name: qualified_tesla_electrical_pairs
      input: matched_tesla_electrical_pairs
      operations:
        - extract_tesla_electrical_defect_mechanism
        - classify_tesla_warning_control_safety_risk
    - name: candidate_tesla_investigation_reports
      input: nhtsa_investigation_reports
      operations:
        - filter_candidate_tesla_investigation_reports
    - name: matched_tesla_investigation_reports
      operations:
        - match_tesla_defects_to_investigation_reports:
            left: qualified_tesla_electrical_pairs
            right: candidate_tesla_investigation_reports
    - name: tesla_campaign_odi_summaries
      input: matched_tesla_investigation_reports
      operations:
        - aggregate_tesla_campaign_evidence
        - summarize_tesla_campaign_odi_risk
        - project_tesla_campaign_odi_summary
  output:
    type: file
    path: raw_outputs/vehicle_safety/output_vehicle_safety-041.json
