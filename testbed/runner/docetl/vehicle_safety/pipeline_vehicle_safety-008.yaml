datasets:
  nhtsa_recalls:
    type: file
    path: data/nhtsa_vehicle_safety/recalls.jsonl

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_tesla_steering_without_consumer_warnings
    type: code_filter
    code: |
      def transform(doc):
          vehicle = doc.get("vehicle") or {}
          component = doc.get("component") or {}
          risk = doc.get("risk") or {}
          return (
              vehicle.get("make") == "TESLA"
              and component.get("component_id") == "STEERING"
              and str(risk.get("park_outside", "")).upper() == "FALSE"
              and str(risk.get("do_not_drive", "")).upper() == "FALSE"
          )

  - name: flatten_campaign_and_defect_summary
    type: code_map
    code: |
      def transform(doc):
          campaign = doc.get("campaign") or {}
          risk = doc.get("risk") or {}
          return {
              "campaign_number": campaign.get("number"),
              "defect_summary": risk.get("defect_summary"),
          }

  - name: deduplicate_campaign_numbers
    type: code_reduce
    reduce_key: campaign_number
    code: |
      def transform(items):
          summaries = sorted(
              {
                  str(item.get("defect_summary", "")).strip()
                  for item in items
                  if str(item.get("defect_summary", "")).strip()
              }
          )
          return {"defect_summary": summaries[0] if summaries else ""}

  - name: extract_primary_failure_cause
    type: map
    optimize: true
    prompt: |
      Identify the single primary failure cause stated in this NHTSA steering-recall
      defect summary.

      Return a short canonical cause phrase of at most six words. Describe the
      underlying cause identified by the summary, not merely the resulting steering
      symptom, safety consequence, remedy, or affected vehicles. Do not infer a cause
      that is not stated.

      Defect summary:
      {{ input.defect_summary }}
    output:
      mode: structured_output
      schema:
        primary_cause_phrase: string
    validate:
      - 1 <= len(output["primary_cause_phrase"].split()) <= 6
    num_retries_on_validate_failure: 2
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: project_campaign_cause_columns
    type: code_map
    code: |
      def transform(doc):
          return {
              "campaign_number": doc.get("campaign_number"),
              "primary_cause_phrase": str(
                  doc.get("primary_cause_phrase", "")
              ).strip(),
          }

pipeline:
  steps:
    - name: steering_campaign_causes
      input: nhtsa_recalls
      operations:
        - filter_tesla_steering_without_consumer_warnings
        - flatten_campaign_and_defect_summary
        - deduplicate_campaign_numbers
        - extract_primary_failure_cause
        - project_campaign_cause_columns
  output:
    type: file
    path: raw_outputs/vehicle_safety/output_vehicle_safety-008.json
