datasets:
  nhtsa_complaints:
    type: file
    path: data/nhtsa_vehicle_safety/complaints.csv
  nhtsa_recalls:
    type: file
    path: data/nhtsa_vehicle_safety/recalls.jsonl

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_adas_complaints
    type: code_filter
    code: |
      def transform(doc):
          return doc.get("component_id") == "ADAS"

  - name: classify_phantom_braking_complaint
    type: filter
    optimize: true
    prompt: |
      Determine whether this complaint specifically describes phantom braking:
      sudden, automatic, and unprovoked braking initiated by a driver-assist
      system.

      Qualify cases in which automatic emergency braking, collision avoidance,
      adaptive cruise control, or another driver-assist function applies the
      brakes without a legitimate obstacle or driver request. Do not qualify
      ordinary driver braking, justified automatic braking, a generic brake
      malfunction, unintended acceleration, or an ADAS concern without an
      unprovoked automatic-braking event.

      Complaint summary:
      {{ input.summary_text }}
    output:
      mode: structured_output
      schema:
        describes_phantom_braking: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: count_phantom_braking_complaints_by_make
    type: code_reduce
    reduce_key: make
    code: |
      def transform(items):
          complaint_ids = {
              item.get("complaint_id")
              for item in items
              if item.get("complaint_id")
          }
          return {
              "phantom_braking_complaint_count": len(complaint_ids),
          }

  - name: filter_adas_recalls
    type: code_filter
    code: |
      def transform(doc):
          component = doc.get("component") or {}
          return component.get("component_id") == "ADAS"

  - name: flatten_adas_recall_fields
    type: code_map
    code: |
      def transform(doc):
          campaign = doc.get("campaign") or {}
          vehicle = doc.get("vehicle") or {}
          risk = doc.get("risk") or {}
          return {
              "campaign_number": campaign.get("number"),
              "make": vehicle.get("make"),
              "defect_summary": risk.get("defect_summary") or "",
          }

  - name: classify_matching_adas_recall_defect
    type: filter
    optimize: true
    prompt: |
      Determine whether this recall defect summary discusses automatic braking,
      driver-assist braking, adaptive-cruise braking, or speed-control behavior as
      the recall defect.

      The defect must concern how an ADAS function commands, fails to command, or
      controls braking or vehicle speed. Do not qualify a generic driver-assist
      defect, warning-light issue, sensor concern, or unrelated component problem
      unless the described recall defect includes one of those braking or
      speed-control behaviors.

      Recall defect summary:
      {{ input.defect_summary }}
    output:
      mode: structured_output
      schema:
        matches_adas_braking_or_speed_control_defect: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: count_matching_adas_recalls_by_make
    type: code_reduce
    reduce_key: make
    code: |
      def transform(items):
          campaign_numbers = {
              item.get("campaign_number")
              for item in items
              if item.get("campaign_number")
          }
          return {
              "matching_adas_recall_count": len(campaign_numbers),
          }

  - name: join_complaint_and_recall_counts_by_make
    type: equijoin
    deterministic: true
    blocking_conditions:
      - left["make"] == right["make"]

  - name: order_limit_and_rank_top_makes
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          ordered = sorted(
              items,
              key=lambda item: (
                  -int(item.get("phantom_braking_complaint_count") or 0),
                  str(item.get("make_left") or ""),
              ),
          )
          rows = [
              {
                  "rank": index,
                  "make": item.get("make_left"),
                  "phantom_braking_complaint_count": item.get(
                      "phantom_braking_complaint_count"
                  ),
                  "matching_adas_recall_count": item.get(
                      "matching_adas_recall_count"
                  ),
              }
              for index, item in enumerate(ordered[:4], start=1)
          ]
          return {"rows": rows}

  - name: unnest_ranked_top_makes
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - rank
      - make
      - phantom_braking_complaint_count
      - matching_adas_recall_count

pipeline:
  steps:
    - name: phantom_braking_by_make
      input: nhtsa_complaints
      operations:
        - filter_adas_complaints
        - classify_phantom_braking_complaint
        - count_phantom_braking_complaints_by_make
    - name: matching_adas_recalls_by_make
      input: nhtsa_recalls
      operations:
        - filter_adas_recalls
        - flatten_adas_recall_fields
        - classify_matching_adas_recall_defect
        - count_matching_adas_recalls_by_make
    - name: joined_make_counts
      operations:
        - join_complaint_and_recall_counts_by_make:
            left: phantom_braking_by_make
            right: matching_adas_recalls_by_make
    - name: ranked_top_makes
      input: joined_make_counts
      operations:
        - order_limit_and_rank_top_makes
        - unnest_ranked_top_makes
  output:
    type: file
    path: raw_outputs/vehicle_safety/output_vehicle_safety-025.json
