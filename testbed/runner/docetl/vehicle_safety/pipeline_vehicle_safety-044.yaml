datasets:
  nhtsa_complaints:
    type: file
    path: data/nhtsa_vehicle_safety/complaints.csv
  nhtsa_recalls:
    type: file
    path: data/nhtsa_vehicle_safety/recalls.jsonl

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_acura_brakes_complaints
    type: code_filter
    code: |
      def transform(doc):
          return (
              doc.get("make") == "ACURA"
              and doc.get("component_id") == "BRAKES"
          )

  - name: filter_acura_brakes_recalls
    type: code_filter
    code: |
      def transform(doc):
          vehicle = doc.get("vehicle") or {}
          component = doc.get("component") or {}
          return (
              vehicle.get("make") == "ACURA"
              and component.get("component_id") == "BRAKES"
          )

  - name: flatten_acura_brakes_recall_fields
    type: code_map
    code: |
      def transform(doc):
          campaign = doc.get("campaign") or {}
          vehicle = doc.get("vehicle") or {}
          component = doc.get("component") or {}
          risk = doc.get("risk") or {}
          return {
              "campaign_number": campaign.get("number"),
              "make": vehicle.get("make"),
              "component_id": component.get("component_id"),
              "defect_summary": risk.get("defect_summary") or "",
              "consequence_summary": risk.get("consequence_summary") or "",
          }

  - name: match_acura_brakes_complaints_to_recalls
    type: equijoin
    comparison_prompt: |
      Determine whether this Acura brake complaint and Acura brake recall
      describe the same concrete braking defect.

      Match only when the complaint narrative and recall defect identify the same
      failure mechanism or directly equivalent brake malfunction. A shared BRAKES
      category, braking symptom, crash risk, or generic loss-of-braking wording
      alone is not sufficient.

      COMPLAINT:
      {{ left.summary_text }}

      RECALL DEFECT:
      {{ right.defect_summary }}
    blocking_conditions:
      - left["component_id"] == right["component_id"]
    comparison_model: Qwen3.5-397B-A17B
    timeout: 120
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: classify_real_braking_performance_issue
    type: filter
    optimize: true
    prompt: |
      Determine whether this complaint describes a real braking-performance
      safety issue, such as loss of braking, extended stopping distance,
      unintended braking, materially reduced braking force, or brake failure.

      Qualify only when the narrative describes an actual or clearly experienced
      impairment of braking performance. Do not qualify warning lights, noises,
      maintenance concerns, cosmetic issues, or speculative risk without a
      braking-performance event.

      Complaint:
      {{ input.summary_text }}
    output:
      mode: structured_output
      schema:
        is_real_braking_performance_issue: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: extract_acura_braking_failure_mode
    type: map
    optimize: true
    prompt: |
      Extract the dominant braking failure mode shared by this complaint and
      recall in no more than 6 words.

      Return only the concrete failure mechanism or braking behavior. Do not
      return the vehicle identity, campaign number, downstream consequence,
      remedy, or an explanatory sentence. Retain only details supported by both
      texts.

      Complaint:
      {{ input.summary_text }}

      Recall defect:
      {{ input.defect_summary }}
    output:
      mode: structured_output
      schema:
        braking_failure_mode: string
    validate:
      - len(output["braking_failure_mode"].strip()) > 0
      - len(output["braking_failure_mode"].strip().split()) <= 6
    num_retries_on_validate_failure: 2
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: classify_acura_recall_severity
    type: map
    optimize: true
    prompt: |
      Assign this recall consequence to exactly one severity label:

      - critical: life-threatening or catastrophic braking hazard with a high
        potential for fatal crash or complete loss of safe control.
      - severe: major crash or injury exposure, substantial braking loss, or
        another acute braking hazard.
      - moderate: meaningful braking-safety degradation with less acute or more
        limited consequences.
      - minor: limited safety impact or low-severity consequence.

      Base the label only on the recall consequence summary.

      Recall consequence:
      {{ input.consequence_summary }}
    output:
      mode: structured_output
      schema:
        recall_severity: string
    validate:
      - output["recall_severity"] in ["critical", "severe", "moderate", "minor"]
    num_retries_on_validate_failure: 2
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: aggregate_acura_brake_campaigns
    type: code_reduce
    reduce_key: campaign_number
    code: |
      def transform(items):
          from collections import Counter

          complaint_ids = {
              item.get("complaint_id")
              for item in items
              if item.get("complaint_id")
          }
          severe_indicators = []
          for item in items:
              try:
                  injury_count = float(item.get("injury_count") or 0)
              except (TypeError, ValueError):
                  injury_count = 0.0
              severe_indicators.append(
                  item.get("crash_flag") == "true"
                  or injury_count > 0
                  or item.get("vehicle_towed_flag") == "true"
              )

          failure_mode_counts = Counter(
              str(item.get("braking_failure_mode") or "").strip()
              for item in items
              if str(item.get("braking_failure_mode") or "").strip()
          )
          severity_counts = Counter(
              str(item.get("recall_severity") or "").strip()
              for item in items
              if str(item.get("recall_severity") or "").strip()
          )

          dominant_failure_mode = (
              sorted(
                  failure_mode_counts,
                  key=lambda value: (
                      -failure_mode_counts[value],
                      value,
                  ),
              )[0]
              if failure_mode_counts
              else ""
          )
          dominant_recall_severity = (
              sorted(
                  severity_counts,
                  key=lambda value: (-severity_counts[value], value),
              )[0]
              if severity_counts
              else ""
          )
          return {
              "matched_complaint_count": len(complaint_ids),
              "severe_complaint_rate": (
                  sum(severe_indicators) / len(severe_indicators)
                  if severe_indicators
                  else 0.0
              ),
              "dominant_braking_failure_mode": dominant_failure_mode,
              "dominant_recall_severity": dominant_recall_severity,
          }

  - name: order_limit_and_rank_acura_brake_campaigns
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          ordered = sorted(
              items,
              key=lambda item: (
                  -int(item.get("matched_complaint_count") or 0),
                  str(item.get("campaign_number") or ""),
              ),
          )
          rows = [
              {
                  "rank": index,
                  "campaign_number": item.get("campaign_number"),
                  "matched_complaint_count": item.get(
                      "matched_complaint_count"
                  ),
                  "severe_complaint_rate": item.get(
                      "severe_complaint_rate"
                  ),
                  "dominant_braking_failure_mode": item.get(
                      "dominant_braking_failure_mode"
                  ),
                  "dominant_recall_severity": item.get(
                      "dominant_recall_severity"
                  ),
              }
              for index, item in enumerate(ordered[:3], start=1)
          ]
          return {"rows": rows}

  - name: unnest_ranked_acura_brake_campaigns
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - rank
      - campaign_number
      - matched_complaint_count
      - severe_complaint_rate
      - dominant_braking_failure_mode
      - dominant_recall_severity

pipeline:
  steps:
    - name: acura_brakes_complaints
      input: nhtsa_complaints
      operations:
        - filter_acura_brakes_complaints
    - name: acura_brakes_recalls
      input: nhtsa_recalls
      operations:
        - filter_acura_brakes_recalls
        - flatten_acura_brakes_recall_fields
    - name: matched_acura_brakes_pairs
      operations:
        - match_acura_brakes_complaints_to_recalls:
            left: acura_brakes_complaints
            right: acura_brakes_recalls
    - name: ranked_acura_brake_campaigns
      input: matched_acura_brakes_pairs
      operations:
        - classify_real_braking_performance_issue
        - extract_acura_braking_failure_mode
        - classify_acura_recall_severity
        - aggregate_acura_brake_campaigns
        - order_limit_and_rank_acura_brake_campaigns
        - unnest_ranked_acura_brake_campaigns
  output:
    type: file
    path: raw_outputs/vehicle_safety/output_vehicle_safety-044.json
