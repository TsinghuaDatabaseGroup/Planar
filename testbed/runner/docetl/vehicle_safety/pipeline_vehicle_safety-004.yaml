datasets:
  nhtsa_recalls:
    type: file
    path: data/nhtsa_vehicle_safety/recalls.jsonl

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_kia_other_without_park_outside
    type: code_filter
    code: |
      def transform(doc):
          vehicle = doc.get("vehicle") or {}
          component = doc.get("component") or {}
          risk = doc.get("risk") or {}
          return (
              vehicle.get("make") == "KIA"
              and component.get("component_id") == "OTHER"
              and str(risk.get("park_outside", "")).upper() == "FALSE"
          )

  - name: flatten_campaign_and_defect_summary
    type: code_map
    code: |
      def transform(doc):
          campaign = doc.get("campaign") or {}
          risk = doc.get("risk") or {}
          return {
              "campaign_number": campaign.get("number"),
              "defect_summary": risk.get("defect_summary"),
          }

  - name: deduplicate_campaign_numbers
    type: code_reduce
    reduce_key: campaign_number
    code: |
      def transform(items):
          summaries = sorted(
              {
                  str(item.get("defect_summary", "")).strip()
                  for item in items
                  if str(item.get("defect_summary", "")).strip()
              }
          )
          return {"defect_summary": summaries[0] if summaries else ""}

  - name: extract_underlying_failure_mechanism
    type: map
    optimize: true
    prompt: |
      Extract a short canonical phrase describing the underlying physical,
      electrical, mechanical, software, or manufacturing failure mechanism stated
      in this NHTSA defect summary.

      Return only the mechanism, not its consequence, remedy, campaign scope, or a
      complete sentence. The phrase must contain at most six words and must be
      supported by the summary.

      Defect summary:
      {{ input.defect_summary }}
    output:
      mode: structured_output
      schema:
        failure_mechanism: string
    validate:
      - 1 <= len(output["failure_mechanism"].split()) <= 6
    num_retries_on_validate_failure: 2
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: project_campaign_failure_columns
    type: code_map
    code: |
      def transform(doc):
          return {
              "campaign_number": doc.get("campaign_number"),
              "failure_mechanism": str(
                  doc.get("failure_mechanism", "")
              ).strip(),
          }

pipeline:
  steps:
    - name: campaign_failure_mechanisms
      input: nhtsa_recalls
      operations:
        - filter_kia_other_without_park_outside
        - flatten_campaign_and_defect_summary
        - deduplicate_campaign_numbers
        - extract_underlying_failure_mechanism
        - project_campaign_failure_columns
  output:
    type: file
    path: raw_outputs/vehicle_safety/output_vehicle_safety-004.json
