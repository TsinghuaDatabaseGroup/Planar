datasets:
  nhtsa_complaints:
    type: file
    path: data/nhtsa_vehicle_safety/complaints.csv
  nhtsa_recalls:
    type: file
    path: data/nhtsa_vehicle_safety/recalls.jsonl

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_ford_airbag_complaints
    type: code_filter
    code: |
      def transform(doc):
          return (
              doc.get("make") == "FORD"
              and doc.get("component_id") == "AIRBAG"
          )

  - name: filter_ford_airbag_recalls
    type: code_filter
    code: |
      def transform(doc):
          vehicle = doc.get("vehicle") or {}
          component = doc.get("component") or {}
          return (
              vehicle.get("make") == "FORD"
              and component.get("component_id") == "AIRBAG"
          )

  - name: flatten_ford_airbag_recall_fields
    type: code_map
    code: |
      def transform(doc):
          campaign = doc.get("campaign") or {}
          vehicle = doc.get("vehicle") or {}
          component = doc.get("component") or {}
          risk = doc.get("risk") or {}
          remedy = doc.get("remedy") or {}
          return {
              "campaign_number": campaign.get("number"),
              "make": vehicle.get("make"),
              "component_id": component.get("component_id"),
              "defect_summary": risk.get("defect_summary") or "",
              "corrective_action": remedy.get("corrective_action") or "",
          }

  - name: match_ford_airbag_complaints_to_recalls
    type: equijoin
    comparison_prompt: |
      Determine whether this Ford airbag complaint and Ford airbag recall describe
      the same airbag failure mechanism.

      Match when both records identify the same concrete non-deployment,
      unintended-deployment, inflator, restraint-control, sensor, wiring, or other
      airbag failure mechanism. A shared AIRBAG component, warning light, injury,
      crash, or broad deployment vocabulary alone is not sufficient.

      COMPLAINT:
      {{ left.summary_text }}

      RECALL DEFECT:
      {{ right.defect_summary }}
    blocking_conditions:
      - left["component_id"] == right["component_id"]
    comparison_model: Qwen3.5-397B-A17B
    timeout: 120
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: classify_concrete_airbag_safety_event
    type: filter
    optimize: true
    prompt: |
      Determine whether this complaint narrative describes a concrete airbag
      safety event rather than a cosmetic or warning-light-only concern.

      Qualifying events include actual non-deployment in a relevant crash,
      unintended deployment, inflator rupture or fragments, physical restraint
      malfunction, occupant injury, or another experienced deployment hazard. Do
      not qualify an indicator light, diagnostic code, cosmetic condition, routine
      service, or generic concern without a concrete airbag event.

      Complaint narrative:
      {{ input.summary_text }}
    output:
      mode: structured_output
      schema:
        describes_concrete_airbag_safety_event: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: classify_complaint_severity
    type: map
    optimize: true
    prompt: |
      Classify the complaint severity using exactly one label:

      - minor_inconvenience: a limited concrete event with little immediate safety
        impact, no injury or crash exposure, and no substantial loss of restraint
        protection;
      - moderate_safety_event: a meaningful airbag or restraint malfunction that
        impairs safety or creates a hazard, but the narrative does not establish a
        severe outcome or immediately life-threatening event;
      - severe_safety_event: a crash with failed protection, unintended deployment
        causing injury, inflator rupture or fragments, serious injury exposure,
        towing after the event, or another high-consequence airbag failure.

      Classify from the narrative only and choose the highest severity directly
      supported by it.

      Complaint narrative:
      {{ input.summary_text }}
    output:
      mode: structured_output
      schema:
        complaint_severity: enum[minor_inconvenience, moderate_safety_event, severe_safety_event]
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: classify_recall_remedy_style
    type: map
    optimize: true
    prompt: |
      Classify the dominant recall remedy style using exactly one label:

      - software_update: software, firmware, calibration, or control-module
        reprogramming is the principal corrective action;
      - part_replacement: replacement of a physical component, module, inflator,
        assembly, wiring part, or hardware is the principal corrective action;
      - other: the remedy does not primarily fit either preceding style.

      Ignore notification dates, reimbursement language, contact information, and
      interim owner instructions.

      Recall corrective action:
      {{ input.corrective_action }}
    output:
      mode: structured_output
      schema:
        recall_remedy_style: enum[software_update, part_replacement, other]
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: aggregate_ford_airbag_campaign_metrics
    type: code_reduce
    reduce_key: campaign_number
    code: |
      def transform(items):
          from collections import Counter

          complaint_ids = {
              item.get("complaint_id")
              for item in items
              if item.get("complaint_id")
          }
          severe_indicators = []
          for item in items:
              try:
                  injury_count = float(item.get("injury_count") or 0)
              except (TypeError, ValueError):
                  injury_count = 0.0
              severe_indicators.append(
                  item.get("crash_flag") == "true"
                  or injury_count > 0
                  or item.get("vehicle_towed_flag") == "true"
              )

          severity_counts = Counter(
              item.get("complaint_severity")
              for item in items
              if item.get("complaint_severity")
          )
          remedy_counts = Counter(
              item.get("recall_remedy_style")
              for item in items
              if item.get("recall_remedy_style")
          )

          dominant_severity = (
              sorted(
                  severity_counts,
                  key=lambda label: (-severity_counts[label], label),
              )[0]
              if severity_counts
              else None
          )
          dominant_remedy = (
              sorted(
                  remedy_counts,
                  key=lambda label: (-remedy_counts[label], label),
              )[0]
              if remedy_counts
              else None
          )
          return {
              "matched_complaint_count": len(complaint_ids),
              "severe_indicator_rate": (
                  sum(severe_indicators) / len(severe_indicators)
                  if severe_indicators
                  else 0.0
              ),
              "dominant_complaint_severity": dominant_severity,
              "dominant_recall_remedy_style": dominant_remedy,
          }

  - name: order_limit_and_rank_ford_campaigns
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          ordered = sorted(
              items,
              key=lambda item: (
                  -int(item.get("matched_complaint_count") or 0),
                  str(item.get("campaign_number") or ""),
              ),
          )
          rows = [
              {
                  "rank": index,
                  "campaign_number": item.get("campaign_number"),
                  "matched_complaint_count": item.get(
                      "matched_complaint_count"
                  ),
                  "severe_indicator_rate": item.get(
                      "severe_indicator_rate"
                  ),
                  "dominant_complaint_severity": item.get(
                      "dominant_complaint_severity"
                  ),
                  "dominant_recall_remedy_style": item.get(
                      "dominant_recall_remedy_style"
                  ),
              }
              for index, item in enumerate(ordered[:5], start=1)
          ]
          return {"rows": rows}

  - name: unnest_ranked_ford_campaigns
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - rank
      - campaign_number
      - matched_complaint_count
      - severe_indicator_rate
      - dominant_complaint_severity
      - dominant_recall_remedy_style

pipeline:
  steps:
    - name: ford_airbag_complaints
      input: nhtsa_complaints
      operations:
        - filter_ford_airbag_complaints
    - name: ford_airbag_recalls
      input: nhtsa_recalls
      operations:
        - filter_ford_airbag_recalls
        - flatten_ford_airbag_recall_fields
    - name: matching_ford_airbag_pairs
      operations:
        - match_ford_airbag_complaints_to_recalls:
            left: ford_airbag_complaints
            right: ford_airbag_recalls
    - name: classified_ford_airbag_pairs
      input: matching_ford_airbag_pairs
      operations:
        - classify_concrete_airbag_safety_event
        - classify_complaint_severity
        - classify_recall_remedy_style
        - aggregate_ford_airbag_campaign_metrics
        - order_limit_and_rank_ford_campaigns
        - unnest_ranked_ford_campaigns
  output:
    type: file
    path: raw_outputs/vehicle_safety/output_vehicle_safety-036.json
