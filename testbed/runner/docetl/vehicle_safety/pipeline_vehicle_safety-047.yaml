datasets:
  nhtsa_complaints:
    type: file
    path: data/nhtsa_vehicle_safety/complaints.csv
  nhtsa_recalls:
    type: file
    path: data/nhtsa_vehicle_safety/recalls.jsonl

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_dodge_electrical_complaints
    type: code_filter
    code: |
      def transform(doc):
          return (
              doc.get("make") == "DODGE"
              and doc.get("component_id") == "ELECTRICAL"
          )

  - name: filter_dodge_electrical_recalls
    type: code_filter
    code: |
      def transform(doc):
          vehicle = doc.get("vehicle") or {}
          component = doc.get("component") or {}
          return (
              vehicle.get("make") == "DODGE"
              and component.get("component_id") == "ELECTRICAL"
          )

  - name: flatten_dodge_electrical_recall_fields
    type: code_map
    code: |
      def transform(doc):
          campaign = doc.get("campaign") or {}
          vehicle = doc.get("vehicle") or {}
          component = doc.get("component") or {}
          risk = doc.get("risk") or {}
          return {
              "campaign_number": campaign.get("number"),
              "report_received_date": campaign.get(
                  "report_received_date"
              ),
              "make": vehicle.get("make"),
              "component_id": component.get("component_id"),
              "defect_summary": risk.get("defect_summary") or "",
          }

  - name: match_dodge_electrical_complaints_to_recalls
    type: equijoin
    comparison_prompt: |
      Determine whether this Dodge electrical complaint and Dodge electrical
      recall describe the same concrete electrical failure.

      Match only when the complaint narrative and recall defect identify the same
      causal electrical, wiring, module, software-control, power-supply, or
      warning-system failure. A shared ELECTRICAL category, warning symptom,
      stalling consequence, or broad power-loss language alone is not sufficient.

      COMPLAINT:
      {{ left.summary_text }}

      RECALL DEFECT:
      {{ right.defect_summary }}
    blocking_conditions:
      - left["component_id"] == right["component_id"]
    comparison_model: Qwen3.5-397B-A17B
    timeout: 120
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: classify_electrical_failure_safety_consequence
    type: filter
    optimize: true
    prompt: |
      Determine whether this matched evidence describes an electrical failure
      with a safety consequence such as stalling, fire risk, loss of lighting,
      loss of motive power, warning-system failure, or another concrete
      impairment of safe vehicle operation.

      Use the complaint and recall defect. Do not qualify a convenience,
      infotainment, cosmetic, maintenance, or warning-only concern without a
      stated or clearly described safety consequence.

      Complaint:
      {{ input.summary_text }}

      Recall defect:
      {{ input.defect_summary }}
    output:
      mode: structured_output
      schema:
        has_electrical_safety_consequence: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: extract_shared_electrical_root_cause
    type: map
    optimize: true
    prompt: |
      Extract the electrical root-cause phrase shared by this matched complaint
      and recall in no more than 8 words.

      Return only the common causal mechanism or failed electrical element. Do
      not return the vehicle identity, campaign number, downstream consequence,
      remedy, or an explanatory sentence. Retain only details supported by both
      texts.

      Complaint:
      {{ input.summary_text }}

      Recall defect:
      {{ input.defect_summary }}
    output:
      mode: structured_output
      schema:
        electrical_root_cause: string
    validate:
      - len(output["electrical_root_cause"].strip()) > 0
      - len(output["electrical_root_cause"].strip().split()) <= 8
    num_retries_on_validate_failure: 2
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: aggregate_dodge_electrical_campaigns
    type: code_reduce
    reduce_key: campaign_number
    code: |
      def transform(items):
          from datetime import date
          from statistics import median

          complaint_ids = {
              item.get("complaint_id")
              for item in items
              if item.get("complaint_id")
          }
          days_distribution = []
          before_recall_indicators = []
          for item in items:
              try:
                  complaint_date = date.fromisoformat(
                      str(item.get("received_date") or "")
                  )
                  recall_date = date.fromisoformat(
                      str(item.get("report_received_date") or "")
                  )
              except ValueError:
                  continue
              days_distribution.append(
                  (recall_date - complaint_date).days
              )
              before_recall_indicators.append(
                  complaint_date < recall_date
              )

          median_days = (
              int(round(median(days_distribution)))
              if days_distribution
              else None
          )
          share_before_recall = (
              sum(before_recall_indicators)
              / len(before_recall_indicators)
              if before_recall_indicators
              else 0.0
          )
          return {
              "matched_complaint_count": len(complaint_ids),
              "median_days_complaint_to_recall": median_days,
              "share_complaints_before_recall": share_before_recall,
              "days_distribution": days_distribution,
              "root_causes": [
                  item.get("electrical_root_cause")
                  for item in items
                  if item.get("electrical_root_cause")
              ],
              "complaint_summaries": [
                  item.get("summary_text")
                  for item in items
                  if item.get("summary_text")
              ],
          }

  - name: classify_dodge_response_promptness
    type: map
    optimize: true
    prompt: |
      Analyze this campaign's complaint-to-recall day distribution, extracted
      root causes, and complaint descriptions, then return both requested fields.

      response_promptness_label: exactly one of fast, typical, slow. Use fast when
      the distribution and complaint history indicate a comparatively prompt
      recall response, slow when they indicate prolonged pre-recall evidence or
      long delays, and typical for the intermediate pattern. Account for negative
      values as complaints received after the recall report.

      dominant_electrical_root_cause: choose the root-cause phrase best supported
      across the supplied extracted phrases and complaint descriptions. Return a
      concise phrase in no more than 8 words and do not invent a new mechanism.

      Complaint-to-recall days:
      {{ input.days_distribution }}

      Extracted root causes:
      {{ input.root_causes }}

      Matched complaint descriptions:
      {{ input.complaint_summaries }}
    output:
      mode: structured_output
      schema:
        response_promptness_label: string
        dominant_electrical_root_cause: string
    validate:
      - output["response_promptness_label"] in ["fast", "typical", "slow"]
      - len(output["dominant_electrical_root_cause"].strip()) > 0
      - len(output["dominant_electrical_root_cause"].strip().split()) <= 8
    num_retries_on_validate_failure: 2
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: project_dodge_electrical_campaign_summary
    type: code_map
    code: |
      def transform(doc):
          return {
              "campaign_number": doc.get("campaign_number"),
              "matched_complaint_count": doc.get(
                  "matched_complaint_count"
              ),
              "median_days_complaint_to_recall": doc.get(
                  "median_days_complaint_to_recall"
              ),
              "share_complaints_before_recall": doc.get(
                  "share_complaints_before_recall"
              ),
              "dominant_electrical_root_cause": doc.get(
                  "dominant_electrical_root_cause"
              ),
              "response_promptness_label": doc.get(
                  "response_promptness_label"
              ),
          }

pipeline:
  steps:
    - name: dodge_electrical_complaints
      input: nhtsa_complaints
      operations:
        - filter_dodge_electrical_complaints
    - name: dodge_electrical_recalls
      input: nhtsa_recalls
      operations:
        - filter_dodge_electrical_recalls
        - flatten_dodge_electrical_recall_fields
    - name: matched_dodge_electrical_pairs
      operations:
        - match_dodge_electrical_complaints_to_recalls:
            left: dodge_electrical_complaints
            right: dodge_electrical_recalls
    - name: dodge_electrical_campaign_summaries
      input: matched_dodge_electrical_pairs
      operations:
        - classify_electrical_failure_safety_consequence
        - extract_shared_electrical_root_cause
        - aggregate_dodge_electrical_campaigns
        - classify_dodge_response_promptness
        - project_dodge_electrical_campaign_summary
  output:
    type: file
    path: raw_outputs/vehicle_safety/output_vehicle_safety-047.json
