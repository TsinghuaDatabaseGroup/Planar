datasets:
  nhtsa_recalls:
    type: file
    path: data/nhtsa_vehicle_safety/recalls.jsonl

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_tesla_recalls_without_consumer_warnings
    type: code_filter
    code: |
      def transform(doc):
          vehicle = doc.get("vehicle") or {}
          risk = doc.get("risk") or {}
          return (
              vehicle.get("make") == "TESLA"
              and str(risk.get("park_outside", "")).upper() == "FALSE"
              and str(risk.get("do_not_drive", "")).upper() == "FALSE"
          )

  - name: classify_ota_steering_or_motion_control_recalls
    type: filter
    optimize: true
    prompt: |
      Determine whether both conditions hold for this NHTSA recall:

      1. The corrective action describes delivering the remedy through an
         over-the-air software or firmware update, rather than requiring only an
         in-person inspection, part replacement, or dealer-installed repair.
      2. The defect summary describes a steering issue or a vehicle motion-control
         issue, including unintended or impaired control of direction, acceleration,
         deceleration, or vehicle movement.

      Both conditions must be directly supported by the supplied texts.

      Corrective action:
      {{ input.remedy.corrective_action }}

      Defect summary:
      {{ input.risk.defect_summary }}
    output:
      mode: structured_output
      schema:
        matches_semantic_condition: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: project_recall_vehicle_and_defect
    type: code_map
    code: |
      def transform(doc):
          campaign = doc.get("campaign") or {}
          vehicle = doc.get("vehicle") or {}
          risk = doc.get("risk") or {}
          return {
              "campaign_number": campaign.get("number"),
              "model": vehicle.get("model"),
              "model_year": vehicle.get("model_year"),
              "defect_summary": risk.get("defect_summary"),
          }

pipeline:
  steps:
    - name: matching_tesla_recalls
      input: nhtsa_recalls
      operations:
        - filter_tesla_recalls_without_consumer_warnings
        - classify_ota_steering_or_motion_control_recalls
        - project_recall_vehicle_and_defect
  output:
    type: file
    path: raw_outputs/vehicle_safety/output_vehicle_safety-005.json
