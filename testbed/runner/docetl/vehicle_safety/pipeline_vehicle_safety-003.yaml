datasets:
  nhtsa_complaints:
    type: file
    path: data/nhtsa_vehicle_safety/complaints.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_injury_airbag_complaints_without_fire
    type: code_filter
    code: |
      def transform(doc):
          try:
              injury_count = int(doc.get("injury_count", 0))
          except (TypeError, ValueError):
              injury_count = 0
          return (
              doc.get("make") == "DODGE"
              and doc.get("component_id") == "AIRBAG"
              and injury_count >= 1
              and str(doc.get("fire_flag", "")).lower() == "false"
          )

  - name: extract_primary_airbag_failure_mode
    type: map
    optimize: true
    prompt: |
      Extract the single primary airbag failure mode described in this NHTSA
      complaint. Return a short canonical noun phrase rather than a sentence.

      Canonical phrases may include non-deployment, unintended deployment, inflator
      rupture, occupant burn or laceration, warning-light fault, or another concise
      failure-mode phrase supported by the text. If several effects are mentioned,
      select the mode most directly presented as the primary airbag failure. Do not
      infer a failure that the complaint does not describe.

      Complaint:
      {{ input.summary_text }}
    output:
      mode: structured_output
      schema:
        airbag_failure_mode: string
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: project_airbag_failure_columns
    type: code_map
    code: |
      def transform(doc):
          return {
              "complaint_id": doc.get("complaint_id"),
              "model_year": doc.get("model_year"),
              "airbag_failure_mode": str(
                  doc.get("airbag_failure_mode", "")
              ).strip(),
          }

pipeline:
  steps:
    - name: airbag_failure_modes
      input: nhtsa_complaints
      operations:
        - filter_injury_airbag_complaints_without_fire
        - extract_primary_airbag_failure_mode
        - project_airbag_failure_columns
  output:
    type: file
    path: raw_outputs/vehicle_safety/output_vehicle_safety-003.json
