datasets:
  nhtsa_complaints:
    type: file
    path: data/nhtsa_vehicle_safety/complaints.csv
  nhtsa_recalls:
    type: file
    path: data/nhtsa_vehicle_safety/recalls.jsonl
  nhtsa_investigation_reports:
    type: file
    path: data/nhtsa_vehicle_safety/investigation_reports/*.txt

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: extract_cited_recall_cores
    type: map
    optimize: true
    prompt: |
      Extract every NHTSA vehicle recall campaign number cited in this
      investigation report.

      Normalize each citation to its canonical core in the form YYVNNN: two-digit
      campaign year, the letter V, and the three-digit campaign sequence. For
      example, a full campaign number ending in manufacturer-extension digits
      must be reduced to its YYVNNN core. Include only actual recall-number
      citations, preserve no extra text, and deduplicate the returned list. Return
      an empty list when the report cites no recall number.

      Investigation report:
      {{ input.body }}
    output:
      mode: structured_output
      schema:
        cited_recall_cores: "list[string]"
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: normalize_extracted_recall_cores
    type: code_map
    code: |
      def transform(doc):
          import re

          cores = set()
          for value in doc.get("cited_recall_cores") or []:
              compact = re.sub(r"[^0-9A-Za-z]", "", str(value)).upper()
              match = re.search(r"(\d{2})V(\d{3})", compact)
              if match:
                  cores.add(
                      f"{match.group(1)}V{match.group(2)}"
                  )
          return {"cited_recall_cores": sorted(cores)}

  - name: collect_investigation_cited_cores
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          cores = {
              str(core)
              for item in items
              for core in (item.get("cited_recall_cores") or [])
              if str(core)
          }
          return {"investigation_cited_cores": sorted(cores)}

  - name: filter_ford_recalls
    type: code_filter
    code: |
      def transform(doc):
          vehicle = doc.get("vehicle") or {}
          return vehicle.get("make") == "FORD"

  - name: flatten_ford_recall_fields
    type: code_map
    code: |
      def transform(doc):
          campaign = doc.get("campaign") or {}
          vehicle = doc.get("vehicle") or {}
          component = doc.get("component") or {}
          risk = doc.get("risk") or {}
          return {
              "campaign_number": campaign.get("number"),
              "make": vehicle.get("make"),
              "component_id": component.get("component_id"),
              "defect_summary": risk.get("defect_summary") or "",
          }

  - name: deduplicate_ford_recall_campaigns
    type: code_reduce
    reduce_key: campaign_number
    code: |
      def transform(items):
          first = items[0]
          return {
              "make": first.get("make"),
              "component_id": first.get("component_id"),
              "defect_summary": first.get("defect_summary") or "",
          }

  - name: filter_ford_complaints
    type: code_filter
    code: |
      def transform(doc):
          return doc.get("make") == "FORD"

  - name: match_ford_recalls_to_complaints
    type: equijoin
    comparison_prompt: |
      Determine whether this Ford complaint describes the same underlying defect
      as this Ford recall.

      The records have already been restricted to the same component category.
      Match only when the narrative and defect summary identify the same concrete
      failure mechanism or directly equivalent defect. A shared component,
      symptom, consequence, or general safety concern alone is not sufficient.

      RECALL DEFECT:
      {{ left.defect_summary }}

      COMPLAINT:
      {{ right.summary_text }}
    blocking_conditions:
      - left["component_id"] == right["component_id"]
    comparison_model: Qwen3.5-397B-A17B
    timeout: 120
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: aggregate_ford_campaign_corroboration
    type: code_reduce
    reduce_key: campaign_number
    code: |
      def transform(items):
          complaint_ids = {
              item.get("complaint_id")
              for item in items
              if item.get("complaint_id")
          }
          component_id = next(
              (
                  item.get("component_id_left")
                  for item in items
                  if item.get("component_id_left")
              ),
              None,
          )
          return {
              "component_id": component_id,
              "corroborating_complaint_count": len(complaint_ids),
          }

  - name: cross_join_campaigns_with_investigation_cores
    type: equijoin
    deterministic: true
    blocking_conditions:
      - "True"

  - name: mark_campaign_investigation_citation
    type: code_map
    code: |
      def transform(doc):
          import re

          campaign_number = str(doc.get("campaign_number") or "").upper()
          match = re.search(r"(\d{2})V(\d{3})", campaign_number)
          campaign_core = (
              f"{match.group(1)}V{match.group(2)}"
              if match
              else ""
          )
          cited_cores = set(doc.get("investigation_cited_cores") or [])
          return {
              "campaign_number": doc.get("campaign_number"),
              "component_id": doc.get("component_id"),
              "corroborating_complaint_count": doc.get(
                  "corroborating_complaint_count"
              ),
              "cited_by_investigation": (
                  "true" if campaign_core in cited_cores else "false"
              ),
          }

  - name: order_limit_and_rank_ford_corroboration
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          ordered = sorted(
              items,
              key=lambda item: (
                  -int(
                      item.get("corroborating_complaint_count")
                      or 0
                  ),
                  str(item.get("campaign_number") or ""),
              ),
          )
          rows = [
              {
                  "rank": index,
                  "campaign_number": item.get("campaign_number"),
                  "component_id": item.get("component_id"),
                  "corroborating_complaint_count": item.get(
                      "corroborating_complaint_count"
                  ),
                  "cited_by_investigation": item.get(
                      "cited_by_investigation"
                  ),
              }
              for index, item in enumerate(ordered[:5], start=1)
          ]
          return {"rows": rows}

  - name: unnest_ranked_ford_corroboration
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - rank
      - campaign_number
      - component_id
      - corroborating_complaint_count
      - cited_by_investigation

pipeline:
  steps:
    - name: investigation_citation_set
      input: nhtsa_investigation_reports
      operations:
        - extract_cited_recall_cores
        - normalize_extracted_recall_cores
        - collect_investigation_cited_cores
    - name: ford_recall_campaigns
      input: nhtsa_recalls
      operations:
        - filter_ford_recalls
        - flatten_ford_recall_fields
        - deduplicate_ford_recall_campaigns
    - name: ford_complaints
      input: nhtsa_complaints
      operations:
        - filter_ford_complaints
    - name: matched_ford_recall_complaints
      operations:
        - match_ford_recalls_to_complaints:
            left: ford_recall_campaigns
            right: ford_complaints
    - name: ford_campaign_corroboration
      input: matched_ford_recall_complaints
      operations:
        - aggregate_ford_campaign_corroboration
    - name: ford_campaigns_with_citation_status
      operations:
        - cross_join_campaigns_with_investigation_cores:
            left: ford_campaign_corroboration
            right: investigation_citation_set
    - name: ranked_ford_campaign_corroboration
      input: ford_campaigns_with_citation_status
      operations:
        - mark_campaign_investigation_citation
        - order_limit_and_rank_ford_corroboration
        - unnest_ranked_ford_corroboration
  output:
    type: file
    path: raw_outputs/vehicle_safety/output_vehicle_safety-039.json
