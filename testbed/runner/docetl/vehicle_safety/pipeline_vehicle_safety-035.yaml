datasets:
  nhtsa_complaints:
    type: file
    path: data/nhtsa_vehicle_safety/complaints.csv
  nhtsa_recalls:
    type: file
    path: data/nhtsa_vehicle_safety/recalls.jsonl
  nhtsa_investigation_reports:
    type: file
    path: data/nhtsa_vehicle_safety/investigation_reports/*.txt

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
default_embedding_api_base: ${EMBEDDING_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_dodge_airbag_complaints
    type: code_filter
    code: |
      def transform(doc):
          return (
              doc.get("make") == "DODGE"
              and doc.get("component_id") == "AIRBAG"
          )

  - name: filter_dodge_airbag_recalls
    type: code_filter
    code: |
      def transform(doc):
          vehicle = doc.get("vehicle") or {}
          component = doc.get("component") or {}
          return (
              vehicle.get("make") == "DODGE"
              and component.get("component_id") == "AIRBAG"
          )

  - name: flatten_dodge_airbag_recall_fields
    type: code_map
    code: |
      def transform(doc):
          campaign = doc.get("campaign") or {}
          vehicle = doc.get("vehicle") or {}
          component = doc.get("component") or {}
          risk = doc.get("risk") or {}
          return {
              "campaign_number": campaign.get("number"),
              "make": vehicle.get("make"),
              "component_id": component.get("component_id"),
              "defect_summary": risk.get("defect_summary") or "",
              "consequence_summary": risk.get("consequence_summary") or "",
          }

  - name: match_dodge_airbag_complaints_to_recalls
    type: equijoin
    comparison_prompt: |
      Determine whether this Dodge airbag complaint and Dodge airbag recall
      describe the same airbag failure mechanism or deployment hazard.

      Match when both records concern the same concrete mechanism, such as the same
      non-deployment cause, unintended-deployment mechanism, inflator failure, or
      restraint-control defect. A shared AIRBAG category, generic injury or crash
      consequence, or broad deployment vocabulary alone is not sufficient.

      COMPLAINT:
      {{ left.summary_text }}

      RECALL DEFECT:
      {{ right.defect_summary }}
    blocking_conditions:
      - left["component_id"] == right["component_id"]
    comparison_model: Qwen3.5-397B-A17B
    timeout: 120
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: classify_airbag_safety_consequence
    type: filter
    optimize: true
    prompt: |
      Determine whether this matched complaint-recall pair describes an airbag
      safety consequence such as non-deployment, unintended deployment, inflator
      rupture, injury, or crash exposure.

      Use all three texts. Qualify when the pair establishes at least one concrete
      airbag deployment hazard or its occupant/crash consequence. Do not qualify a
      warning light, maintenance issue, or generic airbag concern without such a
      safety consequence.

      Complaint:
      {{ input.summary_text }}

      Recall defect:
      {{ input.defect_summary }}

      Recall consequence:
      {{ input.consequence_summary }}
    output:
      mode: structured_output
      schema:
        describes_airbag_safety_consequence: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: extract_shared_airbag_root_cause
    type: map
    optimize: true
    prompt: |
      Extract a short root-cause phrase shared by this complaint and recall.

      Return only the common causal failure mechanism, preferably in no more than
      10 words. Do not return a consequence, vehicle identity, campaign number,
      repair, or explanatory sentence. If one text is more specific, retain only
      the mechanism supported by both.

      Complaint:
      {{ input.summary_text }}

      Recall defect:
      {{ input.defect_summary }}
    output:
      mode: structured_output
      schema:
        root_cause_phrase: string
    validate:
      - len(output["root_cause_phrase"].strip()) > 0
      - len(output["root_cause_phrase"].strip().split()) <= 10
    num_retries_on_validate_failure: 2
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: filter_candidate_investigation_reports
    type: code_filter
    code: |
      def transform(doc):
          body = str(doc.get("body") or "").lower()
          return (
              "dodge" in body
              or "airbag" in body
              or "inflator" in body
          )

  - name: match_airbag_defects_to_investigation_reports
    type: equijoin
    optimize: true
    comparison_prompt: |
      Determine whether this NHTSA investigation report discusses the same airbag
      mechanism as the matched Dodge complaint-recall defect and includes an ODI
      safety assessment of that mechanism.

      Match only when the report concerns the same concrete root cause or directly
      equivalent airbag failure, not merely Dodge vehicles, airbags generally, or
      a different deployment problem. The report must also analyze or conclude
      something about the associated safety risk, field experience, defect, recall,
      or investigation outcome.

      SHARED ROOT CAUSE:
      {{ left.root_cause_phrase }}

      COMPLAINT:
      {{ left.summary_text }}

      RECALL DEFECT:
      {{ left.defect_summary }}

      INVESTIGATION REPORT:
      {{ right.body }}
    blocking_keys:
      left:
        - root_cause_phrase
        - summary_text
        - defect_summary
      right:
        - body
    blocking_target_recall: 0.95
    embedding_model: Qwen3-Embedding-8B
    comparison_model: Qwen3.5-397B-A17B
    timeout: 120
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: aggregate_campaign_investigation_evidence
    type: code_reduce
    reduce_key: campaign_number
    code: |
      def transform(items):
          from collections import Counter

          complaint_ids = {
              item.get("complaint_id")
              for item in items
              if item.get("complaint_id")
          }
          reports_by_id = {}
          for item in items:
              file_id = item.get("file_id")
              body = item.get("body")
              if file_id and body and file_id not in reports_by_id:
                  reports_by_id[file_id] = body

          phrase_counts = Counter(
              str(item.get("root_cause_phrase") or "").strip()
              for item in items
              if str(item.get("root_cause_phrase") or "").strip()
          )
          root_cause_phrase = (
              sorted(
                  phrase_counts,
                  key=lambda phrase: (-phrase_counts[phrase], phrase),
              )[0]
              if phrase_counts
              else ""
          )
          related_report_ids = sorted(reports_by_id)
          return {
              "matched_complaint_count": len(complaint_ids),
              "related_report_ids": related_report_ids,
              "root_cause_phrase": root_cause_phrase,
              "report_bodies": [
                  reports_by_id[file_id]
                  for file_id in related_report_ids
              ],
          }

  - name: summarize_odi_safety_conclusion
    type: map
    optimize: true
    prompt: |
      Summarize the ODI safety conclusion for this recall campaign from the
      related investigation report bodies in one short phrase.

      State ODI's conclusion or assessment of the defect's safety significance,
      investigation outcome, or recall relationship. Do not list report IDs,
      repeat the campaign number, or add conclusions not supported by the reports.

      Related investigation reports:
      {{ input.report_bodies }}
    output:
      mode: structured_output
      schema:
        odi_safety_conclusion: string
    validate:
      - len(output["odi_safety_conclusion"].strip()) > 0
    num_retries_on_validate_failure: 2
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: project_campaign_airbag_investigation_summary
    type: code_map
    code: |
      def transform(doc):
          return {
              "campaign_number": doc.get("campaign_number"),
              "matched_complaint_count": doc.get(
                  "matched_complaint_count"
              ),
              "related_report_ids": doc.get("related_report_ids") or [],
              "root_cause_phrase": doc.get("root_cause_phrase"),
              "odi_safety_conclusion": doc.get("odi_safety_conclusion"),
          }

pipeline:
  steps:
    - name: dodge_airbag_complaints
      input: nhtsa_complaints
      operations:
        - filter_dodge_airbag_complaints
    - name: dodge_airbag_recalls
      input: nhtsa_recalls
      operations:
        - filter_dodge_airbag_recalls
        - flatten_dodge_airbag_recall_fields
    - name: matched_dodge_airbag_pairs
      operations:
        - match_dodge_airbag_complaints_to_recalls:
            left: dodge_airbag_complaints
            right: dodge_airbag_recalls
    - name: qualified_dodge_airbag_pairs
      input: matched_dodge_airbag_pairs
      operations:
        - classify_airbag_safety_consequence
        - extract_shared_airbag_root_cause
    - name: candidate_investigation_reports
      input: nhtsa_investigation_reports
      operations:
        - filter_candidate_investigation_reports
    - name: matched_investigation_reports
      operations:
        - match_airbag_defects_to_investigation_reports:
            left: qualified_dodge_airbag_pairs
            right: candidate_investigation_reports
    - name: campaign_odi_summaries
      input: matched_investigation_reports
      operations:
        - aggregate_campaign_investigation_evidence
        - summarize_odi_safety_conclusion
        - project_campaign_airbag_investigation_summary
  output:
    type: file
    path: raw_outputs/vehicle_safety/output_vehicle_safety-035.json
