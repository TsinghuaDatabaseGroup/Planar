datasets:
  nhtsa_complaints:
    type: file
    path: data/nhtsa_vehicle_safety/complaints.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_toyota_airbag_complaints
    type: code_filter
    code: |
      def transform(doc):
          return (
              doc.get("make") == "TOYOTA"
              and doc.get("component_id") == "AIRBAG"
          )

  - name: classify_unintended_airbag_deployment_without_impact
    type: filter
    optimize: true
    prompt: |
      Determine whether this complaint describes an unintended airbag deployment:
      an airbag deployed without a corresponding collision or impact.

      Qualify spontaneous, inadvertent, or unexpected deployment while parked,
      stationary, or driving without an impact. Do not qualify a failure to deploy,
      a warning light, a deployment during or after a collision or impact, or a
      generic concern about possible deployment.

      Complaint summary:
      {{ input.summary_text }}
    output:
      mode: structured_output
      schema:
        describes_unintended_deployment_without_impact: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: classify_deployment_caused_injury_or_burn
    type: filter
    optimize: true
    prompt: |
      Determine whether this complaint reports that the unintended airbag
      deployment caused an occupant injury or burn.

      The narrative must attribute a physical injury, burn, abrasion, cut, bruise,
      or another bodily harm to the airbag deployment. Do not qualify a possible
      injury risk, property damage alone, an injury caused by another event, or an
      injury mentioned without a causal link to the deployment.

      Complaint summary:
      {{ input.summary_text }}
    output:
      mode: structured_output
      schema:
        deployment_caused_injury_or_burn: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: classify_unintended_deployment_root_cause
    type: map
    optimize: true
    prompt: |
      Classify the likely primary root cause of this unintended airbag deployment
      using exactly one label:

      - sensor_misfire: an impact, occupancy, side, position, or related sensor
        falsely triggers deployment or sends an erroneous signal;
      - software_logic_error: airbag-control software, calibration, algorithm, or
        control-module logic incorrectly commands deployment;
      - inflator_defect: a physical inflator failure, rupture, explosion,
        overpressure, or other inflator defect is the primary cause;
      - other: the narrative supports none of the preceding causes, identifies a
        different cause, or does not provide enough evidence to assign one.

      Use the cause supported by the complaint narrative. Do not infer a specific
      sensor, software, or inflator cause merely because an airbag deployed.

      Complaint summary:
      {{ input.summary_text }}
    output:
      mode: structured_output
      schema:
        root_cause_label: enum[sensor_misfire, software_logic_error, inflator_defect, other]
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: count_unintended_deployments_by_root_cause
    type: code_reduce
    reduce_key: root_cause_label
    code: |
      def transform(items):
          return {"count": len(items)}

  - name: format_unintended_deployment_distribution
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          labels = [
              "sensor_misfire",
              "software_logic_error",
              "inflator_defect",
              "other",
          ]
          counts = {label: 0 for label in labels}
          for item in items:
              label = item.get("root_cause_label")
              if label in counts:
                  counts[label] = int(item.get("count") or 0)

          total = sum(counts.values())
          dominant_label = sorted(
              labels,
              key=lambda label: (-counts[label], label),
          )[0]
          return {
              "dominant_label": dominant_label,
              "per_label_counts": {
                  label: {"count": counts[label]}
                  for label in labels
              },
              "per_label_percentages": {
                  label: round(
                      100.0 * counts[label] / total,
                      1,
                  ) if total else 0.0
                  for label in labels
              },
          }

pipeline:
  steps:
    - name: toyota_unintended_deployment_root_causes
      input: nhtsa_complaints
      operations:
        - filter_toyota_airbag_complaints
        - classify_unintended_airbag_deployment_without_impact
        - classify_deployment_caused_injury_or_burn
        - classify_unintended_deployment_root_cause
        - count_unintended_deployments_by_root_cause
        - format_unintended_deployment_distribution
  output:
    type: file
    path: raw_outputs/vehicle_safety/output_vehicle_safety-027.json
