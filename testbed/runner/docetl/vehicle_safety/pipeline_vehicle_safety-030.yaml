datasets:
  nhtsa_complaints:
    type: file
    path: data/nhtsa_vehicle_safety/complaints.csv
  nhtsa_recalls:
    type: file
    path: data/nhtsa_vehicle_safety/recalls.jsonl

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_2023_through_2025_complaints
    type: code_filter
    code: |
      def transform(doc):
          return str(doc.get("model_year") or "") in {
              "2023",
              "2024",
              "2025",
          }

  - name: classify_ev_or_hybrid_component_issue
    type: filter
    optimize: true
    prompt: |
      Determine whether this complaint describes an EV or hybrid component issue
      involving a propulsion battery, charging system, battery-management system,
      electric drive, hybrid drivetrain, high-voltage system, or
      powertrain-control software.

      The narrative must describe an actual or alleged issue with one of those
      electrified-vehicle systems. Do not qualify an ordinary low-voltage battery
      issue with no EV or hybrid context, a generic engine complaint, a vehicle
      description that merely says hybrid or electric, or an unrelated software
      or infotainment problem.

      Complaint summary:
      {{ input.summary_text }}
    output:
      mode: structured_output
      schema:
        describes_ev_or_hybrid_component_issue: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: count_ev_hybrid_complaints_by_make
    type: code_reduce
    reduce_key: make
    code: |
      def transform(items):
          complaint_ids = {
              item.get("complaint_id")
              for item in items
              if item.get("complaint_id")
          }
          return {
              "ev_hybrid_complaint_count": len(complaint_ids),
          }

  - name: filter_recent_recalls
    type: code_filter
    code: |
      def transform(doc):
          campaign = doc.get("campaign") or {}
          report_date = str(campaign.get("report_received_date") or "")
          return "2023-01-01" <= report_date <= "2025-12-31"

  - name: flatten_recent_recall_fields
    type: code_map
    code: |
      def transform(doc):
          campaign = doc.get("campaign") or {}
          vehicle = doc.get("vehicle") or {}
          risk = doc.get("risk") or {}
          remedy = doc.get("remedy") or {}
          return {
              "campaign_number": campaign.get("number"),
              "make": vehicle.get("make"),
              "defect_summary": risk.get("defect_summary") or "",
              "corrective_action": remedy.get("corrective_action") or "",
          }

  - name: classify_ev_or_hybrid_related_recall
    type: filter
    optimize: true
    prompt: |
      Determine whether either this recall defect summary or its corrective action
      discusses an EV propulsion battery, charging, a high-voltage system,
      electric drive, hybrid drivetrain, or powertrain-control software.

      Qualify a recall when the defect or remedy directly concerns one of those
      electrified-vehicle systems. Do not qualify a recall merely because the
      affected vehicle is electric or hybrid, or because it mentions unrelated
      low-voltage electrical equipment, generic software, or infotainment.

      Recall defect summary:
      {{ input.defect_summary }}

      Corrective action:
      {{ input.corrective_action }}
    output:
      mode: structured_output
      schema:
        is_ev_or_hybrid_related_recall: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: count_ev_hybrid_recalls_by_make
    type: code_reduce
    reduce_key: make
    code: |
      def transform(items):
          campaign_numbers = {
              item.get("campaign_number")
              for item in items
              if item.get("campaign_number")
          }
          return {
              "related_ev_hybrid_recall_count": len(campaign_numbers),
          }

  - name: join_ev_hybrid_counts_by_make
    type: equijoin
    deterministic: true
    blocking_conditions:
      - left["make"] == right["make"]

  - name: order_limit_and_rank_ev_hybrid_makes
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          ordered = sorted(
              items,
              key=lambda item: (
                  -int(item.get("ev_hybrid_complaint_count") or 0),
                  str(item.get("make_left") or ""),
              ),
          )
          rows = [
              {
                  "rank": index,
                  "make": item.get("make_left"),
                  "ev_hybrid_complaint_count": item.get(
                      "ev_hybrid_complaint_count"
                  ),
                  "related_ev_hybrid_recall_count": item.get(
                      "related_ev_hybrid_recall_count"
                  ),
              }
              for index, item in enumerate(ordered[:5], start=1)
          ]
          return {"rows": rows}

  - name: unnest_ranked_ev_hybrid_makes
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields:
      - rank
      - make
      - ev_hybrid_complaint_count
      - related_ev_hybrid_recall_count

pipeline:
  steps:
    - name: ev_hybrid_complaints_by_make
      input: nhtsa_complaints
      operations:
        - filter_2023_through_2025_complaints
        - classify_ev_or_hybrid_component_issue
        - count_ev_hybrid_complaints_by_make
    - name: ev_hybrid_recalls_by_make
      input: nhtsa_recalls
      operations:
        - filter_recent_recalls
        - flatten_recent_recall_fields
        - classify_ev_or_hybrid_related_recall
        - count_ev_hybrid_recalls_by_make
    - name: joined_ev_hybrid_make_counts
      operations:
        - join_ev_hybrid_counts_by_make:
            left: ev_hybrid_complaints_by_make
            right: ev_hybrid_recalls_by_make
    - name: ranked_ev_hybrid_makes
      input: joined_ev_hybrid_make_counts
      operations:
        - order_limit_and_rank_ev_hybrid_makes
        - unnest_ranked_ev_hybrid_makes
  output:
    type: file
    path: raw_outputs/vehicle_safety/output_vehicle_safety-030.json
