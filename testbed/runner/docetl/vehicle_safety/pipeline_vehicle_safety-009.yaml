datasets:
  nhtsa_complaints:
    type: file
    path: data/nhtsa_vehicle_safety/complaints.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_recent_outback_complaints_without_crash
    type: code_filter
    code: |
      def transform(doc):
          try:
              model_year = int(doc.get("model_year", 0))
          except (TypeError, ValueError):
              model_year = 0
          return (
              doc.get("make") == "SUBARU"
              and doc.get("model") == "OUTBACK"
              and model_year >= 2024
              and str(doc.get("crash_flag", "")).lower() == "false"
          )

  - name: determine_dominant_failure_mode
    type: reduce
    optimize: true
    recursively_optimize: false
    synthesize_resolve: false
    synthesize_merge: true
    reduce_key: _all
    prompt: |
      Determine the dominant failure mode across the complete collection of NHTSA
      complaint summaries below.

      Use these labels:
      - electrical: electrical power, wiring, battery, sensor, or electronic hardware;
      - mechanical: physical hardware, structural, hydraulic, braking, steering, or
        other mechanical-component failure;
      - software: software, firmware, control logic, or programming behavior;
      - mixed: no single mode is clearly dominant, the leading modes are tied, or the
        collection does not provide enough evidence for one dominant mode.

      Consider all summaries and return exactly one label. Do not decide from only a
      subset and do not use information outside the supplied complaints.

      {% for item in inputs %}
      Complaint summary:
      {{ item.summary_text }}
      ---
      {% endfor %}
    output:
      mode: structured_output
      schema:
        dominant_mode: enum[electrical, mechanical, software, mixed]
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

pipeline:
  steps:
    - name: dominant_failure_mode
      input: nhtsa_complaints
      operations:
        - filter_recent_outback_complaints_without_crash
        - determine_dominant_failure_mode
  output:
    type: file
    path: raw_outputs/vehicle_safety/output_vehicle_safety-009.json
