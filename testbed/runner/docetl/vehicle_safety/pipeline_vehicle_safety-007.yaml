datasets:
  nhtsa_complaints:
    type: file
    path: data/nhtsa_vehicle_safety/complaints.csv

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_injury_elantra_complaints_without_fire
    type: code_filter
    code: |
      def transform(doc):
          try:
              injury_count = int(doc.get("injury_count", 0))
          except (TypeError, ValueError):
              injury_count = 0
          return (
              doc.get("make") == "HYUNDAI"
              and doc.get("model") == "ELANTRA"
              and injury_count >= 1
              and str(doc.get("fire_flag", "")).lower() == "false"
          )

  - name: classify_loss_of_control_while_driving
    type: filter
    optimize: true
    prompt: |
      Determine whether this NHTSA complaint describes an actual loss of vehicle
      control while the subject vehicle was being driven.

      A qualifying report states that the driver could not maintain the intended
      direction or motion of the moving vehicle, such as uncontrollable steering,
      swerving, spinning, or another explicit loss of driving control. A crash by
      itself, a component fault without loss of control, a parked-vehicle event, or
      a hypothetical concern does not qualify.

      Complaint:
      {{ input.summary_text }}
    output:
      mode: structured_output
      schema:
        matches_semantic_condition: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: count_loss_of_control_complaints
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          return {"count": len(items)}

pipeline:
  steps:
    - name: qualifying_complaints
      input: nhtsa_complaints
      operations:
        - filter_injury_elantra_complaints_without_fire
        - classify_loss_of_control_while_driving
        - count_loss_of_control_complaints
  output:
    type: file
    path: raw_outputs/vehicle_safety/output_vehicle_safety-007.json
