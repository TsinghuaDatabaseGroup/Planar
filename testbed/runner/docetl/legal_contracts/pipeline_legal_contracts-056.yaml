datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_in_scope_agreements
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a mutual NDA, unilateral NDA, or
      confidentiality-and-standstill agreement.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_in_scope_agreement: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: assign_agreement_type
    type: map
    optimize: true
    prompt: |
      Assign this document to exactly one agreement_type based on its
      protection direction and whether it includes a transaction standstill:
      mutual_nda, unilateral_nda, confidentiality_standstill, or not_in_scope.

      Document:
      {{ input.contents }}
    output:
      mode: structured_output
      schema: {agreement_type: "enum[mutual_nda, unilateral_nda, confidentiality_standstill, not_in_scope]"}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: project_word_count
    type: code_map
    code: |
      def transform(doc):
          return {
              "agreement_type": doc.get("agreement_type"),
              "document_word_count": len(str(doc.get("contents") or "").split()),
          }
  - name: aggregate_agreement_lengths
    type: code_reduce
    reduce_key: agreement_type
    code: |
      def transform(items):
          counts = [int(item.get("document_word_count") or 0) for item in items]
          return {
              "document_count": len(items),
              "avg_word_count": round(sum(counts) / len(counts), 2) if counts else 0.0,
          }
  - name: order_agreement_lengths
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          rows = sorted(items, key=lambda item: (-int(item.get("document_count") or 0), str(item.get("agreement_type") or "")))
          return {"rows": [{"agreement_type": item.get("agreement_type"), "document_count": item.get("document_count"), "avg_word_count": item.get("avg_word_count")} for item in rows]}
  - name: unnest_agreement_lengths
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields: [agreement_type, document_count, avg_word_count]
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_in_scope_agreements, assign_agreement_type, project_word_count, aggregate_agreement_lengths, order_agreement_lengths, unnest_agreement_lengths]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-056.json
