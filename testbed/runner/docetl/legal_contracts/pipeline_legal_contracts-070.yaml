datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_ip_ownership_agreements
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a mutual NDA, unilateral NDA, or
      confidentiality-and-standstill agreement containing an intellectual-
      property ownership clause.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_in_scope_ip_ownership_agreement: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_residual_law_and_remedies
    type: map
    optimize: true
    prompt: |
      Return whether a residual-information right is granted, the expressly
      stated governing-law jurisdiction, whether return or destruction of
      confidential material is required, and whether injunctive or equitable
      relief is provided. Set governing_law_available=false if no governing law
      is stated, using an empty string only as a placeholder.

      Agreement:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        residual_information_present: boolean
        governing_law_available: boolean
        governing_law_value: string
        return_of_materials: boolean
        injunctive_relief: boolean
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: project_residual_metrics
    type: code_map
    code: |
      def transform(doc):
          return {
              "residual_information_present": doc.get("residual_information_present") is True,
              "governing_law": str(doc.get("governing_law_value") or "") if doc.get("governing_law_available") is True else None,
              "return_flag": int(doc.get("return_of_materials") is True),
              "injunctive_flag": int(doc.get("injunctive_relief") is True),
          }
  - name: aggregate_residual_groups
    type: code_reduce
    reduce_key: residual_information_present
    code: |
      def transform(items):
          from collections import Counter
          laws = Counter(str(item["governing_law"]) for item in items if item.get("governing_law") is not None)
          mode = sorted(laws, key=lambda value: (-laws[value], value))[0] if laws else None
          count = len(items)
          return {
              "agreement_count": count,
              "most_common_governing_law": mode,
              "return_of_materials_rate": round(sum(int(item.get("return_flag") or 0) for item in items) / count, 4),
              "injunctive_relief_rate": round(sum(int(item.get("injunctive_flag") or 0) for item in items) / count, 4),
          }
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_ip_ownership_agreements, extract_residual_law_and_remedies, project_residual_metrics, aggregate_residual_groups]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-070.json
