datasets:
  contract_exhibits:
    type: file
    path: contract_exhibit_full.json

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_under_1500_words
    type: code_filter
    code: |
      def transform(doc):
          return len(str(doc.get("contents") or "").split()) < 1500

  - name: filter_standalone_ndas
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a standalone non-disclosure or
      confidentiality agreement.

      Document:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        is_standalone_nda: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: filter_required_nda_terms
    type: filter
    optimize: true
    prompt: |
      Keep this agreement only if all of the following are expressly stated:
      a governing law; a confidentiality obligation that continues indefinitely
      or perpetually; a requirement to return or destroy confidential materials;
      and injunctive, equitable, or specific-performance relief.

      Agreement:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        has_all_required_terms: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: extract_governing_law_and_direction
    type: map
    optimize: true
    prompt: |
      Extract the expressly stated governing-law jurisdiction and classify the
      nondisclosure obligation as exactly "mutual" or "unilateral".

      Agreement:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        governing_law: string
        direction: string
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: project_answer_fields
    type: code_map
    code: |
      def transform(doc):
          return {
              "document_id": str(doc.get("doc_id") or ""),
              "governing_law": str(doc.get("governing_law") or ""),
              "direction": str(doc.get("direction") or ""),
          }

pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations:
        - filter_under_1500_words
        - filter_standalone_ndas
        - filter_required_nda_terms
        - extract_governing_law_and_direction
        - project_answer_fields
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-020.json
