datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_dual_status_agreements
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is both an NDA and an employment or
      restrictive-covenant agreement (NDA|EX-10).

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_nda_ex10_agreement: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_dual_agreement_terms
    type: map
    optimize: true
    prompt: |
      Return the input document ID, NDA direction, finite confidentiality term
      in years, finite non-compete duration in years, and stated governing law.
      For each of the final three fields, set its availability flag to false if
      unstated or not finite, using 0 or an empty string only as a placeholder.

      Input document ID: {{ input.doc_id }}
      Agreement:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        document_id: string
        nda_direction: string
        confidentiality_term_available: boolean
        confidentiality_term_years_value: float
        noncompete_duration_available: boolean
        noncompete_duration_years_value: float
        governing_law_available: boolean
        governing_law_value: string
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: normalize_dual_agreement_terms
    type: code_map
    code: |
      def transform(doc):
          return {
              "confidentiality_term_years": float(doc.get("confidentiality_term_years_value") or 0) if doc.get("confidentiality_term_available") is True else None,
              "noncompete_duration_years": float(doc.get("noncompete_duration_years_value") or 0) if doc.get("noncompete_duration_available") is True else None,
              "governing_law": str(doc.get("governing_law_value") or "") if doc.get("governing_law_available") is True else None,
          }
  - name: filter_complete_dual_terms
    type: code_filter
    code: |
      def transform(doc):
          return doc.get("confidentiality_term_years") is not None and doc.get("noncompete_duration_years") is not None and doc.get("governing_law") is not None
  - name: project_duration_comparison
    type: code_map
    code: |
      def transform(doc):
          confidentiality = float(doc["confidentiality_term_years"])
          noncompete = float(doc["noncompete_duration_years"])
          comparison = "equal" if confidentiality == noncompete else "confidentiality_term_longer" if confidentiality > noncompete else "noncompete_duration_longer"
          return {
              "document_id": doc.get("document_id"),
              "nda_direction": doc.get("nda_direction"),
              "confidentiality_term_years": confidentiality,
              "noncompete_duration_years": noncompete,
              "governing_law": doc.get("governing_law"),
              "duration_comparison": comparison,
          }
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_dual_status_agreements, extract_dual_agreement_terms, normalize_dual_agreement_terms, filter_complete_dual_terms, project_duration_comparison]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-071.json
