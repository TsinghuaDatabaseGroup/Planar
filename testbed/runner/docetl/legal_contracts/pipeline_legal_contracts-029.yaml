datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}

operations:
  - name: filter_operative_non_compete
    type: filter
    optimize: true
    prompt: |
      Keep this agreement only if it contains an operative non-compete
      restriction.

      Agreement:
      {{ input.contents }}
    output: {mode: structured_output, schema: {has_operative_non_compete: boolean}}
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body: {chat_template_kwargs: {enable_thinking: false}}

  - name: filter_no_operative_standstill
    type: filter
    optimize: true
    prompt: |
      Keep this agreement only if it contains no operative standstill
      restriction.

      Agreement:
      {{ input.contents }}
    output: {mode: structured_output, schema: {has_no_operative_standstill: boolean}}
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body: {chat_template_kwargs: {enable_thinking: false}}

  - name: extract_law_and_non_compete_duration
    type: map
    optimize: true
    prompt: |
      Extract the expressly stated governing law and the operative non-compete
      duration normalized to months. Set an availability flag to false when its
      value is unstated or unquantifiable and use an empty string or 0 only as a
      placeholder.

      Agreement:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        governing_law_available: boolean
        governing_law_value: string
        non_compete_duration_available: boolean
        non_compete_months_value: float
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body: {chat_template_kwargs: {enable_thinking: false}}

  - name: normalize_nullable_fields
    type: code_map
    code: |
      def transform(doc):
          return {
              "document_id": str(doc.get("doc_id") or ""),
              "governing_law": str(doc.get("governing_law_value") or "") if doc.get("governing_law_available") is True else None,
              "non_compete_months": float(doc.get("non_compete_months_value") or 0) if doc.get("non_compete_duration_available") is True else None,
          }

  - name: filter_short_non_compete_with_law
    type: code_filter
    code: |
      def transform(doc):
          return doc.get("governing_law") is not None and doc.get("non_compete_months") is not None and float(doc["non_compete_months"]) <= 6

pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations:
        - filter_operative_non_compete
        - filter_no_operative_standstill
        - extract_law_and_non_compete_duration
        - normalize_nullable_fields
        - filter_short_non_compete_with_law
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-029.json
