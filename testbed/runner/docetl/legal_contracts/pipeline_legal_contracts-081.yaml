datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_ex97_recovery_policies
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a genuine EX-97 clawback or
      compensation-recovery policy.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_ex97_recovery_policy: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: filter_beyond_sec_with_misconduct
    type: filter
    optimize: true
    prompt: |
      Keep this policy only if it goes beyond baseline SEC clawback requirements
      and includes misconduct as a recovery trigger.

      Policy:
      {{ input.contents }}
    output: {mode: structured_output, schema: {goes_beyond_sec_with_misconduct: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: filter_beyond_executive_coverage
    type: filter
    optimize: true
    prompt: |
      Keep this policy only if it explicitly extends recovery beyond executive
      officers to non-executive employees, directors, or key managers.

      Policy:
      {{ input.contents }}
    output: {mode: structured_output, schema: {extends_beyond_executive_officers: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_primary_company
    type: map
    optimize: true
    prompt: |
      Return the primary company name stated in this policy.

      Policy:
      {{ input.contents }}
    output: {mode: structured_output, schema: {company: string}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: normalize_company_name
    type: code_map
    code: |
      def transform(doc):
          import re
          suffixes = {"inc", "incorporated", "corporation", "corp", "company", "co", "limited", "ltd", "llc", "plc", "lp", "llp"}
          tokens = re.findall(r"[a-z0-9]+", str(doc.get("company") or "").casefold())
          while tokens and tokens[-1] in suffixes:
              tokens.pop()
          return {"normalized_company": " ".join(tokens)}
  - name: deduplicate_companies
    type: code_reduce
    reduce_key: normalized_company
    code: |
      def transform(items):
          return {"company": min(str(item.get("company") or "") for item in items)}
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_ex97_recovery_policies, filter_beyond_sec_with_misconduct, filter_beyond_executive_coverage, extract_primary_company, normalize_company_name, deduplicate_companies]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-081.json
