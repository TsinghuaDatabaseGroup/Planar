datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_nda_status_documents
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it has NDA status, including a dual-status SEC
      exhibit.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {has_nda_status: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_duration_and_jurisdictions
    type: map
    optimize: true
    prompt: |
      Return the finite confidentiality duration normalized to years and the
      list of expressly stated governing-law jurisdictions. Set
      duration_available=false when the duration is missing or non-finite, using
      0 only as a placeholder.

      Agreement:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        duration_available: boolean
        duration_years_value: float
        governing_law_jurisdictions: "list[string]"
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: normalize_duration
    type: code_map
    code: |
      def transform(doc):
          return {"duration_years": float(doc.get("duration_years_value") or 0) if doc.get("duration_available") is True else None}
  - name: filter_finite_single_jurisdiction
    type: code_filter
    code: |
      def transform(doc):
          return doc.get("duration_years") is not None and len(doc.get("governing_law_jurisdictions") or []) == 1
  - name: extract_restriction_profile
    type: map
    optimize: true
    prompt: |
      Return the exact five-position boolean restriction profile in this order:
      non-compete, customer non-solicitation, employee non-solicitation,
      standstill, vendor non-solicitation.

      Agreement:
      {{ input.contents }}
    output:
      mode: structured_output
      schema: {restriction_profile: "list[boolean]"}
    validate:
      - len(output["restriction_profile"]) == 5
    num_retries_on_validate_failure: 2
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: filter_any_restrictive_covenant
    type: code_filter
    code: |
      def transform(doc):
          return any(bool(value) for value in (doc.get("restriction_profile") or []))
  - name: project_eligible_record
    type: code_map
    code: |
      def transform(doc):
          profile = [bool(value) for value in doc.get("restriction_profile") or []]
          return {
              "jurisdiction": (doc.get("governing_law_jurisdictions") or [None])[0],
              "restriction_profile": profile,
              "restriction_profile_key": "".join("1" if value else "0" for value in profile),
              "duration_years": float(doc.get("duration_years") or 0),
          }

  - name: count_eligible_jurisdictions
    type: code_reduce
    reduce_key: jurisdiction
    code: |
      def transform(items):
          return {"qualifying_nda_count": len(items)}
  - name: select_top_three_jurisdictions
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          ordered = sorted(items, key=lambda item: (-int(item.get("qualifying_nda_count") or 0), str(item.get("jurisdiction") or "")))
          return {"rows": [{"jurisdiction": item.get("jurisdiction"), "qualifying_nda_count": item.get("qualifying_nda_count")} for item in ordered[:3]]}
  - name: unnest_top_jurisdictions
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields: [jurisdiction, qualifying_nda_count]

  - name: aggregate_jurisdiction_profiles
    type: code_reduce
    reduce_key: [jurisdiction, restriction_profile_key]
    code: |
      def transform(items):
          return {
              "restriction_profile": items[0].get("restriction_profile") or [],
              "profile_nda_count": len(items),
              "profile_avg_duration_years": round(sum(float(item["duration_years"]) for item in items) / len(items), 2),
          }

  - name: join_top_jurisdictions_and_profiles
    type: equijoin
    deterministic: true
    blocking_conditions:
      - left["jurisdiction"] == right["jurisdiction"]
  - name: select_most_common_profile_per_jurisdiction
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          ordered = sorted(items, key=lambda item: (-int(item.get("qualifying_nda_count") or 0), str(item.get("jurisdiction_left") or ""), -int(item.get("profile_nda_count") or 0), list(item.get("restriction_profile") or [])))
          rows = []
          seen = set()
          for item in ordered:
              jurisdiction = item.get("jurisdiction_left")
              if jurisdiction in seen:
                  continue
              seen.add(jurisdiction)
              rows.append({
                  "jurisdiction": jurisdiction,
                  "qualifying_nda_count": item.get("qualifying_nda_count"),
                  "most_common_restriction_profile": item.get("restriction_profile") or [],
                  "profile_nda_count": item.get("profile_nda_count"),
                  "profile_avg_duration_years": item.get("profile_avg_duration_years"),
              })
          return {"rows": rows}
  - name: unnest_most_common_profiles
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields: [jurisdiction, qualifying_nda_count, most_common_restriction_profile, profile_nda_count, profile_avg_duration_years]
pipeline:
  steps:
    - name: eligible_records
      input: contract_exhibits
      operations: [filter_nda_status_documents, extract_duration_and_jurisdictions, normalize_duration, filter_finite_single_jurisdiction, extract_restriction_profile, filter_any_restrictive_covenant, project_eligible_record]
    - name: jurisdiction_counts
      input: eligible_records
      operations: [count_eligible_jurisdictions]
    - name: top_jurisdictions
      input: jurisdiction_counts
      operations: [select_top_three_jurisdictions, unnest_top_jurisdictions]
    - name: jurisdiction_profiles
      input: eligible_records
      operations: [aggregate_jurisdiction_profiles]
    - name: top_jurisdiction_profiles
      operations:
        - join_top_jurisdictions_and_profiles: {left: top_jurisdictions, right: jurisdiction_profiles}
    - name: answer
      input: top_jurisdiction_profiles
      operations: [select_most_common_profile_per_jurisdiction, unnest_most_common_profiles]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-106.json
