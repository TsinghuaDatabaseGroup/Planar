datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_dated_nda_agreements
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a mutual NDA, unilateral NDA, or
      confidentiality-and-standstill agreement with an identifiable effective
      date from 1990 through 2029.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_dated_in_scope_agreement: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_decade_profile
    type: map
    optimize: true
    prompt: |
      Return the effective date normalized to YYYY-MM-DD, the governing-law
      jurisdiction, whether the confidentiality term is expressly perpetual or
      indefinite, and whether each of the six standard confidentiality
      exceptions is present. Set governing_law_available=false if no governing
      law is stated, using an empty string only as a placeholder.

      Agreement:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        effective_date: string
        governing_law_available: boolean
        governing_law_value: string
        is_perpetual: boolean
        public_information: boolean
        prior_knowledge: boolean
        independent_development: boolean
        lawful_third_party_receipt: boolean
        legal_compulsion: boolean
        consent: boolean
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: project_decade_metrics
    type: code_map
    code: |
      def transform(doc):
          year = int(str(doc.get("effective_date") or "")[:4])
          exception_fields = ["public_information", "prior_knowledge", "independent_development", "lawful_third_party_receipt", "legal_compulsion", "consent"]
          return {
              "execution_decade": f"{(year // 10) * 10}s",
              "exception_count": sum(doc.get(field) is True for field in exception_fields),
              "governing_law": str(doc.get("governing_law_value") or "") if doc.get("governing_law_available") is True else None,
              "is_perpetual": doc.get("is_perpetual") is True,
          }
  - name: aggregate_decade_metrics
    type: code_reduce
    reduce_key: execution_decade
    code: |
      def transform(items):
          from collections import Counter
          laws = Counter(str(item["governing_law"]) for item in items if item.get("governing_law") is not None)
          mode = sorted(laws, key=lambda value: (-laws[value], value))[0] if laws else None
          return {
              "agreement_count": len(items),
              "avg_exception_count": round(sum(int(item.get("exception_count") or 0) for item in items) / len(items), 2),
              "most_common_governing_law": mode,
              "perpetual_term_rate": round(sum(item.get("is_perpetual") is True for item in items) / len(items), 4),
          }
  - name: order_decade_metrics
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          rows = sorted(items, key=lambda item: str(item.get("execution_decade") or ""))
          fields = ["execution_decade", "agreement_count", "avg_exception_count", "most_common_governing_law", "perpetual_term_rate"]
          return {"rows": [{field: item.get(field) for field in fields} for item in rows]}
  - name: unnest_decade_metrics
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields: [execution_decade, agreement_count, avg_exception_count, most_common_governing_law, perpetual_term_rate]
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_dated_nda_agreements, extract_decade_profile, project_decade_metrics, aggregate_decade_metrics, order_decade_metrics, unnest_decade_metrics]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-065.json
