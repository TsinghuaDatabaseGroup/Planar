datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_nda_and_standstill_agreements
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a mutual NDA, unilateral NDA, or
      confidentiality-and-standstill agreement.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_in_scope_agreement: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_exception_term_return_profile
    type: map
    optimize: true
    prompt: |
      Return whether each of the six standard confidentiality exceptions is
      present, classify the confidentiality term as finite, perpetual, or
      unspecified, return a finite duration normalized to years when stated,
      and indicate whether return or destruction of confidential materials is
      required. Set finite_duration_available=false when no finite duration is
      stated, using 0 only as a placeholder.

      Agreement:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        public_information: boolean
        prior_knowledge: boolean
        independent_development: boolean
        lawful_third_party_receipt: boolean
        legal_compulsion: boolean
        consent: boolean
        term_type: "enum[finite, perpetual, unspecified]"
        finite_duration_available: boolean
        finite_duration_years_value: float
        return_of_materials: boolean
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: project_exception_bracket
    type: code_map
    code: |
      def transform(doc):
          fields = ["public_information", "prior_knowledge", "independent_development", "lawful_third_party_receipt", "legal_compulsion", "consent"]
          count = sum(doc.get(field) is True for field in fields)
          bracket = "0-1" if count <= 1 else "2-3" if count <= 3 else "4-5" if count <= 5 else "6"
          finite_duration = float(doc.get("finite_duration_years_value") or 0) if doc.get("term_type") == "finite" and doc.get("finite_duration_available") is True else None
          return {"exception_bracket": bracket, "finite_duration_years": finite_duration, "return_of_materials": doc.get("return_of_materials") is True}
  - name: aggregate_exception_brackets
    type: code_reduce
    reduce_key: exception_bracket
    code: |
      def transform(items):
          durations = [float(item["finite_duration_years"]) for item in items if item.get("finite_duration_years") is not None]
          return {
              "agreement_count": len(items),
              "avg_finite_duration_years": round(sum(durations) / len(durations), 2) if durations else None,
              "return_of_materials_rate": round(sum(item.get("return_of_materials") is True for item in items) / len(items), 4),
          }
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_nda_and_standstill_agreements, extract_exception_term_return_profile, project_exception_bracket, aggregate_exception_brackets]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-066.json
