datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_qualifying_unilateral_ndas
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a unilateral non-disclosure agreement that
      names at least one disclosing party and one receiving party, expressly
      states a governing law, and has a fixed confidentiality term no longer than
      two years.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_qualifying_unilateral_nda: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_parties_term_and_law
    type: map
    optimize: true
    prompt: |
      Extract all disclosing parties, all receiving parties, the confidentiality
      term normalized to years, and the expressly stated governing law.

      Agreement:
      {{ input.contents }}
    output:
      mode: structured_output
      schema: {disclosing_parties: "list[string]", receiving_parties: "list[string]", term_duration_years: float, governing_law: string}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: project_answer_fields
    type: code_map
    code: |
      def transform(doc):
          return {"document_id": str(doc.get("doc_id") or ""), "disclosing_parties": doc.get("disclosing_parties") or [], "receiving_parties": doc.get("receiving_parties") or [], "term_duration_years": float(doc.get("term_duration_years") or 0), "governing_law": str(doc.get("governing_law") or "")}
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_qualifying_unilateral_ndas, extract_parties_term_and_law, project_answer_fields]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-010.json
