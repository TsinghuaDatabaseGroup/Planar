datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_nda_and_standstill_agreements
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a mutual NDA, unilateral NDA, or
      confidentiality-and-standstill agreement.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_in_scope_agreement: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: filter_perpetual_confidentiality
    type: filter
    optimize: true
    prompt: |
      Keep this agreement only if its confidentiality obligation is expressly
      perpetual or indefinite.

      Agreement:
      {{ input.contents }}
    output: {mode: structured_output, schema: {has_perpetual_confidentiality: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: filter_no_independent_development_exception
    type: filter
    optimize: true
    prompt: |
      Keep this agreement only if it has no operative exception for
      independently developed information.

      Agreement:
      {{ input.contents }}
    output: {mode: structured_output, schema: {has_no_independent_development_exception: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: filter_no_severability_clause
    type: filter
    optimize: true
    prompt: |
      Keep this agreement only if it has no severability clause.

      Agreement:
      {{ input.contents }}
    output: {mode: structured_output, schema: {has_no_severability_clause: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: project_document_id
    type: code_map
    code: |
      def transform(doc):
          return {"document_id": str(doc.get("doc_id") or "")}
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_nda_and_standstill_agreements, filter_perpetual_confidentiality, filter_no_independent_development_exception, filter_no_severability_clause, project_document_id]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-082.json
