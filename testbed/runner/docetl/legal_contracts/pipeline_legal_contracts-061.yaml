datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_in_scope_agreements
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is categorized as a mutual NDA, unilateral
      NDA, or confidentiality-and-standstill agreement.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_in_scope_agreement: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_agreement_type_and_direction
    type: map
    optimize: true
    prompt: |
      Return the agreement category as mutual_nda, unilateral_nda, or
      confidentiality_standstill, and the operative nondisclosure direction as
      mutual or unilateral.

      Agreement:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        agreement_type: "enum[mutual_nda, unilateral_nda, confidentiality_standstill]"
        non_disclosure_direction: "enum[mutual, unilateral]"
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: count_type_direction_combinations
    type: code_reduce
    reduce_key: [agreement_type, non_disclosure_direction]
    code: |
      def transform(items):
          return {"document_count": len(items)}
  - name: order_type_direction_combinations
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          ordered = sorted(items, key=lambda item: (-int(item.get("document_count") or 0), str(item.get("agreement_type") or ""), str(item.get("non_disclosure_direction") or "")))
          return {"rows": [{"agreement_type": item.get("agreement_type"), "non_disclosure_direction": item.get("non_disclosure_direction"), "document_count": item.get("document_count")} for item in ordered]}
  - name: unnest_type_direction_combinations
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields: [agreement_type, non_disclosure_direction, document_count]
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_in_scope_agreements, extract_agreement_type_and_direction, count_type_direction_combinations, order_type_direction_combinations, unnest_type_direction_combinations]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-061.json
