datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_under_1000_words
    type: code_filter
    code: |
      def transform(doc):
          return len(str(doc.get("contents") or "").split()) < 1000
  - name: filter_ndas
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a non-disclosure agreement.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_nda: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: filter_transaction_context_no_standstill_with_law
    type: filter
    optimize: true
    prompt: |
      Keep this agreement only if its primary context is a potential merger,
      acquisition, or investment, it contains no operative standstill, and it
      expressly states a governing law.

      Agreement:
      {{ input.contents }}
    output: {mode: structured_output, schema: {has_required_context_and_terms: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_governing_law
    type: map
    optimize: true
    prompt: |
      Extract the expressly stated governing-law jurisdiction.

      Agreement:
      {{ input.contents }}
    output: {mode: structured_output, schema: {governing_law: string}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: project_answer_fields
    type: code_map
    code: |
      def transform(doc):
          return {"document_id": str(doc.get("doc_id") or ""), "governing_law": str(doc.get("governing_law") or "")}
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_under_1000_words, filter_ndas, filter_transaction_context_no_standstill_with_law, extract_governing_law, project_answer_fields]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-036.json
