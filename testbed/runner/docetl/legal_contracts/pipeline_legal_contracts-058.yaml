datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_nda_and_confidentiality_agreements
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a mutual NDA, unilateral NDA, or
      confidentiality-and-standstill agreement.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_in_scope_agreement: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_confidentiality_profile
    type: map
    optimize: true
    prompt: |
      Extract the nondisclosure direction and whether each of the six standard
      confidentiality exceptions is present in this agreement.

      Agreement:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        non_disclosure_direction: string
        public_information: boolean
        prior_knowledge: boolean
        independent_development: boolean
        lawful_third_party_receipt: boolean
        legally_compelled_disclosure: boolean
        disclosure_with_consent: boolean
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: project_recognized_exceptions
    type: code_map
    code: |
      def transform(doc):
          labels = [
              "public_information",
              "prior_knowledge",
              "independent_development",
              "lawful_third_party_receipt",
              "legally_compelled_disclosure",
              "disclosure_with_consent",
          ]
          recognized = [label for label in labels if doc.get(label) is True]
          return {
              "non_disclosure_direction": doc.get("non_disclosure_direction"),
              "recognized_exceptions": recognized,
              "recognized_exceptions_key": "\u001f".join(recognized),
          }
  - name: count_confidentiality_profiles
    type: code_reduce
    reduce_key: [non_disclosure_direction, recognized_exceptions_key]
    code: |
      def transform(items):
          return {
              "recognized_exceptions": list(items[0].get("recognized_exceptions") or []),
              "agreement_count": len(items),
          }
  - name: select_top_five_profiles
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          ordered = sorted(items, key=lambda item: (-int(item.get("agreement_count") or 0), str(item.get("non_disclosure_direction") or ""), list(item.get("recognized_exceptions") or [])))
          return {"rows": [{"non_disclosure_direction": item.get("non_disclosure_direction"), "recognized_exceptions": item.get("recognized_exceptions") or [], "agreement_count": item.get("agreement_count")} for item in ordered[:5]]}
  - name: unnest_top_profiles
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields: [non_disclosure_direction, recognized_exceptions, agreement_count]
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_nda_and_confidentiality_agreements, extract_confidentiality_profile, project_recognized_exceptions, count_confidentiality_profiles, select_top_five_profiles, unnest_top_profiles]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-058.json
