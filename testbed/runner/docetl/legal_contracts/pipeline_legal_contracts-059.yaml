datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_section_906_certifications
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a genuine SOX Section 906 certification.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_section_906_certification: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_distinct_certifying_officers
    type: map
    optimize: true
    prompt: |
      Return the distinct certifying officers named as signatories in this
      certification.

      Certification:
      {{ input.contents }}
    output:
      mode: structured_output
      schema: {certifying_officers: "list[string]"}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: project_officer_count
    type: code_map
    code: |
      def transform(doc):
          return {"officer_count": len(doc.get("certifying_officers") or [])}
  - name: count_certifications_by_officer_count
    type: code_reduce
    reduce_key: officer_count
    code: |
      def transform(items):
          return {"certification_count": len(items)}
  - name: order_officer_counts
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          rows = sorted(items, key=lambda item: int(item.get("officer_count") or 0))
          return {"rows": [{"officer_count": item.get("officer_count"), "certification_count": item.get("certification_count")} for item in rows]}
  - name: unnest_officer_counts
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields: [officer_count, certification_count]
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_section_906_certifications, extract_distinct_certifying_officers, project_officer_count, count_certifications_by_officer_count, order_officer_counts, unnest_officer_counts]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-059.json
