datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_delaware_or_new_york_ndas
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a non-disclosure agreement expressly
      governed by Delaware or New York law.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_target_state_nda: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: filter_standstill_exceptions_and_terms
    type: filter
    optimize: true
    prompt: |
      Keep this agreement only if it includes an operative standstill, recognizes
      all six standard confidentiality carve-outs, states a confidentiality term,
      and states a quantifiable standstill period.

      Agreement:
      {{ input.contents }}
    output: {mode: structured_output, schema: {has_required_terms: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_state_and_periods
    type: map
    optimize: true
    prompt: |
      Extract the governing state and normalize the confidentiality term to
      years. Encode a finite term as decimal text or an indefinite term as exactly
      "perpetual". Normalize the quantifiable standstill period to years.

      Agreement:
      {{ input.contents }}
    output:
      mode: structured_output
      schema: {governing_state: string, term_duration_years_raw: string, standstill_period_years: float}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: project_answer_fields
    type: code_map
    code: |
      def transform(doc):
          raw = str(doc.get("term_duration_years_raw") or "").strip()
          term = "perpetual" if raw.casefold() == "perpetual" else float(raw)
          return {"document_name": str(doc.get("doc_id") or ""), "governing_state": str(doc.get("governing_state") or ""), "term_duration_years": term, "standstill_period_years": float(doc.get("standstill_period_years") or 0)}
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_delaware_or_new_york_ndas, filter_standstill_exceptions_and_terms, extract_state_and_periods, project_answer_fields]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-045.json
