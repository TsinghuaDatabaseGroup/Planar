datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_non_solicitation_agreements
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is an employment agreement, standalone
      non-compete agreement, or standalone non-solicitation agreement containing
      an operative customer or employee non-solicitation clause.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_in_scope_non_solicitation_agreement: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_non_solicitation_terms
    type: map
    optimize: true
    prompt: |
      Return whether customer and employee non-solicitation restrictions are
      present, each stated duration normalized to years, and the expressly
      stated governing-law jurisdiction. For each duration and governing law,
      set its availability flag to false when unstated, using 0 or an empty
      string only as a placeholder.

      Agreement:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        customers_present: boolean
        customers_duration_available: boolean
        customers_duration_years_value: float
        employees_present: boolean
        employees_duration_available: boolean
        employees_duration_years_value: float
        governing_law_available: boolean
        governing_law_value: string
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: project_restriction_category
    type: code_map
    code: |
      def transform(doc):
          customers_present = doc.get("customers_present") is True
          employees_present = doc.get("employees_present") is True
          customers_duration = float(doc.get("customers_duration_years_value") or 0) if doc.get("customers_duration_available") is True else None
          employees_duration = float(doc.get("employees_duration_years_value") or 0) if doc.get("employees_duration_available") is True else None
          if customers_present and employees_present:
              category = "Both"
              effective_duration = max(customers_duration, employees_duration) if customers_duration is not None and employees_duration is not None else None
          elif customers_present:
              category = "Customers Only"
              effective_duration = customers_duration
          else:
              category = "Employees Only"
              effective_duration = employees_duration
          return {
              "restriction_category": category,
              "effective_duration_years": effective_duration,
              "governing_law": str(doc.get("governing_law_value") or "") if doc.get("governing_law_available") is True else None,
          }
  - name: aggregate_restriction_categories
    type: code_reduce
    reduce_key: restriction_category
    code: |
      def transform(items):
          from collections import Counter
          durations = [float(item["effective_duration_years"]) for item in items if item.get("effective_duration_years") is not None]
          laws = Counter(str(item["governing_law"]) for item in items if item.get("governing_law") is not None)
          mode = sorted(laws, key=lambda value: (-laws[value], value))[0] if laws else None
          return {
              "agreement_count": len(items),
              "avg_effective_duration_years": round(sum(durations) / len(durations), 2) if durations else None,
              "most_common_governing_law": mode,
          }
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_non_solicitation_agreements, extract_non_solicitation_terms, project_restriction_category, aggregate_restriction_categories]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-062.json
