datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_operative_non_compete
    type: filter
    optimize: true
    prompt: |
      Keep this agreement only if it contains an operative non-compete
      restriction rather than an incidental reference.

      Agreement:
      {{ input.contents }}
    output: {mode: structured_output, schema: {has_operative_non_compete: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_duration_scope_and_law
    type: map
    optimize: true
    prompt: |
      Extract the operative non-compete duration normalized to months, its stated
      geographic scope, and the governing law. For each value, set its
      availability flag to false when unstated or unquantifiable, using 0 or an
      empty string only as a placeholder.

      Agreement:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        duration_available: boolean
        non_compete_months_value: float
        geographic_scope_available: boolean
        geographic_scope_value: string
        governing_law_available: boolean
        governing_law_value: string
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: normalize_nullable_fields
    type: code_map
    code: |
      def transform(doc):
          return {
              "document_name": str(doc.get("doc_id") or ""),
              "non_compete_months": float(doc.get("non_compete_months_value") or 0) if doc.get("duration_available") is True else None,
              "geographic_scope": str(doc.get("geographic_scope_value") or "") if doc.get("geographic_scope_available") is True else None,
              "governing_law": str(doc.get("governing_law_value") or "") if doc.get("governing_law_available") is True else None,
          }
  - name: filter_complete_short_restrictions
    type: code_filter
    code: |
      def transform(doc):
          return doc.get("non_compete_months") is not None and float(doc["non_compete_months"]) <= 6 and doc.get("geographic_scope") is not None and doc.get("governing_law") is not None
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_operative_non_compete, extract_duration_scope_and_law, normalize_nullable_fields, filter_complete_short_restrictions]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-008.json
