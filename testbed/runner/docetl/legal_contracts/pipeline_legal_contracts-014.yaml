datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_section_302_certifications
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a genuine SOX Section 302 certification.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_section_302_certification: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_clause_profile
    type: map
    optimize: true
    prompt: |
      Return whether this certification contains each of these clauses:
      internal-controls responsibility, management-fraud disclosure, and
      material changes in internal controls.

      Certification:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        has_internal_controls_clause: boolean
        has_fraud_disclosure_clause: boolean
        has_material_changes_clause: boolean
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: count_clause_profiles
    type: code_reduce
    reduce_key: [has_internal_controls_clause, has_fraud_disclosure_clause, has_material_changes_clause]
    code: |
      def transform(items):
          return {"certification_count": len(items)}
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_section_302_certifications, extract_clause_profile, count_clause_profiles]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-014.json
