datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_complete_exception_profile
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a mutual NDA, unilateral NDA, or
      confidentiality-and-standstill agreement containing all six operative
      standard confidentiality exceptions.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {has_complete_exception_profile: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: filter_additional_protections
    type: filter
    optimize: true
    prompt: |
      Keep this agreement only if it also contains injunctive relief, an
      intellectual-property ownership clause, and a survival clause.

      Agreement:
      {{ input.contents }}
    output: {mode: structured_output, schema: {has_additional_protections: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: project_document_word_count
    type: code_map
    code: |
      def transform(doc):
          return {"document_id": str(doc.get("doc_id") or ""), "word_count": len(str(doc.get("contents") or "").split())}
  - name: select_shortest_fifteen
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          ordered = sorted(items, key=lambda item: (int(item.get("word_count") or 0), str(item.get("document_id") or "")))
          return {"rows": [{"document_id": item.get("document_id"), "word_count": item.get("word_count")} for item in ordered[:15]]}
  - name: unnest_shortest_fifteen
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields: [document_id, word_count]
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_complete_exception_profile, filter_additional_protections, project_document_word_count, select_shortest_fifteen, unnest_shortest_fifteen]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-064.json
