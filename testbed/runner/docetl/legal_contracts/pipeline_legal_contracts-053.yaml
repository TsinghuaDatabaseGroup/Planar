datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_insider_trading_policies
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is an insider-trading policy.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_insider_trading_policy: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_approval_or_adoption_date
    type: map
    optimize: true
    prompt: |
      Extract the policy approval or adoption date explicitly stated in this
      document and normalize it to YYYY-MM-DD. Do not substitute a general
      effective date. Set approval_date_available=false when no approval or
      adoption date is stated and use an empty string only as a placeholder.

      Policy:
      {{ input.contents }}
    output:
      mode: structured_output
      schema: {approval_date_available: boolean, approval_date_value: string}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: normalize_approval_date
    type: code_map
    code: |
      def transform(doc):
          return {"document_id": str(doc.get("doc_id") or ""), "approval_date": str(doc.get("approval_date_value") or "") if doc.get("approval_date_available") is True else None}
  - name: filter_stated_approval_date
    type: code_filter
    code: |
      def transform(doc):
          return doc.get("approval_date") is not None
  - name: select_most_recent_policy
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          rows = [{"document_id": item.get("document_id"), "approval_date": item.get("approval_date")} for item in items]
          rows.sort(key=lambda row: row["document_id"])
          rows.sort(key=lambda row: row["approval_date"], reverse=True)
          return {"rows": rows[:1]}
  - name: unnest_selected_policy
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields: [document_id, approval_date]
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_insider_trading_policies, extract_approval_or_adoption_date, normalize_approval_date, filter_stated_approval_date, select_most_recent_policy, unnest_selected_policy]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-053.json
