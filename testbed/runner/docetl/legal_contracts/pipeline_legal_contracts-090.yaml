datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_nda_documents
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a non-disclosure agreement, including a
      dual-labelled NDA exhibit.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_nda_document: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: filter_standstill_and_employee_non_solicit
    type: filter
    optimize: true
    prompt: |
      Keep this agreement only if it expressly contains both a standstill
      provision and an employee non-solicitation clause.

      Agreement:
      {{ input.contents }}
    output: {mode: structured_output, schema: {has_both_restrictions: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_durations_and_exceptions
    type: map
    optimize: true
    prompt: |
      Return the standstill duration and employee non-solicitation duration,
      both normalized to years, and whether each of the six standard
      confidentiality exceptions is present. For each duration, set its
      availability flag to false when unstated, using 0 only as a placeholder.

      Agreement:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        standstill_duration_available: boolean
        standstill_duration_years_value: float
        employee_duration_available: boolean
        employee_duration_years_value: float
        public_information: boolean
        prior_knowledge: boolean
        independent_development: boolean
        third_party_receipt: boolean
        legal_compulsion: boolean
        written_consent: boolean
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: normalize_restriction_durations
    type: code_map
    code: |
      def transform(doc):
          return {
              "standstill_duration": float(doc.get("standstill_duration_years_value") or 0) if doc.get("standstill_duration_available") is True else None,
              "employee_non_solicitation_duration": float(doc.get("employee_duration_years_value") or 0) if doc.get("employee_duration_available") is True else None,
          }
  - name: filter_stated_durations
    type: code_filter
    code: |
      def transform(doc):
          return doc.get("standstill_duration") is not None and doc.get("employee_non_solicitation_duration") is not None
  - name: project_duration_class
    type: code_map
    code: |
      def transform(doc):
          standstill = float(doc["standstill_duration"])
          employee = float(doc["employee_non_solicitation_duration"])
          label = "employee_restriction_longer" if employee > standstill else "equal" if employee == standstill else "standstill_longer"
          fields = ["public_information", "prior_knowledge", "independent_development", "third_party_receipt", "legal_compulsion", "written_consent"]
          return {"class_label": label, "exception_count": sum(doc.get(field) is True for field in fields)}
  - name: aggregate_duration_classes
    type: code_reduce
    reduce_key: class_label
    code: |
      def transform(items):
          return {"agreement_count": len(items), "average_exception_count": round(sum(int(item.get("exception_count") or 0) for item in items) / len(items), 2)}
  - name: order_duration_classes
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          rows = sorted(items, key=lambda item: (-int(item.get("agreement_count") or 0), str(item.get("class_label") or "")))
          return {"rows": [{"class_label": item.get("class_label"), "agreement_count": item.get("agreement_count"), "average_exception_count": item.get("average_exception_count")} for item in rows]}
  - name: unnest_duration_classes
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields: [class_label, agreement_count, average_exception_count]
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_nda_documents, filter_standstill_and_employee_non_solicit, extract_durations_and_exceptions, normalize_restriction_durations, filter_stated_durations, project_duration_class, aggregate_duration_classes, order_duration_classes, unnest_duration_classes]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-090.json
