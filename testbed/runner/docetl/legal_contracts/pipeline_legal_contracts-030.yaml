datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}

operations:
  - name: filter_confidentiality_standstill_agreements
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a confidentiality-and-standstill
      agreement.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_confidentiality_standstill_agreement: boolean}}
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body: {chat_template_kwargs: {enable_thinking: false}}

  - name: filter_law_and_exactly_five_carve_outs
    type: filter
    optimize: true
    prompt: |
      Keep this agreement only if it expressly states a governing law and contains
      exactly five of these six standard confidentiality carve-outs: publicly
      available information, prior knowledge, independent development, lawful
      unrestricted third-party receipt, legally compelled disclosure, and
      disclosure authorized by the disclosing party.

      Agreement:
      {{ input.contents }}
    output: {mode: structured_output, schema: {has_law_and_five_carve_outs: boolean}}
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body: {chat_template_kwargs: {enable_thinking: false}}

  - name: extract_law_and_missing_exception
    type: map
    optimize: true
    prompt: |
      Extract the expressly stated governing law and the sole missing standard
      confidentiality carve-out.

      Agreement:
      {{ input.contents }}
    output:
      mode: structured_output
      schema: {governing_law: string, missing_exception: string}
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body: {chat_template_kwargs: {enable_thinking: false}}

  - name: project_answer_fields
    type: code_map
    code: |
      def transform(doc):
          return {
              "document_id": str(doc.get("doc_id") or ""),
              "governing_law": str(doc.get("governing_law") or ""),
              "missing_exception": str(doc.get("missing_exception") or ""),
          }

pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations:
        - filter_confidentiality_standstill_agreements
        - filter_law_and_exactly_five_carve_outs
        - extract_law_and_missing_exception
        - project_answer_fields
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-030.json
