datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_nda_and_confidentiality_agreements
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a mutual NDA, unilateral NDA, or
      confidentiality-and-standstill agreement.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_in_scope_agreement: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_document_and_effective_date
    type: map
    optimize: true
    prompt: |
      Return the input document ID and the explicitly stated effective date,
      normalized to YYYY-MM-DD. Set effective_date_available=false if no
      effective date is explicitly stated, using an empty string only as a
      placeholder.

      Input document ID: {{ input.doc_id }}
      Agreement:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        document_id: string
        effective_date_available: boolean
        effective_date_value: string
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: normalize_effective_date
    type: code_map
    code: |
      def transform(doc):
          return {"effective_date": str(doc.get("effective_date_value") or "") if doc.get("effective_date_available") is True else None}
  - name: filter_effective_after_2010
    type: code_filter
    code: |
      def transform(doc):
          return doc.get("effective_date") is not None and str(doc["effective_date"]) > "2010-12-31"
  - name: filter_computer_related_protected_material
    type: filter
    optimize: true
    prompt: |
      Keep this agreement only if its protected-information definition
      explicitly includes electronic, digital, computer, software, or
      comparable computer-related material.

      Agreement:
      {{ input.contents }}
    output: {mode: structured_output, schema: {includes_computer_related_material: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: filter_surviving_confidentiality_obligations
    type: filter
    optimize: true
    prompt: |
      Keep this agreement only if its confidentiality obligations expressly
      continue after agreement termination or after protected material is
      returned or destroyed.

      Agreement:
      {{ input.contents }}
    output: {mode: structured_output, schema: {confidentiality_obligations_survive: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: filter_destroy_instead_of_return
    type: filter
    optimize: true
    prompt: |
      Keep this agreement only if the recipient may choose, or may be directed,
      to destroy protected material instead of returning that same material.

      Agreement:
      {{ input.contents }}
    output: {mode: structured_output, schema: {allows_destroy_instead_of_return: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_law_and_archival_copy
    type: map
    optimize: true
    prompt: |
      Return the governing law and whether the agreement expressly permits
      retention of a single archival or record copy. Automatic-backup exceptions
      and permission to retain an unspecified number of copies do not count as
      permission for a single archival or record copy.

      Agreement:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        governing_law: string
        allows_single_archival_copy: boolean
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: project_answer_fields
    type: code_map
    code: |
      def transform(doc):
          return {
              "document_id": doc.get("document_id"),
              "governing_law": doc.get("governing_law"),
              "allows_single_archival_copy": doc.get("allows_single_archival_copy"),
          }
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_nda_and_confidentiality_agreements, extract_document_and_effective_date, normalize_effective_date, filter_effective_after_2010, filter_computer_related_protected_material, filter_surviving_confidentiality_obligations, filter_destroy_instead_of_return, extract_law_and_archival_copy, project_answer_fields]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-079.json
