datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_ndas
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a non-disclosure agreement.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_nda: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: filter_quantifiable_restriction_periods
    type: filter
    optimize: true
    prompt: |
      Keep this agreement only if it contains operative non-compete and employee
      non-solicitation clauses with quantifiable fixed periods and expressly
      states a governing-law provision.

      Agreement:
      {{ input.contents }}
    output: {mode: structured_output, schema: {has_quantifiable_periods_and_law: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_law_and_restriction_periods
    type: map
    optimize: true
    prompt: |
      Extract the governing-law jurisdiction or rule and normalize the operative
      non-compete and employee non-solicitation fixed periods to months.

      Agreement:
      {{ input.contents }}
    output:
      mode: structured_output
      schema: {governing_law: string, non_compete_months: float, employee_non_solicitation_months: float}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: compute_signed_period_difference
    type: code_map
    code: |
      def transform(doc):
          return {
              "document_name": str(doc.get("doc_id") or ""),
              "governing_law": str(doc.get("governing_law") or ""),
              "difference_months": float(doc.get("non_compete_months") or 0) - float(doc.get("employee_non_solicitation_months") or 0),
          }
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_ndas, filter_quantifiable_restriction_periods, extract_law_and_restriction_periods, compute_signed_period_difference]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-035.json
