datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_nda_or_ex10
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a non-disclosure agreement or an EX-10
      material contract exhibit, including a document with both statuses.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_nda_or_ex10: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_law_term_and_restrictions
    type: map
    optimize: true
    prompt: |
      Extract the exhibit family, using NDA or the applicable EX-xx label and a
      pipe-separated NDA|EX-xx label for dual-status documents. Also extract the
      governing law, finite confidentiality term, and quantifiable operative
      non-compete, customer non-solicitation, and employee non-solicitation
      periods, all normalized to months. For every nullable value, set its
      availability flag to false when unstated, perpetual, or unquantifiable and
      use an empty string or 0 only as a placeholder.

      Document:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        exhibit_family: string
        governing_law_available: boolean
        governing_law_value: string
        term_available: boolean
        term_months_value: float
        non_compete_available: boolean
        non_compete_months_value: float
        customer_non_solicitation_available: boolean
        customer_non_solicitation_months_value: float
        employee_non_solicitation_available: boolean
        employee_non_solicitation_months_value: float
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: project_longest_restriction
    type: code_map
    code: |
      def transform(doc):
          periods = []
          for flag, value in (
              ("non_compete_available", "non_compete_months_value"),
              ("customer_non_solicitation_available", "customer_non_solicitation_months_value"),
              ("employee_non_solicitation_available", "employee_non_solicitation_months_value"),
          ):
              if doc.get(flag) is True:
                  periods.append(float(doc.get(value) or 0))
          return {
              "document_id": str(doc.get("doc_id") or ""),
              "exhibit_family": str(doc.get("exhibit_family") or ""),
              "governing_law": str(doc.get("governing_law_value") or "") if doc.get("governing_law_available") is True else None,
              "term_months": float(doc.get("term_months_value") or 0) if doc.get("term_available") is True else None,
              "longest_restriction_months": max(periods) if periods else None,
          }
  - name: filter_equal_term_and_restriction
    type: code_filter
    code: |
      def transform(doc):
          term = doc.get("term_months")
          restriction = doc.get("longest_restriction_months")
          return doc.get("governing_law") is not None and term is not None and restriction is not None and float(term) == float(restriction)
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_nda_or_ex10, extract_law_term_and_restrictions, project_longest_restriction, filter_equal_term_and_restriction]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-038.json
