datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_nda_documents
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a non-disclosure agreement, including a
      dual-labelled NDA exhibit.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_nda_document: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: filter_definition_return_and_relief
    type: filter
    optimize: true
    prompt: |
      Keep this agreement only if it explicitly defines confidential information
      and contains both a return-or-destroy obligation and injunctive-relief
      language.

      Agreement:
      {{ input.contents }}
    output: {mode: structured_output, schema: {has_required_confidentiality_protections: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_law_direction_and_term
    type: map
    optimize: true
    prompt: |
      Return the normalized governing-law jurisdiction, NDA direction as mutual,
      unilateral, or unclear, and stated finite agreement term normalized to
      years. Set governing_law_available=false when unstated. Set
      finite_term_available=false for perpetual or unspecified terms. Use an
      empty string or 0 only as a placeholder for an unavailable field.

      Agreement:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        governing_law_available: boolean
        governing_law_value: string
        nda_direction: "enum[mutual, unilateral, unclear]"
        finite_term_available: boolean
        finite_term_years_value: float
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: normalize_law_and_finite_term
    type: code_map
    code: |
      def transform(doc):
          return {
              "governing_law": str(doc.get("governing_law_value") or "") if doc.get("governing_law_available") is True else None,
              "finite_term_years": float(doc.get("finite_term_years_value") or 0) if doc.get("finite_term_available") is True else None,
          }
  - name: filter_law_and_direction
    type: code_filter
    code: |
      def transform(doc):
          return doc.get("governing_law") is not None and doc.get("nda_direction") in {"mutual", "unilateral"}
  - name: aggregate_governing_law_counts
    type: code_reduce
    reduce_key: governing_law
    code: |
      def transform(items):
          finite_terms = [float(item["finite_term_years"]) for item in items if item.get("finite_term_years") is not None]
          mutual_count = sum(item.get("nda_direction") == "mutual" for item in items)
          unilateral_count = sum(item.get("nda_direction") == "unilateral" for item in items)
          return {
              "mutual_count": mutual_count,
              "unilateral_count": unilateral_count,
              "average_finite_term_years": round(sum(finite_terms) / len(finite_terms), 2) if finite_terms else None,
              "combined_count": mutual_count + unilateral_count,
          }
  - name: select_top_three_laws
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          ordered = sorted(items, key=lambda item: (-int(item.get("combined_count") or 0), str(item.get("governing_law") or "")))
          return {"rows": [{"governing_law": item.get("governing_law"), "mutual_count": item.get("mutual_count"), "unilateral_count": item.get("unilateral_count"), "average_finite_term_years": item.get("average_finite_term_years")} for item in ordered[:3]]}
  - name: unnest_top_three_laws
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields: [governing_law, mutual_count, unilateral_count, average_finite_term_years]
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_nda_documents, filter_definition_return_and_relief, extract_law_direction_and_term, normalize_law_and_finite_term, filter_law_and_direction, aggregate_governing_law_counts, select_top_three_laws, unnest_top_three_laws]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-094.json
