datasets:
  contract_exhibits:
    type: file
    path: contract_exhibit_full.json

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_section_302_june_2025
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a genuine SOX Section 302 certification
      that explicitly states a reporting-period end date of June 30, 2025. The
      relevant date is the reporting-period end date, not merely a signature or
      filing date.

      Document:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        is_matching_certification: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: extract_officers_and_period_type
    type: map
    optimize: true
    prompt: |
      Extract all certifying officer names and classify the reporting-period type
      as exactly annual, quarterly, or other.

      Certification:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        certifying_officers: list[string]
        reporting_period_type: string
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: project_answer_fields
    type: code_map
    code: |
      def transform(doc):
          return {
              "document_id": str(doc.get("doc_id") or ""),
              "certifying_officers": doc.get("certifying_officers") or [],
              "reporting_period_type": str(doc.get("reporting_period_type") or ""),
          }

pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations:
        - filter_section_302_june_2025
        - extract_officers_and_period_type
        - project_answer_fields
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-003.json
