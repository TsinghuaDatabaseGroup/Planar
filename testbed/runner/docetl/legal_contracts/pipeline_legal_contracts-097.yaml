datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_ex31_certifications
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is an EX-31 SOX Section 302 certification.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_ex31_certification: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_certification_company_officer
    type: map
    optimize: true
    prompt: |
      Return a canonical certified-company key, the stated certified-company
      name, certifying officer name, and input document ID.

      Input document ID: {{ input.doc_id }}
      Certification:
      {{ input.contents }}
    output:
      mode: structured_output
      schema: {company_key: string, company_name: string, certifying_officer: string, document_id: string}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: group_certifications_by_company
    type: code_reduce
    reduce_key: company_key
    code: |
      def transform(items):
          return {
              "company": min(str(item.get("company_name") or "") for item in items),
              "certifying_officers": sorted({str(item.get("certifying_officer") or "").strip() for item in items if str(item.get("certifying_officer") or "").strip()}),
              "certification_document_count": len({str(item.get("document_id") or "") for item in items if str(item.get("document_id") or "")}),
          }
  - name: filter_at_least_two_officers
    type: code_filter
    code: |
      def transform(doc):
          return len(doc.get("certifying_officers") or []) >= 2

  - name: filter_ex19_without_three_prohibitions
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is an EX-19 insider-trading policy in which
      no prohibition against hedging, short sales, or pledging is present.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_policy_without_three_prohibitions: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_policy_company_key
    type: map
    optimize: true
    prompt: |
      Return the canonical policy-company key, resolving clear issuer
      abbreviations when the document establishes the identity.

      Policy:
      {{ input.contents }}
    output: {mode: structured_output, schema: {company_key: string}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: deduplicate_policy_companies
    type: code_reduce
    reduce_key: company_key
    code: |
      def transform(items):
          return {}

  - name: join_certifications_and_policies
    type: equijoin
    deterministic: true
    blocking_conditions:
      - left["company_key"] == right["company_key"]
  - name: project_company_certifications
    type: code_map
    code: |
      def transform(doc):
          return {
              "company": doc.get("company"),
              "certifying_officers": doc.get("certifying_officers") or [],
              "certification_document_count": doc.get("certification_document_count"),
          }
pipeline:
  steps:
    - name: certification_companies
      input: contract_exhibits
      operations: [filter_ex31_certifications, extract_certification_company_officer, group_certifications_by_company, filter_at_least_two_officers]
    - name: policy_companies
      input: contract_exhibits
      operations: [filter_ex19_without_three_prohibitions, extract_policy_company_key, deduplicate_policy_companies]
    - name: matched_companies
      operations:
        - join_certifications_and_policies: {left: certification_companies, right: policy_companies}
    - name: answer
      input: matched_companies
      operations: [project_company_certifications]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-097.json
