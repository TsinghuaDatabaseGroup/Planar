datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_section_302_certifications
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a SOX Section 302 certification.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_section_302_certification: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_section_302_fields
    type: map
    optimize: true
    prompt: |
      Extract the input document ID, a normalized company identity key, the
      company-name variant exactly as stated, the explicitly stated reporting
      period type, the reporting period end date normalized to YYYY-MM-DD, and
      all certifying officer names. Set each reporting-period availability flag
      to false when that field is not explicitly stated, using an empty string
      only as a placeholder.

      Input document ID: {{ input.doc_id }}
      Certification:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        document_id: string
        company_key: string
        company_name_variant: string
        reporting_period_type_available: boolean
        reporting_period_type_value: string
        reporting_period_end_date_available: boolean
        reporting_period_end_date_value: string
        certifying_officers: "list[string]"
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: normalize_section_302_period
    type: code_map
    code: |
      def transform(doc):
          return {
              "reporting_period_type": str(doc.get("reporting_period_type_value") or "") if doc.get("reporting_period_type_available") is True else None,
              "reporting_period_end_date": str(doc.get("reporting_period_end_date_value") or "") if doc.get("reporting_period_end_date_available") is True else None,
          }
  - name: filter_complete_section_302_period
    type: code_filter
    code: |
      def transform(doc):
          return doc.get("reporting_period_type") is not None and doc.get("reporting_period_end_date") is not None
  - name: group_section_302_certifications
    type: code_reduce
    reduce_key: [company_key, reporting_period_type, reporting_period_end_date]
    code: |
      def transform(items):
          officers = sorted({str(name).strip() for item in items for name in (item.get("certifying_officers") or []) if str(name).strip()})
          return {
              "company_name_302": min(str(item.get("company_name_variant") or "") for item in items),
              "section_302_document_ids": sorted(str(item.get("document_id") or "") for item in items),
              "section_302_certifying_officers": officers,
          }

  - name: filter_section_906_certifications
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a SOX Section 906 certification.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_section_906_certification: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_section_906_fields
    type: map
    optimize: true
    prompt: |
      Extract the input document ID, a normalized company identity key, the
      company-name variant exactly as stated, the explicitly stated reporting
      period type, the reporting period end date normalized to YYYY-MM-DD, and
      all certifying officer names. Set each reporting-period availability flag
      to false when that field is not explicitly stated, using an empty string
      only as a placeholder.

      Input document ID: {{ input.doc_id }}
      Certification:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        document_id: string
        company_key: string
        company_name_variant: string
        reporting_period_type_available: boolean
        reporting_period_type_value: string
        reporting_period_end_date_available: boolean
        reporting_period_end_date_value: string
        certifying_officers: "list[string]"
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: normalize_section_906_period
    type: code_map
    code: |
      def transform(doc):
          return {
              "reporting_period_type": str(doc.get("reporting_period_type_value") or "") if doc.get("reporting_period_type_available") is True else None,
              "reporting_period_end_date": str(doc.get("reporting_period_end_date_value") or "") if doc.get("reporting_period_end_date_available") is True else None,
          }
  - name: filter_complete_section_906_period
    type: code_filter
    code: |
      def transform(doc):
          return doc.get("reporting_period_type") is not None and doc.get("reporting_period_end_date") is not None
  - name: group_section_906_certifications
    type: code_reduce
    reduce_key: [company_key, reporting_period_type, reporting_period_end_date]
    code: |
      def transform(items):
          officers = sorted({str(name).strip() for item in items for name in (item.get("certifying_officers") or []) if str(name).strip()})
          return {
              "company_name_906": min(str(item.get("company_name_variant") or "") for item in items),
              "section_906_document_ids": sorted(str(item.get("document_id") or "") for item in items),
              "section_906_certifying_officers": officers,
          }

  - name: join_certification_families
    type: equijoin
    deterministic: true
    blocking_conditions:
      - left["company_key"] == right["company_key"] and left["reporting_period_type"] == right["reporting_period_type"] and left["reporting_period_end_date"] == right["reporting_period_end_date"]
  - name: project_matching_certifications
    type: code_map
    code: |
      def transform(doc):
          return {
              "company_name": min(str(doc.get("company_name_302") or ""), str(doc.get("company_name_906") or "")),
              "reporting_period_type": doc.get("reporting_period_type_left"),
              "reporting_period_end_date": doc.get("reporting_period_end_date_left"),
              "section_302_document_ids": doc.get("section_302_document_ids") or [],
              "section_302_certifying_officers": doc.get("section_302_certifying_officers") or [],
              "section_906_document_ids": doc.get("section_906_document_ids") or [],
              "section_906_certifying_officers": doc.get("section_906_certifying_officers") or [],
          }
pipeline:
  steps:
    - name: section_302_groups
      input: contract_exhibits
      operations: [filter_section_302_certifications, extract_section_302_fields, normalize_section_302_period, filter_complete_section_302_period, group_section_302_certifications]
    - name: section_906_groups
      input: contract_exhibits
      operations: [filter_section_906_certifications, extract_section_906_fields, normalize_section_906_period, filter_complete_section_906_period, group_section_906_certifications]
    - name: matched_certification_groups
      operations:
        - join_certification_families: {left: section_302_groups, right: section_906_groups}
    - name: projected_certification_groups
      input: matched_certification_groups
      operations:
        - project_matching_certifications
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-076.json
