datasets:
  contract_exhibits:
    type: file
    path: contract_exhibit_full.json

default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}

optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs:
    api_base: ${LLM_API_BASE}
    temperature: 0
    max_tokens: 2048
    timeout: 120
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  map:
    plan_types: [chunk, proj_synthesis, glean]
  equijoin:
    target_recall: 0.95

operations:
  - name: filter_exhibit_21_subsidiary_lists
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a genuine Exhibit 21 subsidiary-list
      filing. Exclude Exhibit 22 guarantor or co-issuer lists and narrative
      documents that merely mention subsidiaries.

      Document:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        is_exhibit_21_subsidiary_list: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: extract_subsidiary_statistics
    type: map
    optimize: true
    prompt: |
      Extract the number of listed subsidiary legal entities and the deduplicated
      set of incorporation or organization jurisdictions from this filing.
      Canonicalize equivalent jurisdiction names. Set
      has_target_offshore_jurisdiction=true if the set contains the Cayman
      Islands, British Virgin Islands (BVI), or Luxembourg.

      Filing:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        subsidiary_count: integer
        jurisdictions: list[string]
        has_target_offshore_jurisdiction: boolean
    litellm_completion_kwargs:
      temperature: 0
      max_tokens: 4096
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - name: aggregate_subsidiary_statistics
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          from collections import Counter
          from statistics import median

          filing_counts = Counter()
          subsidiary_counts = []
          offshore_count = 0
          for item in items:
              subsidiary_counts.append(int(item.get("subsidiary_count") or 0))
              jurisdictions = {
                  str(value).strip()
                  for value in (item.get("jurisdictions") or [])
                  if str(value).strip()
              }
              filing_counts.update(jurisdictions)
              if item.get("has_target_offshore_jurisdiction") is True:
                  offshore_count += 1

          highest = max(filing_counts.values(), default=0)
          prevalent = sorted(
              name for name, count in filing_counts.items() if count == highest
          )
          total = len(items)
          return {
              "most_prevalent_jurisdictions": prevalent,
              "jurisdiction_filing_count": highest,
              "min_subsidiary_count": min(subsidiary_counts, default=0),
              "median_subsidiary_count": median(subsidiary_counts) if subsidiary_counts else 0,
              "max_subsidiary_count": max(subsidiary_counts, default=0),
              "offshore_filing_percentage": round(100.0 * offshore_count / total, 1) if total else 0.0,
          }

pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations:
        - filter_exhibit_21_subsidiary_lists
        - extract_subsidiary_statistics
        - aggregate_subsidiary_statistics
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-004.json
