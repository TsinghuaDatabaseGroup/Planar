datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_nda_or_confidentiality_agreements
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a non-disclosure or confidentiality
      agreement.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_nda_or_confidentiality_agreement: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: filter_unaided_memory_residual_and_law
    type: filter
    optimize: true
    prompt: |
      Keep this agreement only if it contains a residual-information clause
      permitting use of information retained in unaided memory and expressly
      states a governing law.

      Agreement:
      {{ input.contents }}
    output: {mode: structured_output, schema: {has_qualifying_residual_clause_and_law: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_document_direction_and_law
    type: map
    optimize: true
    prompt: |
      Return the input document ID, nondisclosure direction, and governing law.

      Input document ID: {{ input.doc_id }}
      Agreement:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        document_id: string
        non_disclosure_direction: string
        governing_law: string
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_nda_or_confidentiality_agreements, filter_unaided_memory_residual_and_law, extract_document_direction_and_law]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-060.json
