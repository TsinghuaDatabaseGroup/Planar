datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_over_7500_words
    type: code_filter
    code: |
      def transform(doc):
          return len(str(doc.get("contents") or "").split()) > 7500
  - name: filter_insider_policies_with_family_coverage
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a substantive insider-trading policy that
      explicitly extends its trading restrictions to family or household members
      of covered persons.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_matching_policy: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_company_name
    type: map
    optimize: true
    prompt: |
      Extract the company name stated by this insider-trading policy.

      Policy:
      {{ input.contents }}
    output: {mode: structured_output, schema: {company_name: string}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: project_answer_fields
    type: code_map
    code: |
      def transform(doc):
          return {"document_id": str(doc.get("doc_id") or ""), "company_name": str(doc.get("company_name") or "")}
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_over_7500_words, filter_insider_policies_with_family_coverage, extract_company_name, project_answer_fields]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-007.json
