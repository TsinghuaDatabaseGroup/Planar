datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_section_302_annual_2024
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a genuine SOX Section 302 certification
      that explicitly covers an annual reporting period ended December 31, 2024.
      Do not use a signature or filing date as the reporting-period date.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_matching_certification: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_certifying_officers
    type: map
    optimize: true
    prompt: |
      Extract all certifying officer names from this certification.

      Certification:
      {{ input.contents }}
    output: {mode: structured_output, schema: {certifying_officers: "list[string]"}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: project_answer_fields
    type: code_map
    code: |
      def transform(doc):
          return {"document_id": str(doc.get("doc_id") or ""), "certifying_officers": doc.get("certifying_officers") or []}
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_section_302_annual_2024, extract_certifying_officers, project_answer_fields]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-011.json
