datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_ndas
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a non-disclosure or confidentiality
      agreement.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_nda: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: filter_law_long_term_and_residual_clause
    type: filter
    optimize: true
    prompt: |
      Keep this agreement only if it expressly states a governing law, has a
      confidentiality term of at least 60 months or perpetual, and contains a
      residual-information clause.

      Agreement:
      {{ input.contents }}
    output: {mode: structured_output, schema: {has_required_terms: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_law_bucket_and_copy_retention
    type: map
    optimize: true
    prompt: |
      Extract the governing law, classify the confidentiality term as exactly
      "fixed_months" or "perpetual", and determine whether the agreement permits
      retention of one archival copy after return or destruction.

      Agreement:
      {{ input.contents }}
    output:
      mode: structured_output
      schema: {governing_law: string, term_bucket: string, allows_one_copy_retention: boolean}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: project_answer_fields
    type: code_map
    code: |
      def transform(doc):
          return {"document_id": str(doc.get("doc_id") or ""), "governing_law": str(doc.get("governing_law") or ""), "term_bucket": str(doc.get("term_bucket") or ""), "allows_one_copy_retention": doc.get("allows_one_copy_retention") is True}
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_ndas, filter_law_long_term_and_residual_clause, extract_law_bucket_and_copy_retention, project_answer_fields]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-047.json
