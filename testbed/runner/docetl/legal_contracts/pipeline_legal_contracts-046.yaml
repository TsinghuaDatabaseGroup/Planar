datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_delaware_ndas
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a non-disclosure or confidentiality
      agreement expressly governed by Delaware law.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_delaware_nda: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: filter_long_term_and_all_carve_outs
    type: filter
    optimize: true
    prompt: |
      Keep this agreement only if its confidentiality term is at least three years
      or perpetual and it contains all six standard confidentiality carve-outs.

      Agreement:
      {{ input.contents }}
    output: {mode: structured_output, schema: {has_required_term_and_carve_outs: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_term_and_direction
    type: map
    optimize: true
    prompt: |
      Normalize the confidentiality term to years, returning decimal text for a
      finite term or exactly "perpetual" for an indefinite term. Classify the
      nondisclosure obligation as exactly mutual or unilateral.

      Agreement:
      {{ input.contents }}
    output:
      mode: structured_output
      schema: {term_duration_years_raw: string, non_disclosure_direction: string}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: project_answer_fields
    type: code_map
    code: |
      def transform(doc):
          raw = str(doc.get("term_duration_years_raw") or "").strip()
          term = "perpetual" if raw.casefold() == "perpetual" else float(raw)
          return {"document_id": str(doc.get("doc_id") or ""), "term_duration_years": term, "non_disclosure_direction": str(doc.get("non_disclosure_direction") or "")}
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_delaware_ndas, filter_long_term_and_all_carve_outs, extract_term_and_direction, project_answer_fields]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-046.json
