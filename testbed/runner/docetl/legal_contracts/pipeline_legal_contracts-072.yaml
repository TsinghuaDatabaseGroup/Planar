datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_family_covering_insider_policies
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is an insider-trading policy that covers
      family or household members.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_family_covering_insider_policy: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_policy_controls_and_date
    type: map
    optimize: true
    prompt: |
      Return the input document ID as document_name, the policy title, whether
      Rule 10b5-1 plans are discussed, whether short sales are prohibited,
      whether pledging is prohibited, and the stated approval or effective date
      normalized to YYYY-MM-DD. Set policy_date_available=false if neither date
      is stated, using an empty string only as a placeholder.

      Input document ID: {{ input.doc_id }}
      Policy:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        document_name: string
        policy_title: string
        discusses_10b5_1: boolean
        prohibits_short_sales: boolean
        prohibits_pledging: boolean
        policy_date_available: boolean
        policy_date_value: string
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: normalize_policy_date
    type: code_map
    code: |
      def transform(doc):
          return {"policy_date": str(doc.get("policy_date_value") or "") if doc.get("policy_date_available") is True else None}
  - name: filter_required_controls_before_2024
    type: code_filter
    code: |
      def transform(doc):
          return doc.get("discusses_10b5_1") is True and doc.get("prohibits_short_sales") is True and doc.get("prohibits_pledging") is True and doc.get("policy_date") is not None and str(doc["policy_date"]) < "2024-01-01"
  - name: order_qualifying_policies
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          ordered = sorted(items, key=lambda item: (str(item.get("policy_date") or ""), str(item.get("document_name") or "")))
          return {"rows": [{"document_name": item.get("document_name"), "policy_title": item.get("policy_title"), "policy_date": item.get("policy_date")} for item in ordered]}
  - name: unnest_qualifying_policies
    type: unnest
    unnest_key: rows
    recursive: true
    depth: 2
    expand_fields: [document_name, policy_title, policy_date]
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_family_covering_insider_policies, extract_policy_controls_and_date, normalize_policy_date, filter_required_controls_before_2024, order_qualifying_policies, unnest_qualifying_policies]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-072.json
