datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_mutual_ndas
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a mutual non-disclosure agreement.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_mutual_nda: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: filter_source_code_or_software_definition
    type: filter
    optimize: true
    prompt: |
      Keep this agreement only if its definition of confidential information
      explicitly includes source code or software.

      Agreement:
      {{ input.contents }}
    output: {mode: structured_output, schema: {includes_source_code_or_software: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: filter_archival_copy_retention
    type: filter
    optimize: true
    prompt: |
      Keep this agreement only if it permits the recipient to retain at least one
      archival copy of materials after termination.

      Agreement:
      {{ input.contents }}
    output: {mode: structured_output, schema: {allows_archival_copy: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: answer_existence
    type: code_reduce
    reduce_key: _all
    code: |
      def transform(items):
          return {"answer": "Yes" if len(items) > 0 else "No"}
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_mutual_ndas, filter_source_code_or_software_definition, filter_archival_copy_retention, answer_existence]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-040.json
