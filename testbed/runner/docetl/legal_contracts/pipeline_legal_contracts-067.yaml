datasets:
  contract_exhibits: {type: file, path: contract_exhibit_full.json}
default_model: Qwen3.5-397B-A17B
default_lm_api_base: ${LLM_API_BASE}
optimizer_config:
  rewrite_agent_model: Qwen3.5-397B-A17B
  judge_agent_model: Qwen3.5-397B-A17B
  litellm_kwargs: {api_base: "${LLM_API_BASE}", temperature: 0, max_tokens: 2048, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  map: {plan_types: [chunk, proj_synthesis, glean]}
  equijoin: {target_recall: 0.95}
operations:
  - name: filter_compensation_recovery_policies
    type: filter
    optimize: true
    prompt: |
      Keep this document only if it is a clawback or compensation-recovery
      policy.

      Document:
      {{ input.contents }}
    output: {mode: structured_output, schema: {is_compensation_recovery_policy: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: filter_beyond_sec_with_company
    type: filter
    optimize: true
    prompt: |
      Keep this policy only if it goes beyond baseline SEC clawback requirements
      and identifies a company.

      Policy:
      {{ input.contents }}
    output: {mode: structured_output, schema: {goes_beyond_sec_and_identifies_company: boolean}}
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: extract_policy_version_and_scope
    type: map
    optimize: true
    prompt: |
      Return the input document ID, primary stated company, latest identifiable
      policy version date normalized to YYYY-MM-DD, trigger pattern as
      restatement_only or restatement_and_misconduct, and whether covered persons
      extend beyond executive officers. Set policy_version_date_available=false
      if no version date is identifiable, using an empty string only as a
      placeholder.

      Input document ID: {{ input.doc_id }}
      Policy:
      {{ input.contents }}
    output:
      mode: structured_output
      schema:
        policy_document_id: string
        company: string
        policy_version_date_available: boolean
        policy_version_date_value: string
        trigger_pattern: "enum[restatement_only, restatement_and_misconduct]"
        coverage_extends_beyond_executive_officers: boolean
    litellm_completion_kwargs: {temperature: 0, max_tokens: 4096, timeout: 120, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - name: normalize_company_and_version_date
    type: code_map
    code: |
      def transform(doc):
          import re
          suffixes = {"inc", "incorporated", "corporation", "corp", "company", "co", "limited", "ltd", "llc", "plc", "lp", "llp"}
          tokens = re.findall(r"[a-z0-9]+", str(doc.get("company") or "").casefold())
          while tokens and tokens[-1] in suffixes:
              tokens.pop()
          return {
              "normalized_company": " ".join(tokens),
              "policy_version_date": str(doc.get("policy_version_date_value") or "") if doc.get("policy_version_date_available") is True else None,
          }
  - name: select_latest_company_policy
    type: code_reduce
    reduce_key: normalized_company
    code: |
      def transform(items):
          ordered = sorted(items, key=lambda item: str(item.get("policy_document_id") or ""))
          ordered.sort(key=lambda item: (item.get("policy_version_date") is not None, str(item.get("policy_version_date") or "")), reverse=True)
          chosen = ordered[0]
          return {
              "company": chosen.get("company"),
              "trigger_pattern": chosen.get("trigger_pattern"),
              "coverage_extends_beyond_executive_officers": chosen.get("coverage_extends_beyond_executive_officers"),
          }
pipeline:
  steps:
    - name: process
      input: contract_exhibits
      operations: [filter_compensation_recovery_policies, filter_beyond_sec_with_company, extract_policy_version_and_scope, normalize_company_and_version_date, select_latest_company_policy]
  output:
    type: file
    path: raw_outputs/legal_contracts/output_legal_contracts-067.json
